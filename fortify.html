<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fortify — Strength in Every Stitch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Montserrat:wght@400;500;600;700&display=swap');

:root{
  --navy:#0F1B2A;
  --gold:#B7844A;
  --gold-light:#D6A96F;
  --black:#111111;
  --cream:#F7F5F1;
  --white:#FFFFFF;
  --gray:#7A7A7A;
  --line: rgba(183,132,74,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Montserrat',sans-serif;
  color:var(--black);
  background:var(--cream);
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Cormorant Garamond',serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
img{max-width:100%; display:block;}

/* ===== Layout shells ===== */
.container{max-width:1180px; margin:0 auto; padding:0 28px;}
.topbar{background:var(--navy); color:var(--cream); font-size:11px; letter-spacing:.12em; text-align:center; padding:7px 0; text-transform:uppercase;}
header.site{background:var(--navy); position:sticky; top:0; z-index:50; border-bottom:1px solid rgba(183,132,74,.25);}
.nav-row{display:flex; align-items:center; justify-content:space-between; padding:16px 0;}
.logo{display:flex; flex-direction:column; align-items:center; color:var(--cream); line-height:1;}
.logo .word{font-family:'Cormorant Garamond',serif; font-size:26px; letter-spacing:.22em; font-weight:600;}
.logo .tag{font-size:8px; letter-spacing:.25em; color:var(--gold-light); margin-top:3px; text-transform:uppercase;}
.navlinks{display:flex; gap:30px; font-size:12px; letter-spacing:.08em; text-transform:uppercase;}
.navlinks a{color:var(--cream); opacity:.85; padding-bottom:4px; border-bottom:1px solid transparent; transition:.2s;}
.navlinks a:hover, .navlinks a.active{opacity:1; border-color:var(--gold);}
.navicons{display:flex; align-items:center; gap:18px;}
.navicons button{background:none; color:var(--cream); font-size:13px; letter-spacing:.05em; display:flex; align-items:center; gap:6px;}
.cart-badge{background:var(--gold); color:var(--navy); font-size:10px; font-weight:700; border-radius:50%; width:17px; height:17px; display:inline-flex; align-items:center; justify-content:center;}

/* Arch shape motif — echoes the bag-handle logo */
.arch-frame{
  border-top-left-radius:120px 70px;
  border-top-right-radius:120px 70px;
  overflow:hidden;
}

/* ===== Hero ===== */
.hero{background:var(--navy); color:var(--cream); position:relative; overflow:hidden;}
.hero-inner{display:grid; grid-template-columns:1.05fr .95fr; gap:50px; align-items:center; padding:80px 0 90px;}
.eyebrow{font-size:11px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-light); margin-bottom:18px; display:flex; align-items:center; gap:12px;}
.eyebrow:before, .eyebrow:after{content:''; width:26px; height:1px; background:var(--gold);}
.hero h1{font-family:'Cormorant Garamond',serif; font-size:58px; font-weight:600; line-height:1.05; margin-bottom:20px;}
.hero h1 em{font-style:italic; color:var(--gold-light);}
.hero p{color:#c9d0d9; font-size:15px; line-height:1.75; max-width:440px; margin-bottom:32px;}
.btn{display:inline-flex; align-items:center; gap:10px; padding:14px 30px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; font-weight:600; transition:.2s;}
.btn-gold{background:var(--gold); color:var(--navy);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{background:transparent; border:1px solid var(--gold); color:var(--cream);}
.btn-outline:hover{background:rgba(183,132,74,.15);}
.btn-dark{background:var(--navy); color:var(--cream);}
.btn-dark:hover{background:#1c2c42;}
.btn-block{width:100%; justify-content:center;}
.hero-visual{
  position:relative; height:420px; background:linear-gradient(160deg,#1a2b42,#0c1420);
  border-top-left-radius:190px 110px; border-top-right-radius:190px 110px;
  display:flex; align-items:flex-end; justify-content:center; border:1px solid var(--line);
}
.hero-visual .monogram{font-family:'Cormorant Garamond',serif; font-size:210px; color:rgba(183,132,74,.22); font-weight:600; line-height:1; margin-bottom:-10px;}

/* ===== Section headers ===== */
.section{padding:78px 0;}
.section-head{text-align:center; max-width:560px; margin:0 auto 46px;}
.section-head .eyebrow{justify-content:center; color:var(--gold);}
.section-head .eyebrow:before,.section-head .eyebrow:after{background:var(--gray);}
.section-head h2{font-family:'Cormorant Garamond',serif; font-size:38px; font-weight:600;}
.section-head p{color:var(--gray); font-size:14px; margin-top:10px;}

/* category strip */
.cat-strip{background:var(--white); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.cat-grid{display:grid; grid-template-columns:repeat(8,1fr); padding:26px 0;}
.cat-item{text-align:center; border-right:1px solid #eee; padding:6px 8px; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--navy); cursor:pointer; transition:.2s;}
.cat-item:last-child{border-right:none;}
.cat-item:hover{color:var(--gold);}
.cat-item .ic{font-size:22px; margin-bottom:8px; display:block;}

/* product grid */
.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:26px;}
.pcard{background:var(--white); border:1px solid #eee; transition:.25s; cursor:pointer;}
.pcard:hover{border-color:var(--gold); box-shadow:0 14px 30px -18px rgba(15,27,42,.35); transform:translateY(-3px);}
.wish-btn{position:absolute; top:10px; right:10px; z-index:5; width:32px; height:32px; background:var(--white); border:1px solid #eee; font-size:15px; color:var(--gold); display:flex; align-items:center; justify-content:center; border-radius:50%;}
.wish-btn:hover{border-color:var(--gold);}
.pcard-img{height:200px; display:flex; align-items:center; justify-content:center; font-size:56px;}
.pcard-body{padding:16px 18px 20px;}
.pcard .cat{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:6px;}
.pcard h3{font-family:'Cormorant Garamond',serif; font-size:19px; font-weight:600; margin-bottom:6px;}
.pcard .price{font-size:14px; font-weight:600; color:var(--navy);}
.pcard .mrp{font-size:12px; color:var(--gray); text-decoration:line-through; margin-left:8px; font-weight:400;}
.pcard .addbtn{margin-top:12px; width:100%; padding:9px; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; background:var(--navy); color:var(--cream);}
.pcard .addbtn:hover{background:var(--gold); color:var(--navy);}

/* filters bar */
.filters{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:40px;}
.chip{padding:8px 18px; font-size:11px; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--gray); color:var(--navy); background:transparent;}
.chip.active{background:var(--navy); color:var(--cream); border-color:var(--navy);}

/* story band */
.story{background:var(--navy); color:var(--cream);}
.story-grid{display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; padding:80px 0;}
.story h2{font-family:'Cormorant Garamond',serif; font-size:36px; margin-bottom:18px;}
.story p{color:#c9d0d9; font-size:14.5px; line-height:1.85; margin-bottom:16px;}
.story-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:30px;}
.stat b{font-family:'Cormorant Garamond',serif; font-size:32px; color:var(--gold-light); display:block;}
.stat span{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#9aa5b3;}

/* footer */
footer{background:var(--navy); color:#c9d0d9; padding:60px 0 24px; border-top:1px solid var(--line);}
.foot-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1.2fr; gap:40px; padding-bottom:40px;}
footer h4{color:var(--cream); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:18px;}
footer ul{list-style:none;}
footer li{margin-bottom:10px; font-size:13px;}
footer li a:hover{color:var(--gold-light);}
.foot-bottom{border-top:1px solid rgba(255,255,255,.1); padding-top:20px; text-align:center; font-size:11px; color:#8891a0; letter-spacing:.05em;}

/* ===== Auth pages ===== */
.auth-wrap{min-height:70vh; display:flex; align-items:center; justify-content:center; padding:70px 20px;}
.auth-card{background:var(--white); width:100%; max-width:420px; padding:44px 40px; border:1px solid #eee; box-shadow:0 30px 60px -30px rgba(15,27,42,.25);}
.auth-card h2{font-family:'Cormorant Garamond',serif; font-size:30px; text-align:center; margin-bottom:6px;}
.auth-card .sub{text-align:center; color:var(--gray); font-size:12.5px; margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--navy); margin-bottom:7px; font-weight:600;}
.field input, .field select, .field textarea{
  width:100%; padding:11px 13px; border:1px solid #ddd; font-size:13.5px; font-family:inherit; background:#fbfbfa;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--gold);}
.auth-links{display:flex; justify-content:space-between; font-size:12px; margin:14px 0 22px; color:var(--gray);}
.auth-links a{color:var(--navy); font-weight:600;}
.auth-links a:hover{color:var(--gold);}
.divider{display:flex; align-items:center; gap:12px; margin:22px 0; color:var(--gray); font-size:11px; text-transform:uppercase; letter-spacing:.08em;}
.divider:before,.divider:after{content:''; flex:1; height:1px; background:#e5e5e5;}
.google-btn{width:100%; padding:12px; border:1px solid #ddd; background:var(--white); display:flex; align-items:center; justify-content:center; gap:10px; font-size:13px; font-weight:600; color:#333;}
.google-btn:hover{background:#f7f7f7;}
.gicon{width:18px; height:18px;}
.foot-note{text-align:center; font-size:12.5px; color:var(--gray); margin-top:22px;}
.msg{font-size:12px; padding:10px 12px; margin-bottom:16px; border-left:3px solid var(--gold); background:#faf3ea; color:var(--navy);}
.msg.err{border-color:#b33; background:#fbecec; color:#7a1f1f;}
.msg.ok{border-color:#3a7a4c; background:#eaf6ee; color:#215330;}

/* ===== Cart / checkout ===== */
.page-head{background:var(--white); border-bottom:1px solid #eee; padding:34px 0;}
.page-head h1{font-family:'Cormorant Garamond',serif; font-size:32px;}
.crumb{font-size:11px; color:var(--gray); letter-spacing:.05em; margin-top:6px;}
.crumb a:hover{color:var(--gold);}
.cart-layout{display:grid; grid-template-columns:1.7fr 1fr; gap:36px; align-items:start;}
.cart-row{display:grid; grid-template-columns:70px 1fr auto auto auto; gap:16px; align-items:center; padding:18px 0; border-bottom:1px solid #eee;}
.cart-thumb{width:64px; height:64px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:26px; border:1px solid #eee;}
.qty-box{display:flex; align-items:center; border:1px solid #ddd;}
.qty-box button{width:28px; height:28px; background:var(--cream); font-size:14px;}
.qty-box span{width:32px; text-align:center; font-size:13px;}
.remove-x{color:#a33; font-size:11px; letter-spacing:.05em; text-transform:uppercase;}
.summary-box{background:var(--white); border:1px solid #eee; padding:26px;}
.summary-box h3{font-family:'Cormorant Garamond',serif; font-size:22px; margin-bottom:18px;}
.srow{display:flex; justify-content:space-between; font-size:13px; padding:8px 0; color:var(--gray);}
.srow.total{border-top:1px solid #eee; margin-top:8px; padding-top:14px; font-weight:700; color:var(--black); font-size:15px;}
.empty-state{text-align:center; padding:80px 20px; color:var(--gray);}
.empty-state .ic{font-size:44px; margin-bottom:16px;}

/* ===== Product detail ===== */
.pd-layout{display:grid; grid-template-columns:1fr 1fr; gap:60px;}
.pd-img{height:460px; background:linear-gradient(160deg,#f0ece4,var(--cream)); display:flex; align-items:center; justify-content:center; font-size:110px; border:1px solid #eee;}
.pd-cat{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:10px;}
.pd-title{font-family:'Cormorant Garamond',serif; font-size:36px; margin-bottom:12px;}
.pd-price{font-size:22px; font-weight:700; margin-bottom:18px;}
.pd-price .mrp{font-size:15px; color:var(--gray); text-decoration:line-through; margin-left:10px; font-weight:400;}
.pd-desc{color:var(--gray); font-size:14px; line-height:1.8; margin-bottom:26px;}
.pd-meta{display:flex; gap:26px; margin:26px 0; padding:20px 0; border-top:1px solid #eee; border-bottom:1px solid #eee;}
.pd-meta div{font-size:11.5px; color:var(--gray);}
.pd-meta b{display:block; color:var(--black); font-size:12.5px; margin-bottom:3px;}
.pd-actions{display:flex; gap:14px;}

/* ===== Order / admin tables ===== */
.table{width:100%; border-collapse:collapse; background:var(--white);}
.table th{text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); padding:12px 14px; border-bottom:2px solid var(--navy);}
.table td{padding:14px; font-size:13px; border-bottom:1px solid #eee; vertical-align:middle;}
.badge{padding:4px 10px; font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:700; border-radius:2px;}
.badge.pending{background:#fdf1e0; color:#a5680c;}
.badge.confirmed{background:#e5f0ea; color:#1f6b40;}
.badge.shipped{background:#e6eefc; color:#1f4c8b;}
.icon-btn{background:none; padding:5px 8px; font-size:12px; color:var(--navy);}
.icon-btn:hover{color:var(--gold);}
.icon-btn.danger:hover{color:#b33;}

/* ===== Admin shell ===== */
.admin-shell{display:grid; grid-template-columns:220px 1fr; min-height:75vh;}
.admin-side{background:var(--navy); color:var(--cream); padding:30px 0;}
.admin-side .who{padding:0 24px 22px; border-bottom:1px solid rgba(255,255,255,.12); margin-bottom:14px;}
.admin-side .who b{display:block; font-size:14px;}
.admin-side .who span{font-size:11px; color:var(--gold-light);}
.admin-link{display:flex; align-items:center; gap:10px; padding:12px 24px; font-size:12.5px; letter-spacing:.03em; color:#c9d0d9; border-left:3px solid transparent;}
.admin-link:hover{color:var(--cream); background:rgba(255,255,255,.04);}
.admin-link.active{color:var(--cream); border-color:var(--gold); background:rgba(183,132,74,.12);}
.admin-main{padding:34px 40px; background:#fcfbf9;}
.admin-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:26px;}
.admin-head h2{font-family:'Cormorant Garamond',serif; font-size:28px;}
.modal-bg{position:fixed; inset:0; background:rgba(15,27,42,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px;}
.modal{background:var(--white); width:100%; max-width:520px; padding:32px; max-height:88vh; overflow:auto;}
.modal h3{font-family:'Cormorant Garamond',serif; font-size:24px; margin-bottom:20px;}
.modal-actions{display:flex; gap:12px; margin-top:20px;}
.form-grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.stat-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:30px;}
.stat-card{background:var(--white); border:1px solid #eee; padding:20px 22px; border-left:3px solid var(--gold);}
.stat-card b{font-family:'Cormorant Garamond',serif; font-size:28px; display:block; color:var(--navy);}
.stat-card span{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--gray);}
.toast{position:fixed; bottom:26px; right:26px; background:var(--navy); color:var(--cream); padding:14px 22px; font-size:13px; border-left:3px solid var(--gold); z-index:300; box-shadow:0 12px 30px rgba(0,0,0,.2);}

.hide{display:none !important;}
@media(max-width:900px){
  .hero-inner, .story-grid, .cart-layout, .pd-layout{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .grid{grid-template-columns:repeat(2,1fr);}
  .navlinks{display:none;}
  .admin-shell{grid-template-columns:1fr;}
  .stat-cards{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   FORTIFY — prototype store
   In-memory "backend": all data lives in JS state below and
   resets on page refresh. Structured so each function maps
   cleanly to a real API endpoint later (see comments).
========================================================= */

const ICONS = {
  'Backpacks':'🎒','Laptop Bags':'💼','Travel Bags':'🧳','Tote Bags':'👜',
  'Sling Bags':'🎒','Luggage':'🧳','Duffel Bags':'👝','School Bags':'🎒'
};

let DB = {
  users: [

  products: [

    {id:5, name:'Continental Duffel', category:'Travel Bags', price:4299, mrp:5499, desc:'Spacious weekend duffel with reinforced carry handles and a separate shoe compartment.', stock:16},

    {id:16, name:'Campus Pro School Bag', category:'School Bags', price:1899, mrp:2399, desc:'A durable, higher-capacity school bag with a dedicated laptop compartment for older students.', stock:19}
  ],
  orders: [],
  nextProductId: 17,
  nextOrderId: 1001,
  coupons: [
    {code:'WELCOME10', type:'percentage', value:10, minOrder:1000, maxDiscount:500},
    {code:'FLAT500', type:'flat', value:500, minOrder:3000},
    {code:'FREESHIP', type:'flat', value:199, minOrder:0}

    {id:1, productId:1, name:'Aditya R.', rating:5, text:'Carried this daily for six months — zippers and straps still feel brand new.', date:'12 Jul 2026'},

  nextReviewId: 4

let STATE = {
  page:'home',
  user:null,          // logged-in user object
  cart:[],            // [{productId, qty}]
  selectedProductId:null,
  shopCategory:'All',
  authMsg:null,        // {type,text} shown on auth pages
  resetEmail:null, resetOtp:null,  // forgot-password flow
  adminTab:'dashboard',
  adminEditingId:null,
  lastOrder:null,
  toast:null,
  wishlist:[],          // [productId]
  appliedCoupon:null,   // {code, discount}
  couponError:null
};

function go(page, extra){ STATE.page = page; Object.assign(STATE, extra||{}); STATE.authMsg=null; window.scrollTo(0,0); render(); }
function showToast(text){ STATE.toast=text; render(); setTimeout(()=>{STATE.toast=null; render();}, 2200); }

/* ---------- helpers ---------- */
function fmt(n){ return '₹' + n.toLocaleString('en-IN'); }
function findProduct(id){ return DB.products.find(p=>p.id===id); }
function cartCount(){ return STATE.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal(){ return STATE.cart.reduce((s,i)=>{const p=findProduct(i.productId); return s + (p?p.price*i.qty:0);},0); }

function addToCart(id){
  const row = STATE.cart.find(i=>i.productId===id);
  if(row) row.qty++; else STATE.cart.push({productId:id, qty:1});
  showToast('Added to cart');
}
function setQty(id, delta){
  const row = STATE.cart.find(i=>i.productId===id);
  if(!row) return;
  row.qty += delta;
  if(row.qty<=0) STATE.cart = STATE.cart.filter(i=>i.productId!==id);
  render();
}
function removeFromCart(id){ STATE.cart = STATE.cart.filter(i=>i.productId!==id); render(); }

/* ---------- wishlist ---------- */
function isWishlisted(id){ return STATE.wishlist.includes(id); }
function toggleWishlist(id){
  if(!STATE.user){ showToast('Sign in to save items to your wishlist'); go('login'); return; }
  if(isWishlisted(id)){
    STATE.wishlist = STATE.wishlist.filter(x=>x!==id);
    showToast('Removed from wishlist');
  } else {
    STATE.wishlist.push(id);
    showToast('Saved to wishlist');
  }
  render();
}

/* ---------- coupons ---------- */
function applyCoupon(code){
  const c = DB.coupons.find(x=>x.code===String(code).toUpperCase().trim());
  const subtotal = cartTotal();
  if(!c){ STATE.couponError='Invalid coupon code.'; render(); return; }
  if(subtotal < c.minOrder){ STATE.couponError=`Minimum order value for this coupon is ${fmt(c.minOrder)}.`; render(); return; }
  let discount = c.type==='flat' ? c.value : Math.round(subtotal * c.value/100);
  if(c.maxDiscount) discount = Math.min(discount, c.maxDiscount);
  discount = Math.min(discount, subtotal);
  STATE.appliedCoupon = {code:c.code, discount};
  STATE.couponError = null;
  render();
}
function removeCoupon(){ STATE.appliedCoupon=null; STATE.couponError=null; render(); }
function orderTotals(){
  const subtotal = cartTotal();
  const shipping = subtotal>4000 ? 0 : 199;
  const discount = STATE.appliedCoupon ? STATE.appliedCoupon.discount : 0;
  return {subtotal, shipping, discount, grandTotal: Math.max(0, subtotal + shipping - discount)};
}

/* ---------- reviews ---------- */
function productReviews(id){ return DB.reviews.filter(r=>r.productId===id).sort((a,b)=>b.id-a.id); }
function avgRating(id){
  const rs = productReviews(id);
  if(rs.length===0) return null;
  return (rs.reduce((s,r)=>s+r.rating,0)/rs.length).toFixed(1);
}
function addReview(productId, rating, text){
  if(!STATE.user){ showToast('Sign in to leave a review'); go('login'); return; }
  DB.reviews.push({id:DB.nextReviewId++, productId, name:STATE.user.name, rating:Number(rating), text, date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});
  showToast('Review posted — thank you');
  render();
}

/* ---------- auth (simulated) ---------- */
function doLogin(email, password){
  const u = DB.users.find(x=>x.email.toLowerCase()===String(email).toLowerCase() && x.password===password);
  if(!u){ STATE.authMsg={type:'err', text:'Incorrect email or password.'}; render(); return; }
  STATE.user = u;
  go('home');
  showToast('Welcome back, ' + u.name.split(' ')[0]);
}
function doSignup(name,email,password){
  if(DB.users.some(x=>x.email.toLowerCase()===email.toLowerCase())){
    STATE.authMsg={type:'err', text:'An account with this email already exists.'}; render(); return;
  }
  const u = {name, email, password, role:'customer'};
  DB.users.push(u);
  STATE.user = u;
  go('home');
  showToast('Account created — welcome, ' + name.split(' ')[0]);
}
function doGoogleAuth(){
  // Simulated OAuth — a real integration exchanges a Google ID token
  // server-side (Passport/Firebase Auth) and creates/looks up the user there.
  const email = 'google.user@gmail.com';
  let u = DB.users.find(x=>x.email===email);
  if(!u){ u = {name:'Google User', email, password:null, role:'customer'}; DB.users.push(u); }
  STATE.user = u;
  go('home');
  showToast('Signed in with Google');
}
function doLogout(){ STATE.user=null; STATE.cart=[]; STATE.wishlist=[]; STATE.appliedCoupon=null; STATE.couponError=null; go('home'); }

function requestReset(email){
  const u = DB.users.find(x=>x.email.toLowerCase()===email.toLowerCase());
  if(!u){ STATE.authMsg={type:'err', text:'No account found with that email.'}; render(); return; }
  STATE.resetEmail = email;
  STATE.resetOtp = String(Math.floor(100000+Math.random()*900000));
  STATE.authMsg = {type:'ok', text:'In production this code is emailed to you. For this prototype, your code is ' + STATE.resetOtp + '.'};
  go('reset-otp');
}
function verifyOtpAndReset(code, newPass){
  if(code !== STATE.resetOtp){ STATE.authMsg={type:'err', text:'Incorrect code. Please try again.'}; render(); return; }
  const u = DB.users.find(x=>x.email===STATE.resetEmail);
  u.password = newPass;
  STATE.authMsg = null; STATE.resetOtp=null; STATE.resetEmail=null;
  go('login', {authMsg:{type:'ok', text:'Password reset. Please sign in with your new password.'}});
}

/* ---------- checkout ---------- */
function placeOrder(address){
  const items = STATE.cart.map(i=>{
    const p = findProduct(i.productId);
    return {productId:i.productId, name:p.name, price:p.price, qty:i.qty};
  });
  const totals = orderTotals();
  const order = {
    id: DB.nextOrderId++,
    userEmail: STATE.user.email,
    items,
    address,
    subtotal: totals.subtotal,
    shipping: totals.shipping,
    couponCode: STATE.appliedCoupon ? STATE.appliedCoupon.code : null,
    discount: totals.discount,
    total: totals.grandTotal,
    status:'Pending',
    date: new Date().toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})
  };
  DB.orders.push(order);
  STATE.cart = [];
  STATE.appliedCoupon = null;
  STATE.couponError = null;
  STATE.lastOrder = order;
  go('order-success');
}

/* ---------- admin CRUD ---------- */
function adminSaveProduct(data, editingId){
  if(editingId){
    const p = findProduct(editingId);
    Object.assign(p, data);
    showToast('Product updated');
  } else {
    DB.products.push({id: DB.nextProductId++, ...data});
    showToast('Product added');
  }
  STATE.adminEditingId = null;
  go('admin', {adminTab:'products'});
}
function adminDeleteProduct(id){
  DB.products = DB.products.filter(p=>p.id!==id);
  showToast('Product removed');
  render();
}
function adminUpdateOrderStatus(id, status){
  const o = DB.orders.find(x=>x.id===id);
  o.status = status;
  render();
}

/* =========================================================
   EVENTS
========================================================= */
function bindEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', e=>{
      e.preventDefault();
      const page = el.getAttribute('data-nav');
      const cat = el.getAttribute('data-cat');
      const id = el.getAttribute('data-id');
      if(page==='product') go('product', {selectedProductId: Number(id)});
      else if(cat) go('shop', {shopCategory: cat});
      else go(page);
    });
  });
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', e=>{
      const action = el.getAttribute('data-action');
      const id = el.getAttribute('data-id');
      if(action==='add-cart'){ e.preventDefault(); addToCart(Number(id)); }
      if(action==='buy-now'){ e.preventDefault(); addToCart(Number(id)); go('cart'); }
      if(action==='qty-plus'){ setQty(Number(id), 1); }
      if(action==='qty-minus'){ setQty(Number(id), -1); }
      if(action==='remove-cart'){ removeFromCart(Number(id)); }
      if(action==='go-checkout'){ go('checkout'); }
      if(action==='logout'){ e.preventDefault(); doLogout(); }
      if(action==='google-auth'){ doGoogleAuth(); }
      if(action==='filter-cat'){ STATE.shopCategory = el.getAttribute('data-cat'); render(); }
      if(action==='admin-tab'){ e.preventDefault(); STATE.adminTab = el.getAttribute('data-tab'); render(); }
      if(action==='admin-new-product'){ STATE.adminEditingId = 'new'; render(); }
      if(action==='admin-edit-product'){ STATE.adminEditingId = Number(id); render(); }
      if(action==='admin-delete-product'){ if(confirm('Remove this product?')) adminDeleteProduct(Number(id)); }
      if(action==='modal-bg'){ if(e.target===el){ STATE.adminEditingId=null; render(); } }
      if(action==='toggle-wishlist'){ e.preventDefault(); e.stopPropagation(); toggleWishlist(Number(id)); }
      if(action==='apply-coupon'){
        e.preventDefault();
        const input = document.getElementById('coupon-input');
        if(input) applyCoupon(input.value);
      }
      if(action==='remove-coupon'){ e.preventDefault(); removeCoupon(); }
    });
  });
  const modalBg = document.querySelector('.modal-bg');
  if(modalBg){
    modalBg.addEventListener('click', e=>{ if(e.target===modalBg){ STATE.adminEditingId=null; render(); }});
  }
  document.querySelectorAll('select[data-action="admin-order-status"]').forEach(sel=>{
    sel.addEventListener('change', e=>{ adminUpdateOrderStatus(Number(sel.getAttribute('data-id')), sel.value); });
  });

  const loginForm = document.getElementById('login-form');
  if(loginForm) loginForm.addEventListener('submit', e=>{ e.preventDefault(); const f=new FormData(loginForm); doLogin(f.get('email'), f.get('password')); });

  const signupForm = document.getElementById('signup-form');
  if(signupForm) signupForm.addEventListener('submit', e=>{ e.preventDefault(); const f=new FormData(signupForm); doSignup(f.get('name'), f.get('email'), f.get('password')); });

  const forgotForm = document.getElementById('forgot-form');
  if(forgotForm) forgotForm.addEventListener('submit', e=>{ e.preventDefault(); const f=new FormData(forgotForm); requestReset(f.get('email')); });

  const otpForm = document.getElementById('otp-form');
  if(otpForm) otpForm.addEventListener('submit', e=>{ e.preventDefault(); const f=new FormData(otpForm); verifyOtpAndReset(f.get('code'), f.get('newpass')); });

  const reviewForm = document.getElementById('review-form');
  if(reviewForm) reviewForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(reviewForm);
    addReview(STATE.selectedProductId, f.get('rating'), f.get('comment'));
    reviewForm.reset();
  });

  const checkoutForm = document.getElementById('checkout-form');
  if(checkoutForm){
    const placeBtn = document.querySelector('[data-action="place-order"]');
    if(placeBtn) placeBtn.addEventListener('click', e=>{
      e.preventDefault();
      if(!checkoutForm.reportValidity()) return;
      const f = new FormData(checkoutForm);
      placeOrder({fullname:f.get('fullname'), phone:f.get('phone'), address:f.get('address'), city:f.get('city'), pin:f.get('pin'), payment:f.get('payment')});
    });
  }

  const productForm = document.getElementById('product-form');
  if(productForm) productForm.addEventListener('submit', e=>{
    e.preventDefault();
    const f = new FormData(productForm);
    adminSaveProduct({
      name: f.get('name'), category: f.get('category'),
      price: Number(f.get('price')), mrp: Number(f.get('mrp')),
      stock: Number(f.get('stock')), desc: f.get('desc')
    }, STATE.adminEditingId==='new' ? null : STATE.adminEditingId);
  });
}

render();
</script>
