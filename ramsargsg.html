<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramsar Sites Practice Bank</title>
<style>
  :root{
    --deep:#143C36; --mid:#1F5C50; --gold:#C9A227; --cream:#F4EFE1;
    --grey:#4C6B72; --clay:#B5533C; --card:#FFFDF8; --line:#DED5BC;
    --display: 'Iowan Old Style','Palatino Linotype',Georgia,serif;
    --body: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);font-family:var(--body);color:var(--deep);}
  #root{min-height:100vh;display:flex;justify-content:center;padding:32px 18px;}
  .wrap{max-width:640px;width:100%;}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .eyebrow span{letter-spacing:2px;font-size:12px;text-transform:uppercase;color:var(--grey);font-weight:600;}
  h1.title{font-family:var(--display);color:var(--deep);font-size:42px;line-height:1.05;margin:0 0 10px;}
  p.lead{color:var(--grey);font-size:15.5px;line-height:1.55;margin-bottom:28px;max-width:520px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;}
  .section-label{font-family:var(--display);font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--mid);margin-bottom:10px;font-weight:700;}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--deep);font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--body);}
  .pill.active{border-color:var(--deep);background:var(--deep);color:var(--cream);}
  .pill.gold-active{border-color:var(--gold);background:#FBF3DC;color:var(--deep);}
  .pill:disabled{color:#B9AF97;cursor:not-allowed;}
  .btn-primary{width:100%;padding:16px 20px;border-radius:14px;border:none;background:var(--deep);color:var(--cream);
    font-family:var(--display);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary:hover{opacity:.92;}
  .btn-outline{flex:1;padding:14px;border-radius:14px;border:1.5px solid var(--deep);background:transparent;color:var(--deep);
    font-family:var(--display);font-weight:700;font-size:15px;cursor:pointer;}
  .progress-outer{background:#E4DCC5;border-radius:999px;height:10px;overflow:hidden;border:1px solid var(--line);}
  .progress-inner{height:100%;background:linear-gradient(90deg,var(--mid),var(--gold));transition:width .35s ease;}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .quiz-top .cat{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--grey);font-weight:700;}
  .quiz-top .count{font-size:12.5px;color:var(--grey);font-weight:600;}
  .qhead{display:flex;gap:8px;margin-bottom:14px;}
  .qhead h2{font-family:var(--display);color:var(--deep);font-size:19px;line-height:1.4;margin:0;font-weight:700;}
  .opt-list{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .opt{text-align:left;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    color:var(--deep);font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--body);width:100%;}
  .opt:hover:not(:disabled){border-color:var(--mid);}
  .opt:disabled{cursor:default;}
  .opt.correct{background:#E9F3EA;border-color:var(--mid);}
  .opt.wrong{background:#F7E9E4;border-color:var(--clay);}
  .explain{margin-top:18px;padding:14px 16px;background:#FBF6E9;border:1px solid var(--line);border-radius:12px;display:flex;gap:8px;}
  .explain p{margin:0;font-size:14px;line-height:1.55;color:var(--grey);}
  .next-btn{width:100%;margin-top:16px;padding:14px 20px;border-radius:14px;border:none;background:var(--deep);color:var(--cream);
    font-family:var(--display);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
  .result-wrap{max-width:480px;width:100%;text-align:center;margin:40px auto;}
  .result-wrap h1{font-family:var(--display);color:var(--deep);font-size:32px;margin:0 0 6px;}
  .result-wrap p{color:var(--grey);font-size:15px;margin-bottom:26px;}
  .stat-row{display:flex;justify-content:space-between;font-size:14px;color:var(--grey);margin-bottom:8px;}
  .btn-row{display:flex;gap:10px;}
  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  svg{display:block;}
  @media (max-width:480px){ h1.title{font-size:32px;} }
</style>
</head>

  {q:"Which of the following is a Ramsar Site in Bihar?",opts:["Kabartal Wetland","Keshopur Miani","Beas Conservation Reserve","Ropar Wetland"],a:0,ex:"Kabartal Wetland (Kanwar Lake), located in Begusarai, was declared Bihar's first Ramsar Site. [SSC CGL 2021]"},
  {q:"Consider the statements: 1. 'Upper Ganga River' (Brijghat to Narora) is a Ramsar Site. 2. It was included in the list in 2005. Which is correct?",opts:["1 only","2 only","Both 1 and 2","Neither 1 nor 2"],a:2,ex:"The Upper Ganga River stretch from Brijghat to Narora was included in the Ramsar list in 2005. Both statements are correct. [SSC CGL 2022]"},
  {q:"Match List-I with List-II: a. Point Calimere  b. Kanjli  c. Ropar  d. Pulicat — with (1) Tamil Nadu (2) Punjab (3) Punjab (4) Andhra Pradesh",opts:["a-1, b-2, c-3, d-4","a-1, b-3, c-2, d-4","a-4, b-2, c-3, d-1","a-3, b-2, c-1, d-4"],a:0,ex:"Point Calimere is in Tamil Nadu (1), Kanjli and Ropar are both in Punjab (2, 3), and Pulicat is in Andhra Pradesh (4). [SSC CGL 2021]"},
  {q:"'Tso Kar' Wetland complex is located in:",opts:["Ladakh","Jammu & Kashmir","Himachal Pradesh","Sikkim"],a:0,ex:"Tso Kar Wetland Complex is located in the Changthang region of Ladakh. [SSC CGL 2022]"},
  {q:"Which is among the more recent Ramsar Sites (as of 2025/2026) per the reference material?",opts:["Magadi Kere","Nagi-Nakti Bird Sanctuaries","Bakhira","Haiderpur"],a:1,ex:"Nagi-Nakti Bird Sanctuaries (Bihar) are cited as among the recent Ramsar Site additions in the reference material. [SSC CGL 2024]"},
  {q:"'Bakhira Wildlife Sanctuary' is in which state?",opts:["Madhya Pradesh","Uttar Pradesh","Bihar","Rajasthan"],a:1,ex:"Bakhira Wildlife Sanctuary is located in the Sant Kabir Nagar district of Uttar Pradesh. [SSC CGL 2023]"}
];

/* ============================================================
   QUESTION GENERATION
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}
function pickN(arr,n,exclude){
  const pool = arr.filter(x=>x!==exclude);
  return shuffle(pool).slice(0,n);
}
function buildOptions(correct,distractors){
  const opts = shuffle([correct].concat(distractors));
  return {opts:opts, a:opts.indexOf(correct)};
}

function generateQuestions(){
  const out = [];

  SITES.forEach(function(pair){
    const site=pair[0], state=pair[1];
    const r = buildOptions(state, pickN(ALL_STATES,3,state));
    out.push({cat:"State Match", q:"In which state / UT is '"+site+"' located as a Ramsar Site?", opts:r.opts, a:r.a,
      ex: site+" is a Ramsar Site located in "+state+"."});
  });

  ALL_STATES.forEach(function(state){
    const inState = SITES.filter(function(s){return s[1]===state;}).map(function(s){return s[0];});
    const correct = shuffle(inState)[0];
    const others = SITES.filter(function(s){return s[1]!==state;}).map(function(s){return s[0];});
    const r = buildOptions(correct, pickN(others,3));
    out.push({cat:"State Match", q:"Which of the following is a Ramsar Site located in "+state+"?", opts:r.opts, a:r.a,
      ex: correct+" is a Ramsar Site located in "+state+"."});
  });

  SITES.forEach(function(pair){
    const site=pair[0], state=pair[1];
    out.push({cat:"True or False", q:"Statement: '"+site+"' is a Ramsar Site located in "+state+". Is this correct?",
      opts:["True","False"], a:0, ex:"Correct — "+site+" is indeed located in "+state+"."});
    const wrongStates = pickN(ALL_STATES,3,state);
    wrongStates.forEach(function(wrongState){
      out.push({cat:"True or False", q:"Statement: '"+site+"' is a Ramsar Site located in "+wrongState+". Is this correct?",
        opts:["True","False"], a:1, ex:"Incorrect — "+site+" is actually located in "+state+", not "+wrongState+"."});
    });
  });

  // Type C2 — "does NOT belong" style, 4-option MCQ per state with >=3 sites
  ALL_STATES.forEach(function(state){
    const inState = SITES.filter(function(s){return s[1]===state;}).map(function(s){return s[0];});
    if(inState.length < 3) return;
    const three = shuffle(inState).slice(0,3);
    const outsider = shuffle(SITES.filter(function(s){return s[1]!==state;}).map(function(s){return s[0];}))[0];
    const r = buildOptions(outsider, three);
    out.push({cat:"State Match", q:"Three of these Ramsar Sites are in "+state+". Which one is NOT?", opts:r.opts, a:r.a,
      ex: outsider+" is not in "+state+" — the other three options are."});
  });

  KEY_FACTS.forEach(function(f){
    const r = buildOptions(f.opts[f.a], f.opts.filter(function(_,i){return i!==f.a;}));
    out.push({cat:"Key Facts", q:f.q, opts:r.opts, a:r.a, ex:f.ex});
  });

  PYQ.forEach(function(f){
    out.push({cat:"Previous Year Qs", q:f.q, opts:f.opts, a:f.a, ex:f.ex});
  });

  return shuffle(out).slice(0,500).map(function(q,i){ q.id=i; return q; });
}

/* ============================================================
   APP STATE + RENDER
   ============================================================ */
const BANK = generateQuestions();
const LENGTH_OPTIONS = [10,25,50,100,BANK.length];
const CATEGORIES = ["All","State Match","True or False","Key Facts","Previous Year Qs"];

const state = {
  screen: "home",
  length: 25,
  category: "All",
  session: [],
  idx: 0,
  selected: null,
  revealed: false,
  answers: []
};

function availableCount(){
  return state.category==="All" ? BANK.length : BANK.filter(function(q){return q.cat===state.category;}).length;
}

function startQuiz(){
  const pool = state.category==="All" ? BANK : BANK.filter(function(q){return q.cat===state.category;});
  const n = Math.min(state.length, pool.length);
  state.session = shuffle(pool).slice(0,n);
  state.idx = 0;
  state.selected = null;
  state.revealed = false;
  state.answers = [];
  state.screen = "quiz";
  render();
}

function choose(i){
  if(state.revealed) return;
  const current = state.session[state.idx];
  state.selected = i;
  state.revealed = true;
  state.answers.push({correct: i===current.a});
  render();
}

function next(){
  if(state.idx+1 >= state.session.length){
    state.screen = "result";
  } else {
    state.idx += 1;
    state.selected = null;
    state.revealed = false;
  }
  render();
}

function esc(s){
  const d = document.createElement('div');
  d.innerText = s;
  return d.innerHTML;
}

function renderHome(){
  const av = availableCount();
  let catPills = CATEGORIES.map(function(c){
    const active = state.category===c ? "active" : "";
    return '<button class="pill '+active+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  }).join('');
  let lenPills = LENGTH_OPTIONS.map(function(n){
    const disabled = n>av;
    const active = state.length===n ? "gold-active" : "";
    return '<button class="pill '+active+'" '+(disabled?'disabled':'')+' data-len="'+n+'">'+(n===BANK.length?"All "+n:n)+'</button>';
  }).join('');

  return ''+
  '<div class="wrap">'+
    '<div class="eyebrow">'+icon('waves',22,'#1F5C50')+'<span>Wetlands of International Importance</span></div>'+
    '<h1 class="title">Ramsar Sites<br>Practice Bank</h1>'+
    '<p class="lead">'+BANK.length+' questions built from the Ramsar Sites reference sheet — state-wise matching, true/false checks, key facts, and previous-year SSC-style questions — each with a short explanation.</p>'+
    '<div class="card">'+
      '<div class="section-label">Category</div>'+
      '<div class="pill-row" id="catRow" style="margin-bottom:20px;">'+catPills+'</div>'+
      '<div class="section-label">Number of questions ('+av+' available)</div>'+
      '<div class="pill-row" id="lenRow">'+lenPills+'</div>'+
    '</div>'+
    '<button class="btn-primary" id="beginBtn">'+icon('leaf',18,'#F4EFE1')+' Begin Quiz '+icon('chevron',18,'#F4EFE1')+'</button>'+
  '</div>';
}

function renderQuiz(){
  const current = state.session[state.idx];
  const pct = ((state.idx + (state.revealed?1:0)) / state.session.length) * 100;

  let optsHtml = current.opts.map(function(opt,i){
    const isCorrect = i===current.a;
    const isPicked = i===state.selected;
    let cls = "";
    let mark = "";
    if(state.revealed && isCorrect){ cls="correct"; mark=icon('check',18,'#1F5C50'); }
    else if(state.revealed && isPicked && !isCorrect){ cls="wrong"; mark=icon('x',18,'#B5533C'); }
    return '<button class="opt '+cls+'" '+(state.revealed?'disabled':'')+' data-i="'+i+'">'+
      '<span>'+esc(opt)+'</span><span>'+mark+'</span></button>';
  }).join('');

  let explainHtml = state.revealed ? (
    '<div class="explain">'+icon('book',16,'#C9A227')+'<p>'+esc(current.ex)+'</p></div>'
  ) : '';

  let nextBtn = state.revealed ? (
    '<button class="next-btn" id="nextBtn">'+(state.idx+1>=state.session.length ? "See Results" : "Next Question")+' '+icon('chevron',18,'#F4EFE1')+'</button>'
  ) : '';

  return ''+
  '<div class="wrap">'+
    '<div class="quiz-top"><span class="cat">'+esc(current.cat)+'</span><span class="count">'+(state.idx+1)+' / '+state.session.length+'</span></div>'+
    '<div class="progress-outer"><div class="progress-inner" style="width:'+pct+'%;"></div></div>'+
    '<div class="card" style="margin-top:20px;">'+
      '<div class="qhead">'+icon('pin',18,'#1F5C50')+'<h2>'+esc(current.q)+'</h2></div>'+
      '<div class="opt-list">'+optsHtml+'</div>'+
      explainHtml+
    '</div>'+
    nextBtn+
  '</div>';
}

function renderResult(){
  const score = state.answers.filter(function(a){return a.correct;}).length;
  const pct = Math.round((score/state.session.length)*100);
  return ''+
  '<div class="result-wrap">'+
    icon('trophy',40,'#C9A227')+
    '<h1>'+pct+'% Correct</h1>'+
    '<p>You answered '+score+' out of '+state.session.length+' questions correctly.</p>'+
    '<div class="card" style="text-align:left;">'+
      '<div class="stat-row"><span>Category</span><span>'+esc(state.category)+'</span></div>'+
      '<div class="stat-row" style="margin-bottom:0;"><span>Questions attempted</span><span>'+state.session.length+'</span></div>'+
    '</div>'+
    '<div class="btn-row">'+
      '<button class="btn-primary" id="retryBtn" style="flex:1;">'+icon('retry',16,'#F4EFE1')+' Retry</button>'+
      '<button class="btn-outline" id="homeBtn">New Setup</button>'+
    '</div>'+
  '</div>';
}

function render(){
  const root = document.getElementById('root');
  if(state.screen==="home"){
    root.innerHTML = renderHome();
    document.querySelectorAll('#catRow .pill').forEach(function(btn){
      btn.addEventListener('click', function(){ state.category = btn.getAttribute('data-cat'); render(); });
    });
    document.querySelectorAll('#lenRow .pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(btn.disabled) return;
        state.length = parseInt(btn.getAttribute('data-len'),10);
        render();
      });
    });
    document.getElementById('beginBtn').addEventListener('click', startQuiz);
  } else if(state.screen==="quiz"){
    root.innerHTML = renderQuiz();
    document.querySelectorAll('.opt').forEach(function(btn){
      btn.addEventListener('click', function(){ choose(parseInt(btn.getAttribute('data-i'),10)); });
    });
    const nb = document.getElementById('nextBtn');
    if(nb) nb.addEventListener('click', next);
  } else if(state.screen==="result"){
    root.innerHTML = renderResult();
    document.getElementById('retryBtn').addEventListener('click', startQuiz);
    document.getElementById('homeBtn').addEventListener('click', function(){ state.screen="home"; render(); });
  }
}

render();
</script>
