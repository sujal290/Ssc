est country in North America (9.98 million km²) and 2nd largest in world after Russia. USA is 4th largest in world.",exp_hi:"कनाडा उत्तरी अमेरिका का सबसे बड़ा देश है (9.98 मिलियन किमी²) और विश्व में रूस के बाद दूसरा सबसे बड़ा देश है।"},{id:2,level:"Moderate",exam:"SSC CGL 2021",en:"The Grand Canyon in USA is carved by which river?",hi:"यूएसए में ग्रैंड कैन्यन का निर्माण किस नदी द्वारा किया गया है?",options:[{l:"A",en:"Colorado River",hi:"कोलोराडो नदी"},{l:"B",en:"Mississippi River",hi:"मिसिसिपी नदी"},{l:"C",en:"Missouri River",hi:"मिसौरी नदी"},{l:"D",en:"Yukon River",hi:"यूकॉन नदी"}],correct:"A",exp_en:"Grand Canyon in Arizona is carved by Colorado River over 5-6 million years. It is 446 km long.",exp_hi:"एरिजोना में ग्रैंड कैन्यन का निर्माण कोलोराडो नदी द्वारा 50-60 लाख वर्षों में किया गया है। यह 446 किमी लंबा है।"},{id:3,level:"Moderate",exam:"SSC CGL 2020",en:"Niagara Falls is located between which two lakes?",hi:"नियाग्रा जलप्रपात किन दो झीलों के बीच स्थित है?",options:[{l:"A",en:"Lake Superior and Michigan",hi:"सुपीरियर और मिशिगन झील"},{l:"B",en:"Lake Michigan and Huron",hi:"मिशिगन और ह्यूरॉन"},{l:"C",en:"Lake Erie and Ontario",hi:"ईरी और ओंटारियो झील"},{l:"D",en:"Lake Huron and Erie",hi:"ह्यूरॉन और ईरी"}],correct:"C",exp_en:"Niagara Falls lies on Niagara River connecting Lake Erie to Lake Ontario on USA-Canada border.",exp_hi:"नियाग्रा जलप्रपात नियाग्रा नदी पर स्थित है जो ईरी झील को ओंटारियो झील से जोड़ती है, यूएसए-कनाडा सीमा पर।"},{id:4,level:"Moderate",exam:"SSC CHSL 2023",en:"Which is the largest of the five Great Lakes by area?",hi:"पाँच महान झीलों में से क्षेत्रफल की दृष्टि से सबसे बड़ी कौन-सी है?",options:[{l:"A",en:"Lake Michigan",hi:"मिशिगन झील"},{l:"B",en:"Lake Huron",hi:"ह्यूरॉन झील"},{l:"C",en:"Lake Erie",hi:"ईरी झील"},{l:"D",en:"Lake Superior",hi:"सुपीरियर झील"}],correct:"D",exp_en:"Lake Superior is largest by area (82,100 km²) and also largest freshwater lake in world by area. Michigan is only lake fully in USA.",exp_hi:"सुपीरियर झील क्षेत्रफल में सबसे बड़ी है (82,100 किमी²) और विश्व की सबसे बड़ी मीठे पानी की झील भी है। मिशिगन एकमात्र झील है जो पूरी तरह यूएसए में है।"},{id:5,level:"Moderate",exam:"SSC CGL 2022",en:"Mississippi River drains into which water body?",hi:"मिसिसिपी नदी किस जल निकाय में गिरती है?",options:[{l:"A",en:"Atlantic Ocean",hi:"अटलांटिक महासागर"},{l:"B",en:"Gulf of Mexico",hi:"मेक्सिको की खाड़ी"},{l:"C",en:"Pacific Ocean",hi:"प्रशांत महासागर"},{l:"D",en:"Arctic Ocean",hi:"आर्कटिक महासागर"}],correct:"B",exp_en:"Mississippi River with Missouri is longest river system of North America (6275 km) and drains into Gulf of Mexico.",exp_hi:"मिसिसिपी-मिसौरी मिलकर उत्तरी अमेरिका का सबसे लंबा नदी तंत्र (6275 किमी) है और मेक्सिको की खाड़ी में गिरता है।"},{id:6,level:"Moderate",exam:"SSC CGL 2019",en:"Rocky Mountains are an example of?",hi:"रॉकी पर्वत किसका उदाहरण है?",options:[{l:"A",en:"Young Fold Mountains",hi:"नवीन मोड़दार पर्वत"},{l:"B",en:"Old Fold Mountains",hi:"प्राचीन मोड़दार पर्वत"},{l:"C",en:"Block Mountains",hi:"ब्लॉक पर्वत"},{l:"D",en:"Volcanic Mountains",hi:"ज्वालामुखी पर्वत"}],correct:"A",exp_en:"Rockies are young fold mountains formed by Laramide orogeny (80-55 MYA), part of American Cordillera.",exp_hi:"रॉकी नवीन मोड़दार पर्वत हैं जिनका निर्माण लारामाइड पर्वत निर्माण (80-55 मिलियन वर्ष पूर्व) से हुआ, अमेरिकन कॉर्डिलेरा का हिस्सा।"},{id:7,level:"Moderate",exam:"SSC CPO 2022",en:"What is the lowest point in North America?",hi:"उत्तरी अमेरिका का सबसे निचला बिंदु कौन-सा है?",options:[{l:"A",en:"Great Salt Lake",hi:"ग्रेट साल्ट लेक"},{l:"B",en:"Great Basin",hi:"ग्रेट बेसिन"},{l:"C",en:"Death Valley (Badwater Basin)",hi:"डेथ वैली (बैडवाटर बेसिन)"},{l:"D",en:"Grand Canyon",hi:"ग्रैंड कैन्यन"}],correct:"C",exp_en:"Badwater Basin in Death Valley, California is -86m below sea level, lowest in North America and hottest place.",exp_hi:"कैलिफोर्निया के डेथ वैली में बैडवाटर बेसिन समुद्र तल से 86 मीटर नीचे है, उत्तरी अमेरिका का सबसे निचला और सबसे गर्म स्थान।"},{id:8,level:"Moderate",exam:"SSC CGL 2020",en:"Appalachian Mountains are?",hi:"अप्लेशियन पर्वत हैं?",options:[{l:"A",en:"Young Fold",hi:"नवीन मोड़दार"},{l:"B",en:"Volcanic",hi:"ज्वालामुखी"},{l:"C",en:"Block",hi:"ब्लॉक"},{l:"D",en:"Old Fold Mountains",hi:"प्राचीन मोड़दार पर्वत"}],correct:"D",exp_en:"Appalachians are old fold mountains formed during Paleozoic era, much older and lower than Rockies, rich in coal.",exp_hi:"अप्लेशियन प्राचीन मोड़दार पर्वत हैं जिनका निर्माण पैलियोजोइक युग में हुआ, रॉकी से पुराने और कम ऊँचे, कोयले में समृद्ध।"},{id:9,level:"Moderate",exam:"SSC MTS 2021",en:"Prairies are known as?",hi:"प्रेयरी किस रूप में जानी जाती है?",options:[{l:"A",en:"Tropical grasslands",hi:"उष्णकटिबंधीय घासभूमि"},{l:"B",en:"Temperate grasslands famous for wheat",hi:"समशीतोष्ण घासभूमि जो गेहूं के लिए प्रसिद्ध है"},{l:"C",en:"Desert",hi:"मरुस्थल"},{l:"D",en:"Tundra",hi:"टुंड्रा"}],correct:"B",exp_en:"Prairies are temperate grasslands of USA-Canada, world famous for wheat cultivation - called Wheat Bowl.",exp_hi:"प्रेयरी यूएसए-कनाडा की समशीतोष्ण घासभूमि है, गेहूं उत्पादन के लिए विश्व प्रसिद्ध - गेहूं का कटोरा।"},{id:10,level:"Moderate",exam:"SSC CGL 2018",en:"Panama Canal connects?",hi:"पनामा नहर जोड़ती है?",options:[{l:"A",en:"Atlantic Ocean and Pacific Ocean",hi:"अटलांटिक और प्रशांत महासागर"},{l:"B",en:"Indian Ocean and Pacific Ocean",hi:"हिंद और प्रशांत महासागर"},{l:"C",en:"Atlantic and Indian Ocean",hi:"अटलांटिक और हिंद महासागर"},{l:"D",en:"Arctic and Atlantic Ocean",hi:"आर्कटिक और अटलांटिक"}],correct:"A",exp_en:"Panama Canal (82 km) connects Atlantic via Caribbean Sea to Pacific, opened 1914, uses lock system.",exp_hi:"पनामा नहर (82 किमी) अटलांटिक (कैरेबियन सागर के माध्यम से) को प्रशांत से जोड़ती है, 1914 में खुली, लॉक प्रणाली का उपयोग करती है।"},{id:11,level:"Moderate",exam:"SSC GD 2021",en:"What is the capital of Canada?",hi:"कनाडा की राजधानी क्या है?",options:[{l:"A",en:"Toronto",hi:"टोरंटो"},{l:"B",en:"Vancouver",hi:"वैंकूवर"},{l:"C",en:"Ottawa",hi:"ओटावा"},{l:"D",en:"Montreal",hi:"मॉन्ट्रियल"}],correct:"C",exp_en:"Ottawa is capital of Canada on Ottawa River, Ontario province.",exp_hi:"ओटावा कनाडा की राजधानी है, ओंटारियो प्रांत में ओटावा नदी पर स्थित।"},{id:12,level:"Moderate",exam:"SSC CHSL 2020",en:"Detroit in USA is famous for?",hi:"यूएसए में डेट्रॉइट किसके लिए प्रसिद्ध है?",options:[{l:"A",en:"Shipbuilding",hi:"जहाज निर्माण"},{l:"B",en:"IT Industry",hi:"आईटी उद्योग"},{l:"C",en:"Textile",hi:"वस्त्र"},{l:"D",en:"Automobile Industry",hi:"ऑटोमोबाइल उद्योग"}],correct:"D",exp_en:"Detroit, Michigan is called Motor City, headquarters of Ford, GM, Chrysler.",exp_hi:"मिशिगन का डेट्रॉइट मोटर सिटी कहलाता है, फोर्ड, जीएम, क्रिसलर का मुख्यालय।"},{id:13,level:"Moderate",exam:"SSC CGL 2023",en:"World's largest freshwater lake by area is?",hi:"क्षेत्रफल की दृष्टि से विश्व की सबसे बड़ी मीठे पानी की झील कौन-सी है?",options:[{l:"A",en:"Lake Superior",hi:"सुपीरियर झील"},{l:"B",en:"Lake Baikal",hi:"बैकाल झील"},{l:"C",en:"Lake Victoria",hi:"विक्टोरिया झील"},{l:"D",en:"Lake Michigan",hi:"मिशिगन झील"}],correct:"A",exp_en:"Superior 82,100 km² largest by area, Baikal is largest by volume and deepest.",exp_hi:"सुपीरियर 82,100 किमी² क्षेत्रफल में सबसे बड़ी, बैकाल आयतन और गहराई में सबसे बड़ी।"},{id:14,level:"Moderate",exam:"SSC CGL 2022",en:"Silicon Valley is located in which US state?",hi:"सिलिकॉन वैली किस अमेरिकी राज्य में स्थित है?",options:[{l:"A",en:"Texas",hi:"टेक्सास"},{l:"B",en:"California",hi:"कैलिफोर्निया"},{l:"C",en:"Florida",hi:"फ्लोरिडा"},{l:"D",en:"New York",hi:"न्यूयॉर्क"}],correct:"B",exp_en:"Silicon Valley in southern San Francisco Bay Area, California, global center for technology and innovation.",exp_hi:"सिलिकॉन वैली कैलिफोर्निया के सैन फ्रांसिस्को खाड़ी क्षेत्र में, प्रौद्योगिकी और नवाचार का वैश्विक केंद्र।"},{id:15,level:"Moderate",exam:"SSC CGL 2021",en:"World's largest island, geographically part of North America?",hi:"विश्व का सबसे बड़ा द्वीप, भौगोलिक रूप से उत्तरी अमेरिका का हिस्सा?",options:[{l:"A",en:"Iceland",hi:"आइसलैंड"},{l:"B",en:"Baffin Island",hi:"बैफिन द्वीप"},{l:"C",en:"Greenland",hi:"ग्रीनलैंड"},{l:"D",en:"Cuba",hi:"क्यूबा"}],correct:"C",exp_en:"Greenland 2.16 million km² largest island, autonomous territory of Denmark, geographically North American plate.",exp_hi:"ग्रीनलैंड 2.16 मिलियन किमी² सबसे बड़ा द्वीप, डेनमार्क का स्वायत्त क्षेत्र, भौगोलिक रूप से उत्तरी अमेरिकी प्लेट पर।"},{id:16,level:"Moderate",exam:"SSC CGL 2020",en:"Highest peak of North America is?",hi:"उत्तरी अमेरिका की सबसे ऊँची चोटी कौन-सी है?",options:[{l:"A",en:"Mount Logan",hi:"माउंट लोगान"},{l:"B",en:"Mount Elbert",hi:"माउंट एल्बर्ट"},{l:"C",en:"Mount Whitney",hi:"माउंट व्हिटनी"},{l:"D",en:"Denali (Mount McKinley)",hi:"डेनाली (माउंट मैकिन्ले)"}],correct:"D",exp_en:"Denali in Alaska 6190m highest in North America, Mount Logan is highest in Canada (5959m).",exp_hi:"अलास्का में डेनाली 6190 मीटर उत्तरी अमेरिका में सबसे ऊँची, लोगान कनाडा की सबसे ऊँची (5959 मी)।"},{id:17,level:"Moderate",exam:"SSC CHSL 2022",en:"USA purchased Alaska from which country in 1867?",hi:"यूएसए ने 1867 में अलास्का किस देश से खरीदा था?",options:[{l:"A",en:"Russia",hi:"रूस"},{l:"B",en:"Britain",hi:"ब्रिटेन"},{l:"C",en:"France",hi:"फ्रांस"},{l:"D",en:"Spain",hi:"स्पेन"}],correct:"A",exp_en:"USA purchased Alaska from Russia for $7.2 million (2 cents per acre), called Seward's Folly.",exp_hi:"यूएसए ने अलास्का रूस से 7.2 मिलियन डॉलर में खरीदा (2 सेंट प्रति एकड़), इसे सीवार्ड की मूर्खता कहा गया।"},{id:18,level:"Moderate",exam:"SSC CGL 2019",en:"Yucatan Peninsula is famous for?",hi:"यूकाटन प्रायद्वीप किसके लिए प्रसिद्ध है?",options:[{l:"A",en:"Tea cultivation",hi:"चाय की खेती"},{l:"B",en:"Henequen (Sisal) and Mayan culture",hi:"हेनक्वेन (सीसल) और माया सभ्यता"},{l:"C",en:"Coffee",hi:"कॉफी"},{l:"D",en:"Rubber",hi:"रबर"}],correct:"B",exp_en:"Yucatan in Mexico famous for henequen fiber and ancient Mayan ruins like Chichen Itza.",exp_hi:"मेक्सिको में यूकाटन हेनक्वेन फाइबर और चिचेन इट्जा जैसी प्राचीन माया सभ्यता के लिए प्रसिद्ध है।"},{id:19,level:"Moderate",exam:"SSC MTS 2022",en:"Everglades National Park is located in?",hi:"एवरग्लेड्स नेशनल पार्क कहाँ स्थित है?",options:[{l:"A",en:"California",hi:"कैलिफोर्निया"},{l:"B",en:"Texas",hi:"टेक्सास"},{l:"C",en:"Florida",hi:"फ्लोरिडा"},{l:"D",en:"Louisiana",hi:"लुइसियाना"}],correct:"C",exp_en:"Everglades in Florida is largest subtropical wetland ecosystem in North America, famous for alligators.",exp_hi:"फ्लोरिडा में एवरग्लेड्स उत्तरी अमेरिका का सबसे बड़ा उपोष्णकटिबंधीय आर्द्रभूमि पारिस्थितिकी तंत्र है, मगरमच्छों के लिए प्रसिद्ध।"},{id:20,level:"Moderate",exam:"SSC CGL 2021",en:"St. Lawrence River connects?",hi:"सेंट लॉरेंस नदी जोड़ती है?",options:[{l:"A",en:"Great Lakes to Gulf of Mexico",hi:"महान झीलों को मेक्सिको की खाड़ी से"},{l:"B",en:"Great Lakes to Pacific",hi:"महान झीलों को प्रशांत से"},{l:"C",en:"Great Lakes to Arctic",hi:"महान झीलों को आर्कटिक से"},{l:"D",en:"Great Lakes to Atlantic Ocean",hi:"महान झीलों को अटलांटिक महासागर से"}],correct:"D",exp_en:"St. Lawrence River flows from Lake Ontario to Atlantic Ocean, forms main outflow of Great Lakes.",exp_hi:"सेंट लॉरेंस नदी ओंटारियो झील से अटलांटिक महासागर तक बहती है, महान झीलों का मुख्य निकास।"},{id:21,level:"Moderate",exam:"SSC CGL 2022",en:"Largest country in South America by area is?",hi:"दक्षिण अमेरिका का सबसे बड़ा देश कौन-सा है?",options:[{l:"A",en:"Brazil",hi:"ब्राजील"},{l:"B",en:"Argentina",hi:"अर्जेंटीना"},{l:"C",en:"Peru",hi:"पेरू"},{l:"D",en:"Colombia",hi:"कोलंबिया"}],correct:"A",exp_en:"Brazil is 5th largest country in world (8.51 million km²), occupies 47.7% of South America.",exp_hi:"ब्राजील विश्व का 5वां सबसे बड़ा देश है (8.51 मिलियन किमी²), दक्षिण अमेरिका का 47.7% भाग।"},{id:22,level:"Moderate",exam:"SSC CGL 2023",en:"Which is the largest river in the world by discharge?",hi:"प्रवाह (डिस्चार्ज) की दृष्टि से विश्व की सबसे बड़ी नदी कौन-सी है?",options:[{l:"A",en:"Nile",hi:"नील"},{l:"B",en:"Amazon",hi:"अमेज़न"},{l:"C",en:"Mississippi",hi:"मिसिसिपी"},{l:"D",en:"Congo",hi:"कांगो"}],correct:"B",exp_en:"Amazon has largest discharge (~209,000 m³/s), 20% of world river water to oceans. Nile is longest traditionally.",exp_hi:"अमेज़न का प्रवाह सबसे अधिक (~209,000 m³/s), विश्व के नदी जल का 20% महासागरों में। नील परंपरागत रूप से सबसे लंबी।"},{id:23,level:"Moderate",exam:"SSC CGL 2020",en:"Longest mountain range in the world is?",hi:"विश्व की सबसे लंबी पर्वत श्रृंखला कौन-सी है?",options:[{l:"A",en:"Rockies",hi:"रॉकी"},{l:"B",en:"Himalaya",hi:"हिमालय"},{l:"C",en:"Andes",hi:"एंडीज"},{l:"D",en:"Alps",hi:"आल्प्स"}],correct:"C",exp_en:"Andes ~7000 km long along west coast of South America, young fold mountains, part of Pacific Ring of Fire.",exp_hi:"एंडीज ~7000 किमी लंबी दक्षिण अमेरिका के पश्चिमी तट पर, नवीन मोड़दार पर्वत, पैसिफिक रिंग ऑफ फायर का हिस्सा।"},{id:24,level:"Moderate",exam:"SSC CHSL 2021",en:"Driest place in the world is?",hi:"विश्व का सबसे शुष्क स्थान कौन-सा है?",options:[{l:"A",en:"Sahara Desert",hi:"सहारा मरुस्थल"},{l:"B",en:"Gobi Desert",hi:"गोबी मरुस्थल"},{l:"C",en:"Thar Desert",hi:"थार मरुस्थल"},{l:"D",en:"Atacama Desert",hi:"अटाकामा मरुस्थल"}],correct:"D",exp_en:"Atacama Desert in Chile is driest, some parts no rain for decades due to cold Humboldt current and rain shadow.",exp_hi:"चिली में अटाकामा मरुस्थल सबसे शुष्क है, कुछ हिस्सों में दशकों तक वर्षा नहीं, ठंडी हम्बोल्ट धारा और वृष्टि छाया के कारण।"},{id:25,level:"Moderate",exam:"SSC CGL 2022",en:"World's highest waterfall is?",hi:"विश्व का सबसे ऊँचा जलप्रपात कौन-सा है?",options:[{l:"A",en:"Angel Falls, Venezuela",hi:"एंजेल जलप्रपात, वेनेजुएला"},{l:"B",en:"Niagara Falls",hi:"नियाग्रा जलप्रपात"},{l:"C",en:"Iguazu Falls",hi:"इगुआजू जलप्रपात"},{l:"D",en:"Yosemite Falls",hi:"योसेमाइट जलप्रपात"}],correct:"A",exp_en:"Angel Falls in Venezuela 979m high, on Churun River, tributary of Caroni, in Guiana Highlands.",exp_hi:"वेनेजुएला में एंजेल जलप्रपात 979 मीटर ऊँचा, चुरुन नदी पर, कैरोनी की सहायक, गयाना हाइलैंड्स में।"},{id:26,level:"Moderate",exam:"SSC CGL 2019",en:"Highest navigable lake in the world is?",hi:"विश्व की सबसे ऊँची नौगम्य झील कौन-सी है?",options:[{l:"A",en:"Lake Superior",hi:"सुपीरियर झील"},{l:"B",en:"Lake Titicaca",hi:"टिटिकाका झील"},{l:"C",en:"Lake Baikal",hi:"बैकाल झील"},{l:"D",en:"Lake Victoria",hi:"विक्टोरिया झील"}],correct:"B",exp_en:"Titicaca at 3812m on Peru-Bolivia border, largest lake in South America by volume, sacred to Incas.",exp_hi:"टिटिकाका 3812 मीटर पर पेरू-बोलिविया सीमा पर, आयतन में दक्षिण अमेरिका की सबसे बड़ी झील, इंकाओं के लिए पवित्र।"},{id:27,level:"Moderate",exam:"SSC CGL 2021",en:"Pampas grasslands are found mainly in?",hi:"पम्पास घासभूमि मुख्यतः कहाँ पाई जाती है?",options:[{l:"A",en:"Brazil",hi:"ब्राजील"},{l:"B",en:"Chile",hi:"चिली"},{l:"C",en:"Argentina",hi:"अर्जेंटीना"},{l:"D",en:"Peru",hi:"पेरू"}],correct:"C",exp_en:"Pampas are fertile temperate grasslands in Argentina, Uruguay, southern Brazil, famous for wheat, maize, cattle.",exp_hi:"पम्पास अर्जेंटीना, उरुग्वे, दक्षिणी ब्राजील में उपजाऊ समशीतोष्ण घासभूमि है, गेहूं, मक्का, पशुपालन के लिए प्रसिद्ध।"},{id:28,level:"Moderate",exam:"SSC GD 2022",en:"World's largest coffee producer is?",hi:"विश्व का सबसे बड़ा कॉफी उत्पादक कौन-सा है?",options:[{l:"A",en:"Colombia",hi:"कोलंबिया"},{l:"B",en:"Vietnam",hi:"वियतनाम"},{l:"C",en:"India",hi:"भारत"},{l:"D",en:"Brazil",hi:"ब्राजील"}],correct:"D",exp_en:"Brazil is largest coffee producer for over 150 years, Santos port is coffee port.",exp_hi:"ब्राजील 150 वर्षों से अधिक समय से सबसे बड़ा कॉफी उत्पादक है, सैंटोस बंदरगाह कॉफी बंदरगाह है।"},{id:29,level:"Moderate",exam:"SSC CGL 2020",en:"Which South American country has maximum north-south extension?",hi:"किस दक्षिण अमेरिकी देश का उत्तर-दक्षिण विस्तार सबसे अधिक है?",options:[{l:"A",en:"Chile (4300 km)",hi:"चिली (4300 किमी)"},{l:"B",en:"Brazil",hi:"ब्राजील"},{l:"C",en:"Argentina",hi:"अर्जेंटीना"},{l:"D",en:"Peru",hi:"पेरू"}],correct:"A",exp_en:"Chile extends 4300 km north-south but average width only 177 km, longest narrow country.",exp_hi:"चिली 4300 किमी उत्तर-दक्षिण फैला है लेकिन औसत चौड़ाई केवल 177 किमी, सबसे लंबा संकरा देश।"},{id:30,level:"Moderate",exam:"SSC CPO 2021",en:"Equator passes through which South American countries?",hi:"भूमध्य रेखा किन दक्षिण अमेरिकी देशों से गुजरती है?",options:[{l:"A",en:"Brazil only",hi:"केवल ब्राजील"},{l:"B",en:"Ecuador, Colombia, Brazil",hi:"इक्वाडोर, कोलंबिया, ब्राजील"},{l:"C",en:"Peru, Chile",hi:"पेरू, चिली"},{l:"D",en:"All South American countries",hi:"सभी दक्षिण अमेरिकी देश"}],correct:"B",exp_en:"Equator passes through Ecuador (named after equator), Colombia and Brazil in South America.",exp_hi:"भूमध्य रेखा दक्षिण अमेरिका में इक्वाडोर (भूमध्य रेखा के नाम पर), कोलंबिया और ब्राजील से गुजरती है।"},{id:31,level:"Moderate",exam:"SSC CGL 2018",en:"Tierra del Fuego is?",hi:"टियारा डेल फ्यूगो क्या है?",options:[{l:"A",en:"A Peninsula",hi:"एक प्रायद्वीप"},{l:"B",en:"A Desert",hi:"एक मरुस्थल"},{l:"C",en:"An Archipelago at southern tip of South America",hi:"दक्षिण अमेरिका के दक्षिणी छोर पर एक द्वीपसमूह"},{l:"D",en:"A Plateau",hi:"एक पठार"}],correct:"C",exp_en:"Tierra del Fuego archipelago separated from mainland by Strait of Magellan, shared by Chile and Argentina.",exp_hi:"टियारा डेल फ्यूगो द्वीपसमूह मैगलन जलडमरूमध्य द्वारा मुख्य भूमि से अलग, चिली और अर्जेंटीना द्वारा साझा।"},{id:32,level:"Moderate",exam:"SSC CGL 2022",en:"Strait of Magellan separates?",hi:"मैगलन जलडमरूमध्य अलग करता है?",options:[{l:"A",en:"North and South America",hi:"उत्तर और दक्षिण अमेरिका"},{l:"B",en:"Chile and Argentina",hi:"चिली और अर्जेंटीना"},{l:"C",en:"Atlantic and Indian Ocean",hi:"अटलांटिक और हिंद महासागर"},{l:"D",en:"Mainland South America and Tierra del Fuego",hi:"मुख्य दक्षिण अमेरिका और टियारा डेल फ्यूगो"}],correct:"D",exp_en:"Strait of Magellan is natural passage between Atlantic and Pacific, south of mainland.",exp_hi:"मैगलन जलडमरूमध्य अटलांटिक और प्रशांत के बीच प्राकृतिक मार्ग है, मुख्य भूमि के दक्षिण में।"},{id:33,level:"Moderate",exam:"SSC CHSL 2023",en:"Patagonia Desert is located in?",hi:"पेटागोनिया मरुस्थल कहाँ स्थित है?",options:[{l:"A",en:"Argentina",hi:"अर्जेंटीना"},{l:"B",en:"Chile",hi:"चिली"},{l:"C",en:"Brazil",hi:"ब्राजील"},{l:"D",en:"Peru",hi:"पेरू"}],correct:"A",exp_en:"Patagonia is cold desert in Argentina, rain shadow of Andes, 5th largest desert in world.",exp_hi:"पेटागोनिया अर्जेंटीना में ठंडा मरुस्थल है, एंडीज की वृष्टि छाया में, विश्व का 5वां सबसे बड़ा मरुस्थल।"},{id:34,level:"Moderate",exam:"SSC CGL 2021",en:"La Plata river system is formed by?",hi:"ला प्लाटा नदी तंत्र किससे बनता है?",options:[{l:"A",en:"Amazon and Negro",hi:"अमेज़न और नीग्रो"},{l:"B",en:"Parana, Paraguay and Uruguay",hi:"पराना, पराग्वे और उरुग्वे"},{l:"C",en:"Orinoco and Apure",hi:"ओरिनोको और अपुरे"},{l:"D",en:"Magdalena and Cauca",hi:"मैग्डालेना और काउका"}],correct:"B",exp_en:"Parana, Paraguay, Uruguay meet at Rio de la Plata estuary, second largest basin in South America.",exp_hi:"पराना, पराग्वे, उरुग्वे रियो डी ला प्लाटा मुहाने पर मिलते हैं, दक्षिण अमेरिका का दूसरा सबसे बड़ा बेसिन।"},{id:35,level:"Moderate",exam:"SSC CGL 2020",en:"Smallest country in South America by area is?",hi:"क्षेत्रफल की दृष्टि से दक्षिण अमेरिका का सबसे छोटा देश कौन-सा है?",options:[{l:"A",en:"Guyana",hi:"गयाना"},{l:"B",en:"Ecuador",hi:"इक्वाडोर"},{l:"C",en:"Suriname",hi:"सूरीनाम"},{l:"D",en:"Uruguay",hi:"उरुग्वे"}],correct:"C",exp_en:"Suriname 163,820 km² smallest, formerly Dutch Guiana. Guyana is 3rd smallest.",exp_hi:"सूरीनाम 163,820 किमी² सबसे छोटा, पूर्व में डच गयाना। गयाना तीसरा सबसे छोटा।"},{id:36,level:"Moderate",exam:"SSC MTS 2020",en:"Machu Picchu, the Inca city, is located in?",hi:"इंका शहर माचू पिचू कहाँ स्थित है?",options:[{l:"A",en:"Bolivia",hi:"बोलिविया"},{l:"B",en:"Chile",hi:"चिली"},{l:"C",en:"Ecuador",hi:"इक्वाडोर"},{l:"D",en:"Peru",hi:"पेरू"}],correct:"D",exp_en:"Machu Picchu is 15th century Inca citadel in Andes, Peru, UNESCO World Heritage, 2430m altitude.",exp_hi:"माचू पिचू एंडीज में 15वीं शताब्दी का इंका गढ़ है, पेरू में, यूनेस्को विश्व धरोहर, 2430 मीटर ऊंचाई।"},{id:37,level:"Moderate",exam:"SSC CGL 2022",en:"Llanos grasslands are located in?",hi:"लानोस घासभूमि कहाँ स्थित है?",options:[{l:"A",en:"Orinoco basin (Venezuela-Colombia)",hi:"ओरिनोको बेसिन (वेनेजुएला-कोलंबिया)"},{l:"B",en:"Amazon basin",hi:"अमेज़न बेसिन"},{l:"C",en:"Pampas region",hi:"पम्पास क्षेत्र"},{l:"D",en:"Patagonia",hi:"पेटागोनिया"}],correct:"A",exp_en:"Llanos are tropical grasslands flooded in rainy season in Orinoco basin.",exp_hi:"लानोस ओरिनोको बेसिन में उष्णकटिबंधीय घासभूमि है जो वर्षा ऋतु में बाढ़ग्रस्त हो जाती है।"},{id:38,level:"Moderate",exam:"SSC CGL 2023",en:"Which are landlocked countries in South America?",hi:"दक्षिण अमेरिका में कौन-से स्थलरुद्ध देश हैं?",options:[{l:"A",en:"Only Bolivia",hi:"केवल बोलिविया"},{l:"B",en:"Bolivia and Paraguay",hi:"बोलिविया और पराग्वे"},{l:"C",en:"Only Paraguay",hi:"केवल पराग्वे"},{l:"D",en:"Uruguay",hi:"उरुग्वे"}],correct:"B",exp_en:"Only two landlocked countries in South America: Bolivia and Paraguay.",exp_hi:"दक्षिण अमेरिका में केवल दो स्थलरुद्ध देश: बोलिविया और पराग्वे।"},{id:39,level:"Moderate",exam:"SSC CHSL 2020",en:"Selvas in South America are?",hi:"दक्षिण अमेरिका में सेल्वास क्या हैं?",options:[{l:"A",en:"Coniferous forests",hi:"शंकुधारी वन"},{l:"B",en:"Deciduous forests",hi:"पर्णपाती वन"},{l:"C",en:"Equatorial evergreen rainforests of Amazon",hi:"अमेज़न के भूमध्यरेखीय सदाबहार वर्षावन"},{l:"D",en:"Temperate grasslands",hi:"समशीतोष्ण घासभूमि"}],correct:"C",exp_en:"Selvas are dense equatorial rainforests of Amazon basin, called Lungs of Earth.",exp_hi:"सेल्वास अमेज़न बेसिन के घने भूमध्यरेखीय वर्षावन हैं, पृथ्वी के फेफड़े कहलाते हैं।"},{id:40,level:"Moderate",exam:"SSC CGL 2021",en:"Highest peak of South America is?",hi:"दक्षिण अमेरिका की सबसे ऊँची चोटी कौन-सी है?",options:[{l:"A",en:"Chimborazo",hi:"चिम्बोराजो"},{l:"B",en:"Cotopaxi",hi:"कोटोपैक्सी"},{l:"C",en:"Huascaran",hi:"हुआस्कारान"},{l:"D",en:"Aconcagua",hi:"अकोंकागुआ"}],correct:"D",exp_en:"Aconcagua 6961m in Argentina, highest peak outside Asia, part of Andes, highest in Southern Hemisphere.",exp_hi:"अर्जेंटीना में अकोंकागुआ 6961 मीटर, एशिया के बाहर सबसे ऊँची, एंडीज का हिस्सा, दक्षिणी गोलार्ध में सबसे ऊँची।"},{id:41,level:"Hard",exam:"SSC CGL 2023",en:"Match List-I (Great Lakes) with List-II (Characteristic): 1. Superior a. Largest by area 2. Michigan b. Only in USA 3. Erie c. Shallowest 4. Ontario d. Smallest by area",hi:"सूची-I (महान झीलें) को सूची-II (विशेषता) से मिलाएं: 1. सुपीरियर a. क्षेत्रफल में सबसे बड़ी 2. मिशिगन b. केवल यूएसए में 3. ईरी c. सबसे उथली 4. ओंटारियो d. क्षेत्रफल में सबसे छोटी",options:[{l:"A",en:"1-a 2-b 3-d 4-c",hi:"1-a 2-b 3-d 4-c"},{l:"B",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"C",en:"1-b 2-a 3-c 4-d",hi:"1-b 2-a 3-c 4-d"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"B",exp_en:"Superior largest, Michigan only in USA, Erie shallowest (64m avg), Ontario smallest by area (18,960 km²).",exp_hi:"सुपीरियर सबसे बड़ी, मिशिगन केवल यूएसए में, ईरी सबसे उथली (औसत 64 मी), ओंटारियो क्षेत्रफल में सबसे छोटी (18,960 किमी²)।"},{id:42,level:"Hard",exam:"SSC CGL 2022",en:"Consider statements about Rocky Mountains: I. Extend from Alaska to New Mexico II. Young fold mountains III. Highest peak is Mount Logan. Which are correct?",hi:"रॉकी पर्वत के बारे में कथनों पर विचार करें: I. अलास्का से न्यू मैक्सिको तक फैले हैं II. नवीन मोड़दार पर्वत हैं III. सबसे ऊँची चोटी माउंट लोगान है। कौन-से सही हैं?",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"Only II",hi:"केवल II"},{l:"C",en:"Only I and II",hi:"केवल I और II"},{l:"D",en:"All I, II, III",hi:"सभी I, II, III"}],correct:"C",exp_en:"I & II correct. III false - Logan is in St. Elias Range (Canada), Rockies highest is Mount Elbert (4401m) in Colorado. Denali is in Alaska Range, not Rockies.",exp_hi:"I और II सही। III गलत - लोगान सेंट एलियास रेंज (कनाडा) में है, रॉकी की सबसे ऊँची एल्बर्ट (4401 मी) कोलोराडो में। डेनाली अलास्का रेंज में है।"},{id:43,level:"Hard",exam:"SSC CGL 2021",en:"Match cities with industries: 1. Detroit a. Automobiles 2. Chicago b. Meat packing 3. Pittsburgh c. Iron & Steel 4. Los Angeles d. Film. Code?",hi:"शहरों को उद्योगों से मिलाएं: 1. डेट्रॉइट a. ऑटोमोबाइल 2. शिकागो b. मांस पैकिंग 3. पिट्सबर्ग c. लोहा-इस्पात 4. लॉस एंजिल्स d. फिल्म। कोड?",options:[{l:"A",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"A",exp_en:"Detroit-Motor City, Chicago meat packing on Lake Michigan, Pittsburgh Steel City, LA Hollywood films.",exp_hi:"डेट्रॉइट-मोटर सिटी, शिकागो मिशिगन झील पर मांस पैकिंग, पिट्सबर्ग स्टील सिटी, एलए हॉलीवुड फिल्म।"},{id:44,level:"Hard",exam:"SSC CHSL 2022",en:"Consider about Mississippi-Missouri system: I. Combined longest river system of North America II. Drains into Gulf of Mexico III. Missouri is tributary of Mississippi. Which are correct?",hi:"मिसिसिपी-मिसौरी तंत्र के बारे में: I. उत्तरी अमेरिका का सबसे लंबा नदी तंत्र II. मेक्सिको की खाड़ी में गिरता है III. मिसौरी मिसिसिपी की सहायक है। कौन-से सही?",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only I",hi:"केवल I"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"All I, II, III",hi:"सभी I, II, III"}],correct:"D",exp_en:"All three statements are correct in geography. Combined 6275 km longest system. Missouri is tributary of Mississippi meeting near St Louis.",exp_hi:"तीनों कथन सही हैं - मिसौरी मिसिसिपी की सहायक है, संयुक्त 6275 किमी सबसे लंबा तंत्र।"},{id:45,level:"Hard",exam:"SSC CGL 2020",en:"Which of following are part of Canadian Shield? I. Labrador Plateau II. Great Bear Lake region III. Adirondack Mountains",hi:"निम्न में से कौन कैनेडियन शील्ड का हिस्सा हैं? I. लैब्राडोर पठार II. ग्रेट बियर लेक क्षेत्र III. एडिरोंडैक पर्वत",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"All I, II, III",hi:"सभी I, II, III"},{l:"C",en:"Only I",hi:"केवल I"},{l:"D",en:"Only II and III",hi:"केवल II और III"}],correct:"B",exp_en:"Canadian Shield is ancient Precambrian rock covering 8 million km² including Labrador, Great Bear region, and Adirondacks as southern extension in USA.",exp_hi:"कैनेडियन शील्ड प्राचीन प्रीकैम्ब्रियन चट्टान है जो 8 मिलियन किमी² में फैली है जिसमें लैब्राडोर, ग्रेट बियर क्षेत्र और यूएसए में दक्षिणी विस्तार के रूप में एडिरोंडैक शामिल हैं।"},{id:46,level:"Hard",exam:"SSC CGL 2023",en:"Match capitals: 1. Brazil a. Brasilia 2. Argentina b. Buenos Aires 3. Chile c. Santiago 4. Peru d. Lima",hi:"राजधानियों को मिलाएं: 1. ब्राजील a. ब्रासीलिया 2. अर्जेंटीना b. ब्यूनस आयर्स 3. चिली c. सैंटियागो 4. पेरू d. लीमा",options:[{l:"A",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"B",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"},{l:"C",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"D",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"}],correct:"C",exp_en:"Brazil capital Brasilia (1960 shifted from Rio), Argentina Buenos Aires, Chile Santiago, Peru Lima.",exp_hi:"ब्राजील की राजधानी ब्रासीलिया (1960 में रियो से स्थानांतरित), अर्जेंटीना ब्यूनस आयर्स, चिली सैंटियागो, पेरू लीमा।"},{id:47,level:"Hard",exam:"SSC CGL 2022",en:"Consider about Andes: I. Longest mountain range in world II. Young fold mountains III. Aconcagua is highest peak. Which are correct?",hi:"एंडीज के बारे में: I. विश्व की सबसे लंबी पर्वत श्रृंखला II. नवीन मोड़दार पर्वत III. अकोंकागुआ सबसे ऊँची चोटी। कौन-से सही?",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"All I, II, III",hi:"सभी I, II, III"}],correct:"D",exp_en:"All correct. Andes ~7000 km, young fold, part of circum-Pacific belt, Aconcagua 6961m.",exp_hi:"सभी सही। एंडीज ~7000 किमी, नवीन मोड़दार, परि-प्रशांत बेल्ट का हिस्सा, अकोंकागुआ 6961 मी।"},{id:48,level:"Hard",exam:"SSC CHSL 2021",en:"Match deserts: 1. Atacama a. Chile 2. Patagonia b. Argentina 3. Sechura c. Peru 4. Monte d. Argentina (northwest)",hi:"मरुस्थलों को मिलाएं: 1. अटाकामा a. चिली 2. पेटागोनिया b. अर्जेंटीना 3. सेचुरा c. पेरू 4. मोंटे d. अर्जेंटीना (उत्तर-पश्चिम)",options:[{l:"A",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"A",exp_en:"Atacama in Chile, Patagonia mainly Argentina, Sechura in northern Peru, Monte desert in NW Argentina.",exp_hi:"अटाकामा चिली में, पेटागोनिया मुख्यतः अर्जेंटीना में, सेचुरा उत्तरी पेरू में, मोंटे मरुस्थल उत्तर-पश्चिमी अर्जेंटीना में।"},{id:49,level:"Hard",exam:"SSC CGL 2020",en:"Which are tributaries of Amazon? I. Rio Negro II. Madeira III. Tapajos",hi:"अमेज़न की सहायक नदियाँ कौन-सी हैं? I. रियो नीग्रो II. मदीरा III. तापाजोस",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"All I, II, III",hi:"सभी I, II, III"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"B",exp_en:"All are major tributaries. Negro largest left tributary, Madeira largest by volume, Tapajos right tributary.",exp_hi:"सभी प्रमुख सहायक हैं। नीग्रो सबसे बड़ी बाएं सहायक, मदीरा आयतन में सबसे बड़ी, तापाजोस दाएं सहायक।"},{id:50,level:"Hard",exam:"SSC CGL 2019",en:"Consider about Panama Canal: I. Connects Atlantic and Pacific II. Uses lock system III. Opened in 1914. Which are correct?",hi:"पनामा नहर के बारे में: I. अटलांटिक और प्रशांत को जोड़ती है II. लॉक प्रणाली का उपयोग करती है III. 1914 में खुली। कौन-से सही?",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only II and III",hi:"केवल II और III"},{l:"C",en:"All I, II, III",hi:"सभी I, II, III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"C",exp_en:"All correct. 82 km, 3 locks - Gatun, Pedro Miguel, Miraflores, expanded in 2016.",exp_hi:"सभी सही। 82 किमी, 3 लॉक - गाटुन, पेड्रो मिगुएल, मिराफ्लोरेस, 2016 में विस्तार।"},{id:51,level:"Hard",exam:"SSC CGL 2022",en:"Match grasslands: 1. Prairies a. North America 2. Pampas b. Argentina 3. Llanos c. Venezuela/Colombia 4. Campos d. Brazil",hi:"घासभूमि मिलाएं: 1. प्रेयरी a. उत्तरी अमेरिका 2. पम्पास b. अर्जेंटीना 3. लानोस c. वेनेजुएला/कोलंबिया 4. कैम्पोस d. ब्राजील",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"},{l:"D",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"}],correct:"D",exp_en:"Prairies temperate USA/Canada, Pampas Argentina, Llanos tropical Orinoco, Campos tropical Brazil.",exp_hi:"प्रेयरी समशीतोष्ण यूएसए/कनाडा, पम्पास अर्जेंटीना, लानोस उष्णकटिबंधीय ओरिनोको, कैम्पोस उष्णकटिबंधीय ब्राजील।"},{id:52,level:"Hard",exam:"SSC CGL 2023",en:"Which are landlocked in South America? I. Bolivia II. Paraguay III. Uruguay",hi:"दक्षिण अमेरिका में कौन स्थलरुद्ध हैं? I. बोलिविया II. पराग्वे III. उरुग्वे",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only II and III",hi:"केवल II और III"},{l:"C",en:"All I II III",hi:"सभी I II III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"A",exp_en:"Bolivia lost coast to Chile in 1884 War of Pacific, Paraguay landlocked, Uruguay has Atlantic coast.",exp_hi:"बोलिविया ने 1884 में प्रशांत युद्ध में तट चिली को खो दिया, पराग्वे स्थलरुद्ध, उरुग्वे का अटलांटिक तट है।"},{id:53,level:"Hard",exam:"SSC CPO 2022",en:"Consider about Great Lakes: I. Formed by glacial erosion II. Five lakes III. Drained by St. Lawrence River",hi:"महान झीलों के बारे में: I. हिमनद अपरदन से बनी II. पाँच झीलें III. सेंट लॉरेंस नदी द्वारा निकास",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"All I, II, III",hi:"सभी I, II, III"},{l:"C",en:"Only I and II",hi:"केवल I और II"},{l:"D",en:"Only II and III",hi:"केवल II और III"}],correct:"B",exp_en:"All correct. Pleistocene glaciation formed them, 5 lakes hold 21% world surface freshwater.",exp_hi:"सभी सही। प्लीस्टोसीन हिमनदन से बनीं, 5 झीलों में विश्व के सतही मीठे पानी का 21%।"},{id:54,level:"Hard",exam:"SSC CGL 2021",en:"Match peaks: 1. Aconcagua a. Highest in South America 2. Denali b. Highest in North America 3. Chimborazo c. Farthest from Earth's centre 4. Mount Logan d. Highest in Canada",hi:"चोटियों को मिलाएं: 1. अकोंकागुआ a. दक्षिण अमेरिका में सबसे ऊँची 2. डेनाली b. उत्तरी अमेरिका में सबसे ऊँची 3. चिम्बोराजो c. पृथ्वी के केंद्र से सबसे दूर 4. माउंट लोगान d. कनाडा में सबसे ऊँची",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"C",exp_en:"Chimborazo near equator farthest from centre due to equatorial bulge, though not highest by sea level.",exp_hi:"चिम्बोराजो भूमध्य रेखा के पास होने से पृथ्वी के केंद्र से सबसे दूर है, भूमध्यरेखीय उभार के कारण, हालांकि समुद्र तल से सबसे ऊँचा नहीं।"},{id:55,level:"Hard",exam:"SSC CHSL 2020",en:"Which latitudes pass through North America? I. Tropic of Cancer II. Arctic Circle III. Equator",hi:"कौन-से अक्षांश उत्तरी अमेरिका से गुजरते हैं? I. कर्क रेखा II. आर्कटिक वृत्त III. भूमध्य रेखा",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"Only II",hi:"केवल II"},{l:"C",en:"Only I and III",hi:"केवल I और III"},{l:"D",en:"Only I and II",hi:"केवल I और II"}],correct:"D",exp_en:"Tropic of Cancer passes through Mexico, Arctic Circle through Alaska, northern Canada. Equator does not pass through NA.",exp_hi:"कर्क रेखा मेक्सिको से, आर्कटिक वृत्त अलास्का, उत्तरी कनाडा से गुजरता है। भूमध्य रेखा उत्तरी अमेरिका से नहीं गुजरती।"},{id:56,level:"Hard",exam:"SSC CGL 2022",en:"Consider about Chinook wind: I. Warm dry wind east of Rockies II. Called Snow Eater III. Beneficial for grazing in winter",hi:"चिनूक पवन के बारे में: I. रॉकी के पूर्व में गर्म शुष्क पवन II. स्नो ईटर कहलाती है III. सर्दियों में चराई के लिए लाभदायक",options:[{l:"A",en:"All I, II, III",hi:"सभी I, II, III"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"A",exp_en:"Chinook is Foehn type warm wind descending east Rockies, melts snow quickly, called Snow Eater, keeps prairies snow-free for cattle.",exp_hi:"चिनूक फॉन प्रकार की गर्म पवन है जो रॉकी के पूर्व में उतरती है, तेजी से बर्फ पिघलाती है, स्नो ईटर कहलाती है, प्रेयरी को मवेशियों के लिए बर्फ मुक्त रखती है।"},{id:57,level:"Hard",exam:"SSC CGL 2021",en:"Match rivers with mouth: 1. Colorado a. Gulf of California 2. Columbia b. Pacific Ocean 3. St. Lawrence c. Atlantic Ocean 4. Yukon d. Bering Sea",hi:"नदियों को मुहाने से मिलाएं: 1. कोलोराडो a. कैलिफोर्निया की खाड़ी 2. कोलंबिया b. प्रशांत महासागर 3. सेंट लॉरेंस c. अटलांटिक महासागर 4. यूकॉन d. बेरिंग सागर",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"C",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"B",exp_en:"Colorado forms delta in Gulf of California, Columbia drains Pacific northwest, St Lawrence Atlantic, Yukon Bering Sea in Alaska.",exp_hi:"कोलोराडो कैलिफोर्निया की खाड़ी में डेल्टा बनाती है, कोलंबिया प्रशांत उत्तर-पश्चिम में, सेंट लॉरेंस अटलांटिक में, यूकॉन अलास्का में बेरिंग सागर में।"},{id:58,level:"Hard",exam:"SSC CGL 2023",en:"Which country does NOT share border with Brazil?",hi:"कौन-सा देश ब्राजील के साथ सीमा साझा नहीं करता?",options:[{l:"A",en:"Chile",hi:"चिली"},{l:"B",en:"Ecuador",hi:"इक्वाडोर"},{l:"C",en:"Both Chile and Ecuador",hi:"चिली और इक्वाडोर दोनों"},{l:"D",en:"Peru",hi:"पेरू"}],correct:"C",exp_en:"Brazil borders 10 countries, all South American except Chile and Ecuador. It does NOT border Chile and Ecuador. So both.",exp_hi:"ब्राजील 10 देशों के साथ सीमा साझा करता है, चिली और इक्वाडोर को छोड़कर सभी दक्षिण अमेरिकी। अतः चिली और इक्वाडोर दोनों के साथ नहीं।"},{id:59,level:"Hard",exam:"SSC CHSL 2023",en:"Consider about Amazon basin: I. Selva II. Largest tropical rainforest III. Called lungs of earth",hi:"अमेज़न बेसिन के बारे में: I. सेल्वा II. सबसे बड़ा उष्णकटिबंधीय वर्षावन III. पृथ्वी के फेफड़े",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"All I, II, III",hi:"सभी I, II, III"}],correct:"D",exp_en:"All correct. Selva is local name, largest rainforest ~5.5 million km², produces 6% world oxygen, stores huge carbon.",exp_hi:"सभी सही। सेल्वा स्थानीय नाम है, सबसे बड़ा वर्षावन ~5.5 मिलियन किमी², विश्व का 6% ऑक्सीजन, विशाल कार्बन भंडार।"},{id:60,level:"Hard",exam:"SSC CGL 2020",en:"Consider about Caribbean: I. Greater Antilles includes Cuba, Hispaniola, Jamaica, Puerto Rico II. Lesser Antilles is arc of small islands III. Bahamas is part of West Indies but not Caribbean Sea",hi:"कैरेबियन के बारे में: I. ग्रेटर एंटिल्स में क्यूबा, हिस्पैनियोला, जमैका, प्यूर्टो रिको II. लेसर एंटिल्स छोटे द्वीपों का चाप III. बहामास वेस्ट इंडीज का हिस्सा लेकिन कैरेबियन सागर में नहीं",options:[{l:"A",en:"All I, II, III",hi:"सभी I, II, III"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"A",exp_en:"All correct. Greater Antilles larger islands, Lesser Antilles small arc from Virgin Islands to Trinidad, Bahamas in Atlantic north of Caribbean.",exp_hi:"सभी सही। ग्रेटर एंटिल्स बड़े द्वीप, लेसर एंटिल्स वर्जिन आइलैंड्स से त्रिनिदाद तक छोटा चाप, बहामास कैरेबियन के उत्तर में अटलांटिक में।"},{id:61,level:"Hard",exam:"SSC CGL 2022",en:"Match waterfalls: 1. Angel a. Venezuela 2. Niagara b. USA/Canada 3. Iguazu c. Argentina/Brazil 4. Yosemite d. USA",hi:"जलप्रपात मिलाएं: 1. एंजेल a. वेनेजुएला 2. नियाग्रा b. यूएसए/कनाडा 3. इगुआजू c. अर्जेंटीना/ब्राजील 4. योसेमाइट d. यूएसए",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"C",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"B",exp_en:"Angel highest in Venezuela, Niagara on US-Canada, Iguazu on Argentina-Brazil border (275 falls), Yosemite in California.",exp_hi:"एंजेल सबसे ऊँचा वेनेजुएला में, नियाग्रा यूएसए-कनाडा पर, इगुआजू अर्जेंटीना-ब्राजील सीमा पर (275 जलप्रपात), योसेमाइट कैलिफोर्निया में।"},{id:62,level:"Hard",exam:"SSC CGL 2021",en:"Which are part of Appalachian system? I. Blue Ridge II. White Mountains III. Black Hills",hi:"कौन अप्लेशियन तंत्र का हिस्सा हैं? I. ब्लू रिज II. व्हाइट माउंटेंस III. ब्लैक हिल्स",options:[{l:"A",en:"Only I",hi:"केवल I"},{l:"B",en:"Only II",hi:"केवल II"},{l:"C",en:"Only I and II",hi:"केवल I और II"},{l:"D",en:"All I II III",hi:"सभी I II III"}],correct:"C",exp_en:"Blue Ridge and White Mountains are part of Appalachians. Black Hills are isolated mountains in South Dakota, not part of Appalachians.",exp_hi:"ब्लू रिज और व्हाइट माउंटेंस अप्लेशियन का हिस्सा हैं। ब्लैक हिल्स दक्षिण डकोटा में अलग पहाड़ हैं, अप्लेशियन का हिस्सा नहीं।"},{id:63,level:"Hard",exam:"SSC CPO 2021",en:"Consider about Gulf Stream: I. Warm ocean current II. Part of North Atlantic Gyre III. Moderates climate of Western Europe",hi:"गल्फ स्ट्रीम के बारे में: I. गर्म महासागरीय धारा II. उत्तर अटलांटिक गायर का हिस्सा III. पश्चिमी यूरोप की जलवायु को मध्यम करती है",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only II and III",hi:"केवल II और III"},{l:"C",en:"Only I and III",hi:"केवल I और III"},{l:"D",en:"All I, II, III",hi:"सभी I, II, III"}],correct:"D",exp_en:"All correct. Gulf Stream originates Gulf of Mexico, flows along US east coast, becomes North Atlantic Drift warming Europe.",exp_hi:"सभी सही। गल्फ स्ट्रीम मेक्सिको की खाड़ी से उत्पन्न, यूएस पूर्वी तट के साथ बहती, नॉर्थ अटलांटिक ड्रिफ्ट बनकर यूरोप को गर्म करती है।"},{id:64,level:"Hard",exam:"SSC CGL 2022",en:"Match minerals: 1. Mexico a. Silver 2. Chile b. Copper 3. California (USA) c. Gold 4. Jamaica d. Bauxite",hi:"खनिज मिलाएं: 1. मेक्सिको a. चांदी 2. चिली b. तांबा 3. कैलिफोर्निया (यूएसए) c. सोना 4. जमैका d. बॉक्साइट",options:[{l:"A",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"A",exp_en:"Mexico largest silver producer, Chile largest copper, California Gold Rush 1849, Jamaica major bauxite.",exp_hi:"मेक्सिको सबसे बड़ा चांदी उत्पादक, चिली सबसे बड़ा तांबा, कैलिफोर्निया गोल्ड रश 1849, जमैका प्रमुख बॉक्साइट।"},{id:65,level:"Hard",exam:"SSC CHSL 2021",en:"Consider about Lake Titicaca: I. Highest navigable lake II. On Peru-Bolivia border III. Located in Andes",hi:"टिटिकाका झील के बारे में: I. सबसे ऊँची नौगम्य झील II. पेरू-बोलिविया सीमा पर III. एंडीज में स्थित",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"All I, II, III",hi:"सभी I, II, III"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"B",exp_en:"All correct. 3812m, largest by volume in SA, 8300 km², sacred lake of Incas, has 41 islands.",exp_hi:"सभी सही। 3812 मी, आयतन में दक्षिण अमेरिका में सबसे बड़ी, 8300 किमी², इंकाओं की पवित्र झील, 41 द्वीप।"},{id:66,level:"Hard",exam:"SSC CGL 2020",en:"Consider about Pampas: I. Fertile plain II. Wheat and maize grown III. Alfalfa grown for cattle",hi:"पम्पास के बारे में: I. उपजाऊ मैदान II. गेहूं और मक्का उगाया जाता है III. मवेशियों के लिए अल्फाल्फा उगाया जाता है",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only II and III",hi:"केवल II और III"},{l:"C",en:"All I, II, III",hi:"सभी I, II, III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"C",exp_en:"All correct. Pampas is one of most fertile plains, Argentina is major wheat exporter, Alfalfa for beef cattle.",exp_hi:"सभी सही। पम्पास सबसे उपजाऊ मैदानों में से एक, अर्जेंटीना प्रमुख गेहूं निर्यातक, गोमांस मवेशियों के लिए अल्फाल्फा।"},{id:67,level:"Hard",exam:"SSC CGL 2023",en:"Match plateaus: 1. Colorado Plateau a. USA 2. Mexican Plateau b. Mexico 3. Brazilian Plateau c. Brazil 4. Patagonian Plateau d. Argentina",hi:"पठार मिलाएं: 1. कोलोराडो पठार a. यूएसए 2. मैक्सिकन पठार b. मेक्सिको 3. ब्राजीलियन पठार c. ब्राजील 4. पेटागोनियन पठार d. अर्जेंटीना",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-c 2-d 3-a 4-b",hi:"1-c 2-d 3-a 4-b"},{l:"D",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"}],correct:"D",exp_en:"Colorado Plateau in SW USA famous for Grand Canyon, Mexican Plateau between Sierra Madre, Brazilian Shield, Patagonian cold plateau.",exp_hi:"कोलोराडो पठार दक्षिण-पश्चिम यूएसए में ग्रैंड कैन्यन के लिए प्रसिद्ध, मैक्सिकन पठार सिएरा माद्रे के बीच, ब्राजीलियन शील्ड, पेटागोनियन ठंडा पठार।"},{id:68,level:"Hard",exam:"SSC CPO 2022",en:"Consider about Panama Isthmus: I. Formed ~3 million years ago II. Closed connection between Atlantic-Pacific III. Led to Great American Biotic Interchange",hi:"पनामा इस्थमस के बारे में: I. ~30 लाख वर्ष पूर्व बना II. अटलांटिक-प्रशांत के बीच संबंध बंद किया III. ग्रेट अमेरिकन बायोटिक इंटरचेंज का कारण बना",options:[{l:"A",en:"All I, II, III",hi:"सभी I, II, III"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"Only I",hi:"केवल I"}],correct:"A",exp_en:"Isthmus formed 3 MYA closing Central American Seaway, changed ocean currents, triggered Ice Age, allowed animal migration between continents.",exp_hi:"इस्थमस 30 लाख वर्ष पूर्व बना मध्य अमेरिकी समुद्र मार्ग बंद किया, महासागरीय धाराएँ बदलीं, हिम युग शुरू, महाद्वीपों के बीच जीव प्रवास।"},{id:69,level:"Hard",exam:"SSC CGL 2021",en:"Consider Amazon vs Nile: I. Amazon largest by discharge II. Nile traditionally longest III. Recent studies claim Amazon longer than Nile",hi:"अमेज़न बनाम नील पर विचार: I. अमेज़न प्रवाह में सबसे बड़ी II. नील परंपरागत रूप से सबसे लंबी III. हाल के अध्ययन अमेज़न को नील से लंबा बताते हैं",options:[{l:"A",en:"Only I and III",hi:"केवल I और III"},{l:"B",en:"Only I and II",hi:"केवल I और II"},{l:"C",en:"All I, II, III",hi:"सभी I, II, III"},{l:"D",en:"Only II",hi:"केवल II"}],correct:"B",exp_en:"I & II definitely correct per SSC. III is debated but some 2007-2008 studies claim Amazon 6992 km vs Nile 6650 km, but officially Nile still longest per most textbooks. So SSC asks I & II correct.",exp_hi:"I और II निश्चित रूप से सही। III विवादास्पद है लेकिन कुछ 2007-08 अध्ययन अमेज़न को 6992 किमी बनाम नील 6650 किमी लंबा बताते हैं, लेकिन आधिकारिक तौर पर नील अभी भी अधिकांश पाठ्यपुस्तकों में सबसे लंबी। अतः SSC I और II सही मानता है।"},{id:70,level:"Hard",exam:"SSC CHSL 2022",en:"Match: 1. Bering Strait a. Asia-North America 2. Panama Canal b. Atlantic-Pacific artificial 3. Drake Passage c. Atlantic-Pacific natural southmost 4. Strait of Magellan d. Atlantic-Pacific natural",hi:"मिलाएं: 1. बेरिंग जलडमरूमध्य a. एशिया-उत्तरी अमेरिका 2. पनामा नहर b. अटलांटिक-प्रशांत कृत्रिम 3. ड्रेक पैसेज c. अटलांटिक-प्रशांत प्राकृतिक दक्षिणतम 4. मैगलन जलडमरूमध्य d. अटलांटिक-प्रशांत प्राकृतिक",options:[{l:"A",en:"1-a 2-c 3-b 4-d",hi:"1-a 2-c 3-b 4-d"},{l:"B",en:"1-b 2-a 3-d 4-c",hi:"1-b 2-a 3-d 4-c"},{l:"C",en:"1-a 2-b 3-c 4-d",hi:"1-a 2-b 3-c 4-d"},{l:"D",en:"1-d 2-c 3-b 4-a",hi:"1-d 2-c 3-b 4-a"}],correct:"C",exp_en:"Bering separates Russia-Alaska, Panama artificial, Drake is widest strait (800 km) between Cape Horn and Antarctica, Magellan south of mainland.",exp_hi:"बेरिंग रूस-अलास्का को अलग करता है, पनामा कृत्रिम, ड्रेक सबसे चौड़ा जलडमरूमध्य (800 किमी) केप हॉर्न और अंटार्कटिका के बीच, मैगलन मुख्य भूमि के दक्षिण में।"},{id:71,level:"Hard",exam:"SSC GD 2021",en:"Which countries are part of Guiana Highlands? I. Guyana II. Suriname III. Venezuela IV. Brazil (northern part)",hi:"कौन-से देश गयाना हाइलैंड्स का हिस्सा हैं? I. गयाना II. सूरीनाम III. वेनेजुएला IV. ब्राजील (उत्तरी भाग)",options:[{l:"A",en:"Only I and II",hi:"केवल I और II"},{l:"B",en:"Only I, II, III",hi:"केवल I, II, III"},{l:"C",en:"Only II and III",hi:"केवल II और III"},{l:"D",en:"All I, II, III, IV",hi:"सभी I, II, III, IV"}],correct:"D",exp_en:"Guiana Highlands cover Guyana, Suriname, French Guiana, Venezuela, northern Brazil and eastern Colombia, source of Orinoco and many waterfalls.",exp_hi:"गयाना हाइलैंड्स में गयाना, सूरीनाम, फ्रेंच गयाना, वेनेजुएला, उत्तरी ब्राजील और पूर्वी कोलंबिया शामिल हैं, ओरिनोको और कई जलप्रपातों का स्रोत।"},{id:72,level:"Hard",exam:"SSC GD 2021",en:"Consider about North America population: I. Densely populated east and west coasts II. Sparse north due to cold III. M
