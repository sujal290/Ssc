.element"),nm=Symbol.for("react.fragment"),rm=Object.prototype.hasOwnProperty,lm=Cc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,im={key:!0,ref:!0,__self:!0,__source:!0};function kc(e,t,n){var r,l={},i=null,o=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)rm.call(t,r)&&!im.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:tm,type:e,key:i,ref:o,props:l,_owner:lm.current}}var Or=nm,f=kc,h=kc;var Mt=[{id:1,en:"Indian National Congress was founded in 1885 at Bombay by:",hi:"भारतीय राष्ट्रीय कांग्रेस की स्थापना 1885 में बॉम्बे में किसके द्वारा की गई थी?",options_en:["Lord Dufferin","W.C. Banerjee","Dadabhai Naoroji","A.O. Hume, a retired British civil servant"],options_hi:["लॉर्ड डफरिन","डब्ल्यू.सी. बनर्जी","दादाभाई नौरोजी","ए.ओ. ह्यूम, एक सेवानिवृत्त ब्रिटिश सिविल सेवक"],correct:"D",exam:"SSC CGL Tier-1 2022, SSC CHSL 2021",level:"Moderate",exp_en:"INC founded Dec 28, 1885 at Gokuldas Tejpal Sanskrit College, Bombay. Initiated by A.O. Hume with help of Dufferin. First president W.C. Banerjee, 72 delegates attended. Safety valve theory associated.",exp_hi:"INC की स्थापना 28 दिसंबर 1885 को गोकुलदास तेजपाल संस्कृत कॉलेज, बॉम्बे में हुई। ए.ओ. ह्यूम ने डफरिन की मदद से शुरू की। प्रथम अध्यक्ष डब्ल्यू.सी. बनर्जी, 72 प्रतिनिधियों ने भाग लिया। सेफ्टी वाल्व सिद्धांत जुड़ा है।"},{id:2,en:"Who was the first President of Indian National Congress (1885)?",hi:"भारतीय राष्ट्रीय कांग्रेस (1885) के प्रथम अध्यक्ष कौन थे?",options_en:["Womesh Chandra Banerjee","Badruddin Tyabji","A.O. Hume","Dadabhai Naoroji"],options_hi:["व्योमेश चंद्र बनर्जी","बदरुद्दीन तैयबजी","ए.ओ. ह्यूम","दादाभाई नौरोजी"],correct:"A",exam:"SSC CGL 2020, SSC MTS 2022",level:"Moderate",exp_en:"W.C. Banerjee, Calcutta barrister, presided first session 1885. Second session Calcutta 1886 presided by Dadabhai Naoroji.",exp_hi:"डब्ल्यू.सी. बनर्जी, कलकत्ता के बैरिस्टर ने 1885 के प्रथम अधिवेशन की अध्यक्षता की। दूसरा अधिवेशन कलकत्ता 1886 की अध्यक्षता दादाभाई नौरोजी ने की।"},{id:3,en:"Second session of INC (1886) was held at Calcutta under President:",hi:"INC का दूसरा अधिवेशन (1886) कलकत्ता में किसकी अध्यक्षता में हुआ?",options_en:["Dadabhai Naoroji","Badruddin Tyabji","George Yule","W.C. Banerjee"],options_hi:["दादाभाई नौरोजी","बदरुद्दीन तैयबजी","जॉर्ज यूल","डब्ल्यू.सी. बनर्जी"],correct:"A",exam:"SSC CGL Tier-1 2021",level:"Moderate",exp_en:"Second session at Calcutta, President Dadabhai Naoroji, 436 delegates. National Conference (1883, 1885 by Surendranath Banerjee) merged with INC.",exp_hi:"दूसरा अधिवेशन कलकत्ता में, अध्यक्ष दादाभाई नौरोजी, 436 प्रतिनिधि। नेशनल कॉन्फ्रेंस (1883, 1885 सुरेंद्रनाथ बनर्जी द्वारा) का INC में विलय हो गया।"},{id:4,en:"Who was the first Muslim President of INC?",hi:"INC के प्रथम मुस्लिम अध्यक्ष कौन थे?",options_en:["Abul Kalam Azad","Syed Ahmed Khan","Badruddin Tyabji (Madras 1887)","Mohammad Ali Jinnah"],options_hi:["अबुल कलाम आजाद","सैयद अहमद खान","बदरुद्दीन तैयबजी (मद्रास 1887)","मोहम्मद अली जिन्ना"],correct:"C",exam:"SSC CGL 2019, 2022",level:"Moderate",exp_en:"Badruddin Tyabji presided 1887 Madras session, third session, first Muslim president. He was Bombay barrister.",exp_hi:"बदरुद्दीन तैयबजी ने 1887 मद्रास अधिवेशन की अध्यक्षता की, तीसरा अधिवेशन, पहले मुस्लिम अध्यक्ष। वह बॉम्बे के बैरिस्टर थे।"},{id:5,en:"Who was the first Englishman to become President of INC?",hi:"INC के अध्यक्ष बनने वाले पहले अंग्रेज कौन थे?",options_en:["George Yule (Allahabad 1888)","A.O. Hume","Henry Cotton","William Wedderburn"],options_hi:["जॉर्ज यूल (इलाहाबाद 1888)","ए.ओ. ह्यूम","हेनरी कॉटन","विलियम वेडरबर्न"],correct:"A",exam:"SSC CHSL 2020",level:"Moderate",exp_en:"George Yule, merchant, presided Allahabad 1888 fourth session. First English president. Later William Wedderburn 1889 Bombay and 1910 Allahabad.",exp_hi:"जॉर्ज यूल, व्यापारी ने इलाहाबाद 1888 चौथे अधिवेशन की अध्यक्षता की। पहले अंग्रेज अध्यक्ष। बाद में विलियम वेडरबर्न 1889 बॉम्बे और 1910 इलाहाबाद।"},{id:6,en:"The book 'Poverty and Un-British Rule in India' was written by:",hi:"पुस्तक 'पॉवर्टी एंड अन-ब्रिटिश रूल इन इंडिया' किसके द्वारा लिखी गई थी?",options_en:["R.C. Dutt","M.G. Ranade","G.K. Gokhale","Dadabhai Naoroji"],options_hi:["आर.सी. दत्त","एम.जी. रानाडे","जी.के. गोखले","दादाभाई नौरोजी"],correct:"D",exam:"SSC CGL Tier-1 2019, 2021, 2023",level:"Moderate",exp_en:"Dadabhai Naoroji, Grand Old Man of India, first to calculate national income, drain theory. Book published 1901. He was INC President thrice 1886, 1893, 1906.",exp_hi:"दादाभाई नौरोजी, भारत के ग्रैंड ओल्ड मैन, राष्ट्रीय आय की गणना करने वाले पहले व्यक्ति, ड्रेन सिद्धांत। पुस्तक 1901 में प्रकाशित। वे तीन बार 1886, 1893, 1906 में INC अध्यक्ष रहे।"},{id:7,en:"Place of birth of Dadabhai Naoroji was:",hi:"दादाभाई नौरोजी का जन्म स्थान था:",options_en:["Bombay (Now Mumbai)","Lahore","Calcutta","Pune"],options_hi:["बॉम्बे (अब मुंबई)","लाहौर","कलकत्ता","पुणे"],correct:"A",exam:"SSC CGL Tier-2 2021",level:"Hard",exp_en:"Dadabhai born 4 Sept 1825 in Bombay, Parsi. First Indian to become British MP (Liberal Party, Finsbury Central 1892). Died 1917.",exp_hi:"दादाभाई का जन्म 4 सितंबर 1825 को बॉम्बे में, पारसी। ब्रिटिश सांसद बनने वाले पहले भारतीय (लिबरल पार्टी, फिन्सबरी सेंट्रल 1892)। मृत्यु 1917।"},{id:8,en:"'Gita Rahasya' and 'Arctic Home of the Vedas' were written by:",hi:"'गीता रहस्य' और 'आर्कटिक होम ऑफ द वेदाज' किसके द्वारा लिखी गई थीं?",options_en:["Bipin Chandra Pal","Lala Lajpat Rai","Gopal Krishna Gokhale","Bal Gangadhar Tilak"],options_hi:["बिपिन चंद्र पाल","लाला लाजपत राय","गोपाल कृष्ण गोखले","बाल गंगाधर तिलक"],correct:"D",exam:"SSC CGL Tier-1 2020, 2022",level:"Moderate",exp_en:"Tilak wrote Gita Rahasya in Mandalay Jail (1908-14) and Arctic Home of Vedas 1903. Kesari (Marathi) and Mahratta (English) papers.",exp_hi:"तिलक ने मांडले जेल (1908-14) में गीता रहस्य और 1903 में आर्कटिक होम ऑफ वेदाज लिखी। केसरी (मराठी) और मराठा (अंग्रेजी) पत्र।"},{id:9,en:"Place of birth of Bal Gangadhar Tilak was:",hi:"बाल गंगाधर तिलक का जन्म स्थान था:",options_en:["Ratnagiri, Maharashtra","Nagpur","Pune","Baroda"],options_hi:["रत्नागिरी, महाराष्ट्र","नागपुर","पुणे","बड़ौदा"],correct:"A",exam:"SSC MTS 2021",level:"Hard",exp_en:"Tilak born 23 July 1856 Ratnagiri, original name Keshav Gangadhar Tilak. Father Gangadhar Ramchandra Tilak teacher. Gave slogan 'Swaraj is my birthright'.",exp_hi:"तिलक का जन्म 23 जुलाई 1856 रत्नागिरी में, मूल नाम केशव गंगाधर तिलक। पिता गंगाधर रामचंद्र तिलक शिक्षक। 'स्वराज मेरा जन्मसिद्ध अधिकार है' का नारा दिया।"},{id:10,en:"The Safety Valve Theory regarding formation of INC was given by:",hi:"INC के गठन के संबंध में सेफ्टी वाल्व सिद्धांत किसके द्वारा दिया गया था?",options_en:["W.C. Banerjee","Lala Lajpat Rai in Young India","Dadabhai Naoroji","A.O. Hume himself"],options_hi:["डब्ल्यू.सी. बनर्जी","लाला लाजपत राय ने यंग इंडिया में","दादाभाई नौरोजी","स्वयं ए.ओ. ह्यूम"],correct:"B",exam:"SSC CGL Tier-1 2022, Tier-2 2022",level:"Hard",exp_en:"Lala Lajpat Rai propounded Safety Valve Theory in 1916 in Young India that INC formed to provide safety valve for Indians discontent. Later debunked. Hume's biography by Wedderburn mentions Dufferin suggested.",exp_hi:"लाला लाजपत राय ने 1916 में यंग इंडिया में सेफ्टी वाल्व सिद्धांत प्रतिपादित किया कि INC भारतीय असंतोष के लिए सेफ्टी वाल्व प्रदान करने हेतु बनी। बाद में खंडन हुआ। वेडरबर्न द्वारा ह्यूम की जीवनी में डफरिन के सुझाव का उल्लेख है।"},{id:11,en:"Place of birth of Mahatma Gandhi was:",hi:"महात्मा गांधी का जन्म स्थान था:",options_en:["Rajkot","Ahmedabad","Porbandar, Gujarat","Wardha"],options_hi:["राजकोट","अहमदाबाद","पोरबंदर, गुजरात","वर्धा"],correct:"C",exam:"SSC CGL 2020, 2021, 2022",level:"Moderate",exp_en:"Gandhi born 2 Oct 1869 Porbandar, Gujarat. Father Karamchand Gandhi, mother Putlibai. Went to South Africa 1893, returned 1915. Champaran 1917 first satyagraha in India.",exp_hi:"गांधी का जन्म 2 अक्टूबर 1869 पोरबंदर, गुजरात में। पिता करमचंद गांधी, माता पुतलीबाई। 1893 में दक्षिण अफ्रीका गए, 1915 में लौटे। चंपारण 1917 भारत में पहला सत्याग्रह।"},{id:12,en:"Place of birth of Jawaharlal Nehru was:",hi:"जवाहरलाल नेहरू का जन्म स्थान था:",options_en:["Lucknow","Allahabad (Prayagraj)","Delhi","Lahore"],options_hi:["लखनऊ","इलाहाबाद (प्रयागराज)","दिल्ली","लाहौर"],correct:"B",exam:"SSC CGL Tier-1 2021",level:"Moderate",exp_en:"Nehru born 14 Nov 1889 Allahabad, father Motilal Nehru. INC President 1929 Lahore, 1936 Lucknow, 1937 Faizpur. Book Discovery of India etc.",exp_hi:"नेहरू का जन्म 14 नवंबर 1889 इलाहाबाद में, पिता मोतीलाल नेहरू। INC अध्यक्ष 1929 लाहौर, 1936 लखनऊ, 1937 फैजपुर। पुस्तक डिस्कवरी ऑफ इंडिया आदि।"},{id:13,en:"Place of birth of Sardar Vallabhbhai Patel was:",hi:"सरदार वल्लभभाई पटेल का जन्म स्थान था:",options_en:["Ahmedabad","Nadiad, Gujarat","Rajkot","Vadodara"],options_hi:["अहमदाबाद","नडियाद, गुजरात","राजकोट","वडोदरा"],correct:"B",exam:"SSC CGL 2022",level:"Hard",exp_en:"Patel born 31 Oct 1875 Nadiad, Gujarat. Called Sardar by women of Bardoli 1928. First Home Minister, Iron Man. Bardoli Satyagraha 1928.",exp_hi:"पटेल का जन्म 31 अक्टूबर 1875 नडियाद, गुजरात में। बारडोली 1928 में महिलाओं ने सरदार कहा। प्रथम गृह मंत्री, लौह पुरुष। बारडोली सत्याग्रह 1928।"},{id:14,en:"Place of birth of Subhash Chandra Bose was:",hi:"सुभाष चंद्र बोस का जन्म स्थान था:",options_en:["Calcutta","Cuttack, Odisha","Midnapore","Patna"],options_hi:["कलकत्ता","कटक, ओडिशा","मिदनापुर","पटना"],correct:"B",exam:"SSC CGL Tier-1 2021, 2022",level:"Moderate",exp_en:"Bose born 23 Jan 1897 Cuttack, Odisha, father Janakinath Bose. INC President 1938 Haripura, 1939 Tripuri. Founded Forward Bloc 1939, Azad Hind Fauj 1943.",exp_hi:"बोस का जन्म 23 जनवरी 1897 कटक, ओडिशा में, पिता जानकीनाथ बोस। INC अध्यक्ष 1938 हरिपुरा, 1939 त्रिपुरी। फॉरवर्ड ब्लॉक 1939, आजाद हिंद फौज 1943 की स्थापना।"},{id:15,en:"Place of birth of Gopal Krishna Gokhale was:",hi:"गोपाल कृष्ण गोखले का जन्म स्थान था:",options_en:["Poona","Satara","Kotaluk, Ratnagiri, Maharashtra","Kolhapur"],options_hi:["पूना","सतारा","कोटलुक, रत्नागिरी, महाराष्ट्र","कोल्हापुर"],correct:"C",exam:"SSC CHSL 2020",level:"Hard",exp_en:"Gokhale born 9 May 1866 Kotaluk, Ratnagiri. Moderate leader, political guru of Gandhi, founded Servants of India Society 1905 Pune.",exp_hi:"गोखले का जन्म 9 मई 1866 कोटलुक, रत्नागिरी में। नरमपंथी नेता, गांधी के राजनीतिक गुरु, सर्वेंट्स ऑफ इंडिया सोसायटी 1905 पुणे की स्थापना।"},{id:16,en:"The book 'Hind Swaraj' was written in 1909 on board ship by:",hi:"1909 में जहाज पर 'हिंद स्वराज' पुस्तक किसके द्वारा लिखी गई थी?",options_en:["M.K. Gandhi","Jawaharlal Nehru","Bal Gangadhar Tilak","Gopal Krishna Gokhale"],options_hi:["एम.के. गांधी","जवाहरलाल नेहरू","बाल गंगाधर तिलक","गोपाल कृष्ण गोखले"],correct:"A",exam:"SSC CGL Tier-1 2021, 2022",level:"Moderate",exp_en:"Gandhi wrote Hind Swaraj in Gujarati on voyage from London to South Africa 1909, in 10 days. Banned in India 1910. Original language Gujarati.",exp_hi:"गांधी ने 1909 में लंदन से दक्षिण अफ्रीका की यात्रा के दौरान गुजराती में 10 दिनों में हिंद स्वराज लिखी। भारत में 1910 में प्रतिबंधित। मूल भाषा गुजराती।"},{id:17,en:"Who wrote the book 'India Wins Freedom'?",hi:"पुस्तक 'इंडिया विंस फ्रीडम' किसने लिखी?",options_en:["Mahatma Gandhi","Abul Kalam Azad","Jawaharlal Nehru","Sardar Patel"],options_hi:["महात्मा गांधी","अबुल कलाम आजाद","जवाहरलाल नेहरू","सरदार पटेल"],correct:"B",exam:"SSC CGL 2020",level:"Moderate",exp_en:"Abul Kalam Azad wrote India Wins Freedom 1959. Youngest INC President 1923 special Delhi session at age 35.",exp_hi:"अबुल कलाम आजाद ने इंडिया विंस फ्रीडम 1959 में लिखी। 1923 में दिल्ली विशेष अधिवेशन में 35 वर्ष की आयु में सबसे युवा INC अध्यक्ष।"},{id:18,en:"Place of birth of Maulana Abul Kalam Azad was:",hi:"मौलाना अबुल कलाम आजाद का जन्म स्थान था:",options_en:["Delhi","Mecca, Saudi Arabia","Aligarh","Hyderabad"],options_hi:["दिल्ली","मक्का, सऊदी अरब","अलीगढ़","हैदराबाद"],correct:"B",exam:"SSC CGL Tier-2 2022",level:"Hard",exp_en:"Azad born 11 Nov 1888 Mecca, family returned to Calcutta 1890. Education at Al-Azhar? Participated in Khilafat, NCM.",exp_hi:"आजाद का जन्म 11 नवंबर 1888 मक्का में, परिवार 1890 में कलकत्ता लौटा। अल-अजहर में शिक्षा? खिलाफत, NCM में भागीदारी।"},{id:19,en:"Who started 'Kesari' (Marathi) and 'Mahratta' (English) newspapers?",hi:"'केसरी' (मराठी) और 'मराठा' (अंग्रेजी) समाचार पत्र किसने शुरू किए?",options_en:["Gopal Krishna Gokhale","Bal Gangadhar Tilak in 1881","Bipin Chandra Pal","Mahatma Gandhi"],options_hi:["गोपाल कृष्ण गोखले","बाल गंगाधर तिलक ने 1881 में","बिपिन चंद्र पाल","महात्मा गांधी"],correct:"B",exam:"SSC CGL Tier-1 2020",level:"Moderate",exp_en:"Tilak started Kesari and Mahratta 1881 with Chiplunkar and Agarkar. Kesari became his mouthpiece.",exp_hi:"तिलक ने 1881 में चिपलूणकर और आगरकर के साथ केसरी और मराठा शुरू किए। केसरी उनका मुखपत्र बना।"},{id:20,en:"Who was called 'Grand Old Man of India'?",hi:"'भारत के ग्रैंड ओल्ड मैन' किसे कहा जाता था?",options_en:["Dadabhai Naoroji","Surendranath Banerjee","Gopal Krishna Gokhale","M.G. Ranade"],options_hi:["दादाभाई नौरोजी","सुरेंद्रनाथ बनर्जी","गोपाल कृष्ण गोखले","एम.जी. रानाडे"],correct:"A",exam:"SSC CGL 2019, 2020, 2022",level:"Moderate",exp_en:"Dadabhai Naoroji called Grand Old Man, also Indian Gladstone. First to give drain theory.",exp_hi:"दादाभाई नौरोजी को ग्रैंड ओल्ड मैन, भारतीय ग्लैडस्टोन भी कहा जाता है। ड्रेन सिद्धांत देने वाले पहले।"},{id:21,en:"The newspaper 'The Hindu' was started in 1878 by:",hi:"समाचार पत्र 'द हिंदू' 1878 में किसके द्वारा शुरू किया गया था?",options_en:["G. Subramania Iyer and Veeraraghavachariar","Dadabhai Naoroji","S. N. Banerjee","M.G. Ranade"],options_hi:["जी. सुब्रमण्यम अय्यर और वीरराघवाचार्य","दादाभाई नौरोजी","एस.एन. बनर्जी","एम.जी. रानाडे"],correct:"A",exam:"SSC CGL Tier-1 2021",level:"Hard",exp_en:"The Hindu started Madras 1878 by G.S. Iyer and Veeraraghavachariar as weekly, later daily.",exp_hi:"द हिंदू मद्रास 1878 में जी.एस. अय्यर और वीरराघवाचार्य द्वारा साप्ताहिक के रूप में शुरू, बाद में दैनिक।"},{id:22,en:"'Amrita Bazar Patrika' was started by:",hi:"'अमृत बाजार पत्रिका' किसके द्वारा शुरू की गई थी?",options_en:["Sisir Kumar Ghosh and Motilal Ghosh 1868 Jessore","Surendranath Banerjee","Barindra Ghosh","Aurobindo"],options_hi:["शिशिर कुमार घोष और मोतीलाल घोष 1868 जसोर","सुरेंद्रनाथ बनर्जी","बारींद्र घोष","अरबिंदो"],correct:"A",exam:"SSC CHSL 2021",level:"Hard",exp_en:"Started 1868 Jessore, became English daily to escape Vernacular Press Act 1878.",exp_hi:"1868 जसोर में शुरू, वर्नाक्यूलर प्रेस एक्ट 1878 से बचने के लिए अंग्रेजी दैनिक बनी।"},{id:23,en:"The book 'Anandamath' containing 'Vande Mataram' was written by:",hi:"'वंदे मातरम' वाली पुस्तक 'आनंदमठ' किसने लिखी थी?",options_en:["Rabindranath Tagore","Bankim Chandra Chatterjee 1882","Aurobindo Ghosh","Surendranath Banerjee"],options_hi:["रवींद्रनाथ टैगोर","बंकिम चंद्र चटर्जी 1882","अरबिंदो घोष","सुरेंद्रनाथ बनर्जी"],correct:"B",exam:"SSC CGL 2019, 2021",level:"Moderate",exp_en:"Anandamath 1882 Bengali novel, background Sanyasi Revolt 1770s. Vande Mataram first sung 1896 INC session by Tagore.",exp_hi:"आनंदमठ 1882 बंगाली उपन्यास, पृष्ठभूमि संन्यासी विद्रोह 1770s। वंदे मातरम पहली बार 1896 INC अधिवेशन में टैगोर द्वारा गाया गया।"},{id:24,en:"'Bengalee' newspaper was started by:",hi:"'बंगाली' समाचार पत्र किसके द्वारा शुरू किया गया था?",options_en:["Surendranath Banerjee 1879","Sisir Ghosh","Dadabhai Naoroji","Bal Gangadhar Tilak"],options_hi:["सुरेंद्रनाथ बनर्जी 1879","शिशिर घोष","दादाभाई नौरोजी","बाल गंगाधर तिलक"],correct:"A",exam:"SSC CGL Tier-2 2021",level:"Moderate",exp_en:"Surendranath Banerjee started Bengalee 1879, also founded Indian Association 1876, Indian National Conference 1883, 1885.",exp_hi:"सुरेंद्रनाथ बनर्जी ने 1879 में बंगाली शुरू किया, 1876 में इंडियन एसोसिएशन, 1883, 1885 में इंडियन नेशनल कॉन्फ्रेंस की स्थापना भी की।"},{id:25,en:"'Young India' weekly was edited by:",hi:"'यंग इंडिया' साप्ताहिक का संपादन किसने किया?",options_en:["Lala Lajpat Rai","M.K. Gandhi","Jawaharlal Nehru","Bipin Chandra Pal"],options_hi:["लाला लाजपत राय","एम.के. गांधी","जवाहरलाल नेहरू","बिपिन चंद्र पाल"],correct:"B",exam:"SSC CGL 2020",level:"Moderate",exp_en:"Gandhi edited Young India 1919-32 English weekly, later Harijan 1933. Also Navajivan Gujarati.",exp_hi:"गांधी ने यंग इंडिया 1919-32 अंग्रेजी साप्ताहिक का संपादन किया, बाद में हरिजन 1933। नवजीवन गुजराती भी।"},{id:26,en:"Place of birth of Annie Besant was:",hi:"एनी बेसेंट का जन्म स्थान था:",options_en:["London, England 1847","Dublin, Ireland","New York","Calcutta"],options_hi:["लंदन, इंग्लैंड 1847","डबलिन, आयरलैंड","न्यूयॉर्क","कलकत्ता"],correct:"A",exam:"SSC CGL 2022",level:"Hard",exp_en:"Besant born London 1847, joined Theosophical Society 1889, came India 1893, started Home Rule League 1916 Madras, INC President Calcutta 1917 first woman.",exp_hi:"बेसेंट का जन्म लंदन 1847 में, 1889 में थियोसोफिकल सोसायटी में शामिल, 1893 में भारत आईं, होम रूल लीग 1916 मद्रास शुरू की, INC अध्यक्ष कलकत्ता 1917 पहली महिला।"},{id:27,en:"Who was the first woman President of INC?",hi:"INC की प्रथम महिला अध्यक्ष कौन थीं?",options_en:["Sarojini Naidu","Annie Besant 1917 Calcutta","Nellie Sengupta","Vijayalakshmi Pandit"],options_hi:["सरोजिनी नायडू","एनी बेसेंट 1917 कलकत्ता","नेली सेनगुप्ता","विजयलक्ष्मी पंडित"],correct:"B",exam:"SSC CGL Tier-1 2019, 2020",level:"Moderate",exp_en:"Annie Besant first woman president 1917 Calcutta. First Indian woman president Sarojini Naidu 1925 Kanpur.",exp_hi:"एनी बेसेंट प्रथम महिला अध्यक्ष 1917 कलकत्ता। प्रथम भारतीय महिला अध्यक्ष सरोजिनी नायडू 1925 कानपुर।"},{id:28,en:"The book 'Discovery of India' was written by:",hi:"पुस्तक 'डिस्कवरी ऑफ इंडिया' किसके द्वारा लिखी गई थी?",options_en:["Mahatma Gandhi","Jawaharlal Nehru in Ahmednagar Fort Jail 1942-45","Sardar Patel","Abul Kalam Azad"],options_hi:["महात्मा गांधी","जवाहरलाल नेहरू ने अहमदनगर किला जेल 1942-45 में","सरदार पटेल","अबुल कलाम आजाद"],correct:"B",exam:"SSC CGL Tier-1 2021",level:"Moderate",exp_en:"Nehru wrote Discovery of India in Ahmednagar Fort Jail 1944, also Glimpses of World History, Autobiography 1936.",exp_hi:"नेहरू ने 1944 में अहमदनगर किला जेल में डिस्कवरी ऑफ इंडिया लिखी, साथ ही ग्लिम्प्सेस ऑफ वर्ल्ड हिस्ट्री, आत्मकथा 1936।"},{id:29,en:"The Swadeshi Movement started in 1905 was due to:",hi:"1905 में स्वदेशी आंदोलन किस कारण शुरू हुआ था?",options_en:["Non-cooperation Movement","Partition of Bengal by Curzon","Rowlatt Act","Simon Commission"],options_hi:["असहयोग आंदोलन","कर्जन द्वारा बंगाल विभाजन","रॉलेट एक्ट","साइमन कमीशन"],correct:"B",exam:"SSC CGL Tier-1 2019, 2022",level:"Moderate",exp_en:"Bengal partition 19 July 1905 announced, effective 16 Oct 1905. Swadeshi Movement launched, boycott of foreign goods, Vande Mataram movement.",exp_hi:"बंगाल विभाजन 19 जुलाई 1905 घोषित, 16 अक्टूबर 1905 से प्रभावी। स्वदेशी आंदोलन शुरू, विदेशी वस्तुओं का बहिष्कार, वंदे मातरम आंदोलन।"},{id:30,en:"Lal-Bal-Pal were associated with:",hi:"लाल-बाल-पाल किससे संबंधित थे?",options_en:["Moderate group of INC","Extremist group (Garampanthi) 1905-08","Revolutionary group","Home Rule League"],options_hi:["INC के नरमपंथी समूह","उग्रवादी समूह (गरमपंथी) 1905-08","क्रांतिकारी समूह","होम रूल लीग"],correct:"B",exam:"SSC CGL Tier-1 2020",level:"Moderate",exp_en:"Lala Lajpat Rai (Punjab), Bal Gangadhar Tilak (Maharashtra), Bipin Chandra Pal (Bengal) formed extremist trio.",exp_hi:"लाला लाजपत राय (पंजाब), बाल गंगाधर तिलक (महाराष्ट्र), बिपिन चंद्र पाल (बंगाल) ने उग्रवादी त्रिमूर्ति बनाई।"},{id:31,en:"Surat Split of INC in 1907 was between:",hi:"1907 में INC का सूरत विभाजन किसके बीच था?",options_en:["Gandhi and Tilak","Moderates and Extremists presided by Rash Behari Ghosh","Nehru and Bose","British and Indians"],options_hi:["गांधी और तिलक","नरमपंथी और उग्रवादी अध्यक्षता रास बिहारी घोष","नेहरू और बोस","अंग्रेज और भारतीय"],correct:"B",exam:"SSC CGL Tier-1 2021, 2022",level:"Moderate",exp_en:"Surat session 1907 presided by Rash Behari Ghosh, split due to difference over Swadeshi, boycott, national education. Reunited 1916 Lucknow session.",exp_hi:"सूरत अधिवेशन 1907 की अध्यक्षता रास बिहारी घोष ने की, स्वदेशी, बहिष्कार, राष्ट्रीय शिक्षा पर मतभेद के कारण विभाजन। 1916 लखनऊ अधिवेशन में पुन: एकीकरण।"},{id:32,en:"Place of birth of Lala Lajpat Rai was:",hi:"लाला लाजपत राय का जन्म स्थान था:",options_en:["Ludhiana, Punjab","Dhudike, Punjab (now Moga) 1865","Lahore","Amritsar"],options_hi:["लुधियाना, पंजाब","धुड़िके, पंजाब (अब मोगा) 1865","लाहौर","अमृतसर"],correct:"B",exam:"SSC CGL Tier-1 2022",level:"Hard",exp_en:"Lala Lajpat Rai born 28 Jan 1865 Dhudike, called Punjab Kesari, died 1928 due to lathi charge during Simon Commission protest Lahore, Lalaji founded Servants of People Society 1921.",exp_hi:"लाला लाजपत राय का जन्म 28 जनवरी 1865 धुड़िके में, पंजाब केसरी कहलाए, साइमन कमीशन विरोध लाहौर में लाठीचार्ज से 1928 में मृत्यु, लालाजी ने सर्वेंट्स ऑफ पीपल सोसायटी 1921 की स्थापना की।"},{id:33,en:"Who wrote 'Unhappy India' in response to 'Mother India' by Katherine Mayo?",hi:"कैथरीन मेयो की 'मदर इंडिया' के जवाब में 'अनहैप्पी इंडिया' किसने लिखी?",options_en:["Lala Lajpat Rai 1928","Gandhi","Nehru","Bose"],options_hi:["लाला लाजपत राय 1928","गांधी","नेहरू","बोस"],correct:"A",exam:"SSC CGL Tier-2 2021",level:"Hard",exp_en:"Mayo wrote Mother India 1927 defaming India, Lajpat Rai wrote Unhappy India refuting.",exp_hi:"मेयो ने 1927 में भारत को बदनाम करते हुए मदर इंडिया लिखी, लाजपत राय ने अनहैप्पी इंडिया लिखकर खंडन किया।"},{id:34,en:"Lucknow Pact 1916 was between:",hi:"लखनऊ समझौता 1916 किसके बीच था?",options_en:["INC and British Govt","INC and Muslim League, moderates and extremists reunited","Gandhi and Jinnah only","Nehru and Patel"],options_hi:["INC और ब्रिटिश सरकार","INC और मुस्लिम लीग, नरमपंथी और उग्रवादी पुन: एकजुट","केवल गांधी और जिन्ना","नेहरू और पटेल"],correct:"B",exam:"SSC CGL Tier-1 2019, 2020",level:"Moderate",exp_en:"Lucknow session 1916 presided by A.C. Majumdar, extremists reunited after 1907, INC and Muslim League joint demand for self-govt.",exp_hi:"लखनऊ अधिवेशन 1916 की अध्यक्षता ए.सी. मजूमदार ने की, 1907 के बाद उग्रवादी पुन: एकजुट, INC और मुस्लिम लीग ने स्वशासन की संयुक्त मांग की।"},{id:35,en:"Home Rule Movement 1916 was started by:",hi:"होम रूल आंदोलन 1916 किसके द्वारा शुरू किया गया था?",options_en:["Tilak and Annie Besant separately","Gandhi","Nehru","Gokhale"],options_hi:["तिलक और एनी बेसेंट ने अलग-अलग","गांधी","नेहरू","गोखले"],correct:"A",exam:"SSC CGL Tier-1 2021, CHSL 2022",level:"Moderate",exp_en:"Tilak started Home Rule League April 1916 Poona, Besant Sept 1916 Madras. Tilak's area Maharashtra, Karnataka, Central Province, Berar. Besant's rest of India.",exp_hi:"तिलक ने होम रूल लीग अप्रैल 1916 पूना, बेसेंट ने सितंबर 1916 मद्रास में शुरू की। तिलक का क्षेत्र महाराष्ट्र, कर्नाटक, मध्य प्रांत, बरार। बेसेंट का शेष भारत।"},{id:36,en:"Champaran Satyagraha 1917 is associated with:",hi:"चंपारण सत्याग्रह 1917 किससे संबंधित है?",options_en:["Indigo farmers, tinkathia system, Gandhi's first satyagraha in India","Mill workers","Peasants of Kheda","Salt tax"],options_hi:["नील किसानों, तिनकठिया प्रणाली, भारत में गांधी का प्रथम सत्याग्रह","मिल मजदूर","खेड़ा के किसान","नमक कर"],correct:"A",exam:"SSC CGL Tier-1 2019, 2020, 2022",level:"Moderate",exp_en:"Champaran Bihar, indigo forced cultivation, Gandhi called by Rajkumar Shukla. Success.",exp_hi:"चंपारण बिहार, नील की जबरन खेती, गांधी को राजकुमार शुक्ला ने बुलाया। सफल।"},{id:37,en:"Kheda Satyagraha 1918 was led by Gandhi for:",hi:"खेड़ा सत्याग्रह 1918 गांधी द्वारा किसके लिए नेतृत्व किया गया था?",options_en:["Indigo farmers","Peasants unable to pay revenue due to crop failure, with Sardar Patel","Ahmedabad mill workers","Salt"],options_hi:["नील किसान","फसल विफलता के कारण राजस्व न दे पाने वाले किसान, सरदार पटेल के साथ","अहमदाबाद मिल मजदूर","नमक"],correct:"B",exam:"SSC CGL Tier-1 2021",level:"Moderate",exp_en:"Kheda Gujarat, crop failure, govt insisted revenue. Gandhi and Patel succeeded.",exp_hi:"खेड़ा गुजरात, फसल विफलता, सरकार ने राजस्व पर जोर दिया। गांधी और पटेल सफल रहे।"},{id:38,en:"Ahmedabad Mill Strike 1918 was Gandhi's first hunger strike for:",hi:"अहमदाबाद मिल हड़ताल 1918 गांधी का पहला भूख हड़ताल किसके लिए था?",options_en:["Mill workers demanding 35% wage hike, led by Anusuya Sarabhai","Indigo farmers","Salt workers","Peasants"],options_hi:["35% वेतन वृद्धि मांग रहे मिल मजदूर, अनुसूया साराभाई के नेतृत्व में","नील किसान","नमक मजदूर","किसान"],correct:"A",exam:"SSC CGL Tier-1 2022",level:"Moderate",exp_en:"Ahmedabad textile mill workers vs Ambalal Sarabhai, Gandhi intervened, fast, 35% hike agreed.",exp_hi:"अहमदाबाद कपड़ा मिल मजदूर बनाम अंबालाल साराभाई, गांधी ने हस्तक्षेप किया, उपवास, 35% वृद्धि पर सहमति।"},{id:39,en:"Rowlatt Act 1919 was called Black Act and protested because:",hi:"रॉलेट एक्ट 1919 को काला कानून कहा गया और विरोध हुआ क्योंकि:",options_en:["It increased salt tax","It allowed detention without trial for 2 years","It partitioned Bengal","It introduced separate electorate"],options_hi:["इसने नमक कर बढ़ाया","इसने बिना मुकदमे 2 साल तक हिरासत की अनुमति दी","इसने बंगाल विभाजन किया","इसने पृथक निर्वाचक मंडल शुरू किया"],correct:"B",exam:"SSC CGL 2020, 2021",level:"Moderate",exp_en:"Rowlatt Committee, Justice Rowlatt, bill to curb revolutionary activities, detention without trial, Gandhi called Rowlatt Satyagraha April 1919.",exp_hi:"रॉलेट समिति, जस्टिस रॉलेट, क्रांतिकारी गतिविधियों पर अंकुश लगाने हेतु विधेयक, बिना मुकदमे हिरासत, गांधी ने अप्रैल 1919 में रॉलेट सत्याग्रह बुलाया।"},{id:40,en:"Jallianwala Bagh Massacre occurred on:",hi:"जलियांवाला बाग हत्याकांड कब हुआ?",options_en:["13 April 1919, Amritsar, General Dyer ordered firing","13 April 1918","13 April 1920","13 April 1917"],options_hi:["13 अप्रैल 1919, अमृतसर, जनरल डायर ने गोलीबारी का आदेश दिया","13 अप्रैल 1918","13 अप्रैल 1920","13 अप्रैल 1917"],correct:"A",exam:"SSC CGL Tier-1 2019, 2020, 2022",level:"Moderate",exp_en:"Baisakhi day, crowd gathered to protest Rowlatt and arrest of Dr. Saifuddin Kitchlew and Satyapal, Dyer blocked exit, firing killed 379 official 1000+ claimed. Hunter Commission.",exp_hi:"बैसाखी दिवस, भीड़ रॉलेट और डॉ. सैफुद्दीन किचलू और सत्यपाल की गिरफ्तारी के विरोध में एकत्र हुई, डायर ने निकास बंद किया, गोलीबारी में 379 सरकारी 1000+ दावा मृत्यु। हंटर कमीशन।"},{id:41,en:"Non-Cooperation Movement 1920-22 was started after:",hi:"असहयोग आंदोलन 1920-22 किसके बाद शुरू हुआ था?",options_en:["Khilafat wrongs, Punjab wrongs (Jallianwala), Swaraj demand","Simon Commission","Cabinet Mission","Quit India"],options_hi:["खिलाफत अन्याय, पंजाब अन्याय (जलियांवाला), स्वराज मांग","साइमन कमीशन","कैबिनेट मिशन","भारत छोड़ो"],correct:"A",exam:"SSC CGL Tier-1 2021",level:"Moderate",exp_en:"INC Nagpur session Dec 1920 presided by C. Vijayaraghavachariar, programme approved. Withdrawn Feb 1922 after Chauri Chaura incident 5 Feb 1922 UP.",exp_hi:"INC नागपुर अधिवेशन दिसंबर 1920 अध्यक्षता सी. विजयराघवाचारियर, कार्यक्रम अनुमोदित। चौरी चौरा घटना 5 फरवरी 1922 यूपी के बाद फरवरी 1922 में वापस लिया गया।"},{id:42,en:"Chauri Chaura incident where NCM was withdrawn occurred in:",hi:"चौरी चौरा घटना जहाँ NCM वापस लिया गया, हुई थी:",options_en:["Gorakhpur district, UP, 5 Feb 1922, police station burnt 22 policemen killed","Bihar","Punjab","Maharashtra"],options_hi:["गोरखपुर जिला, यूपी, 5 फरवरी 1922, थाना जलाया 22 पुलिसकर्मी मारे गए","बिहार","पंजाब","महाराष्ट्र"],correct:"A",exam:"SSC CGL 2020, 2022",level:"Moderate",exp_en:"Mob burnt Chauri Chaura thana, Gandhi withdrew NCM 12 Feb 1922 Bardoli. Many criticized.",exp_hi:"भीड़ ने चौरी चौरा थाना जलाया, गांधी ने 12 फरवरी 1922 बारडोली में NCM वापस लिया। कई ने आलोचना की।"},{id:43,en:"Swaraj Party 1923 was formed by:",hi:"स्वराज पार्टी 1923 किसके द्वारा बनाई गई थी?",options_en:["Gandhi and Nehru","C.R. Das and Motilal Nehru after Gaya session 1922","Tilak and Lajpat Rai","Bose and Patel"],options_hi:["गांधी और नेहरू","सी.आर. दास और मोतीलाल नेहरू ने गया अधिवेशन 1922 के बाद","तिलक और लाजपत राय","बोस और पटेल"],correct:"B",exam:"SSC CGL Tier-1 2021, Tier-2 2022",level:"Moderate",exp_en:"Formed Jan 1923 to enter councils, contest elections, wreck from within. President C.R. Das, secretary Motilal.",exp_hi:"जनवरी 1923 में परिषदों में प्रवेश, चुनाव लड़ने, भीतर से ध्वस्त क
