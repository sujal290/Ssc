ुरी में निर्वाण 527 ईसा पूर्व","Parshvanatha 23rd - born Varanasi, son of Ashvasena & Vamadevi, 8th century BCE, 100 years life / पार्श्वनाथ 23वें, वाराणसी जन्म","Parshvanatha 4 Vows: Ahimsa, Satya, Aparigraha, Asteya - Chaturyama / पार्श्वनाथ के 4 महाव्रत - चातुर्याम","Mahavira added 5th Brahmacharya - Pancha Mahavrata complete / महावीर ने 5वां ब्रह्मचर्य जोड़ा","Tri Ratna: Samyak Darshan, Jnana, Charitra - Path to Moksha / त्रिरत्न: सम्यक दर्शन, ज्ञान, चरित्र","Anekantavada: Many-sided reality, Syadvada: Saptabhangi 7-fold predication / अनेकांतवाद, स्याद्वाद","No Creator God, Universe eternal, Soul Jiva & Ajiva exist / ईश्वर नहीं, ब्रह्मांड अनादि","First Jain Council 300 BCE Pataliputra - Sthulabhadra, Chandragupta Maurya time - 12 Angas compiled, 14 Purvas lost / प्रथम परिषद पाटलिपुत्र","Second Council 512 CE Vallabhi Gujarat - Devardhi Kshamasramana - Canon written in Ardha-Magadhi / द्वितीय वल्लभी 512 ईस्वी","Split due to 12-year famine 298 BCE Magadha - Bhadrabahu to South (Digambara), Sthulabhadra stayed (Svetambara) / विभाजन अकाल से","Svetambara White-clad, Digambara Sky-clad naked, Idol eyes open vs downcast / श्वेतांबर सफेद, दिगंबर नग्न","Svetambara says women can get Moksha, Mallinatha female; Digambara says male only / स्त्री मोक्ष पर मतभेद","Language Ardha-Magadhi, Prakrit / भाषा अर्ध-मागधी प्राकृत","Agama: 12 Angas, 12 Upangas, 45 total Svetambara texts / आगम 12 अंग 45 ग्रंथ","Kalpa Sutra by Bhadrabahu - biography of Tirthankaras / कल्पसूत्र भद्रबाहु","Parishishtaparvan by Hemachandra tells Chandragupta Maurya story / परिशिष्टपर्वन हेमचंद्र","Chandragupta Maurya became Jain, went Shravanabelagola with Bhadrabahu, Sallekhana 297 BCE / चंद्रगुप्त मौर्य जैन बने","Kharavela Kalinga Hathigumpha Inscription 2nd BCE mentions Jain / खारवेल हाथीगुम्फा अभिलेख","Gomateshwara Bahubali 57 feet monolithic at Shravanabelagola by Chamundaraya 981 CE Ganga / गोमतेश्वर 57 फीट","Mahamastakabhisheka every 12 years at Shravanabelagola / महामस्तकाभिषेक हर 12 वर्ष","Dilwara
