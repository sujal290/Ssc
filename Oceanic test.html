p_hi:"थर्मोक्लाइन 100-1000 मीटर पर, मिश्रण में बाधा, समुद्री जीवन के लिए महत्वपूर्ण।"},{en:"Tsunami is caused by:",hi:"सुनामी का कारण है:",opts_en:["Undersea earthquake, volcanic eruption or landslide","Ocean currents","Winds","Tides"],opts_hi:["समुद्र के नीचे भूकंप, ज्वालामुखी विस्फोट या भूस्खलन","महासागरीय धाराएं","पवनें","ज्वार"],correct:0,topic:"Other Phenomena",level:"Moderate",exam:"SSC MTS 2022",exp_en:"Tsunami = harbor wave, long wavelength, shallow water wave, speed high in deep water.",exp_hi:"सुनामी = हार्बर लहर, लंबी तरंगदैर्ध्य, उथले पानी की लहर, गहरे पानी में गति अधिक।"},{en:"El Nino is:",hi:"एल नीनो है:",opts_en:["Cyclone","Cooling of Pacific","Warming of Indian Ocean only","Abnormal warming of eastern Pacific off Peru coast"],opts_hi:["चक्रवात","प्रशांत का ठंडा होना","केवल हिंद महासागर का गर्म होना","पेरू तट के पास पूर्वी प्रशांत का असामान्य गर्म होना"],correct:3,topic:"Other Phenomena",level:"Moderate",exam:"SSC CGL 2022",exp_en:"El Nino affects monsoon, causes drought in India, floods in Peru. Every 2-7 years.",exp_hi:"एल नीनो मानसून प्रभावित करता है, भारत में सूखा, पेरू में बाढ़। हर 2-7 साल।"},{en:"Waves are generated by:",hi:"लहरें उत्पन्न होती हैं:",opts_en:["Earthquake only","Wind friction on sea surface","Tides","Salinity difference"],opts_hi:["केवल भूकंप से","समुद्र सतह पर पवन घर्षण से","ज्वार से","लवणता अंतर से"],correct:1,topic:"Other Phenomena",level:"Moderate",exam:"SSC CHSL 2020",exp_en:"Wave height depends on wind speed, duration, fetch. Not to be confused with tide or current.",exp_hi:"लहर ऊंचाई पवन गति, अवधि, फेच पर निर्भर। ज्वार या धारा से भिन्न।"},{en:"Match: A. Continental Shelf - 1. 0-200m B. Continental Slope - 2. 200-3000m C. Abyssal Plain - 3. 3000-6000m D. Hadal Zone - 4. >6000m trenches. Correct:",hi:"सुमेलित करें: A. महाद्वीपीय शेल्फ -1. 0-200m B. ढाल -2. 200-3000m C. नितल मैदान -3. 3000-6000m D. हेडल जोन -4. >6000m गर्त। सही:",opts_en:["A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3","A-1, B-2, C-3, D-4","A-3, B-2, C-1, D-4"],opts_hi:["A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3","A-1, B-2, C-3, D-4","A-3, B-2, C-1, D-4"],correct:2,topic:"Oceanic Structure",level:"Hard",exam:"SSC CGL 2022 Tier-II",exp_en:"Oceanic zones: Neritic, Bathyal, Abyssal, Hadal. Depth classification standard.",exp_hi:"महासागरीय क्षेत्र: नेरिटिक, बाथियल, एबिसल, हेडल। गहराई वर्गीकरण मानक।"},{en:"Consider: I. Mariana Trench is deepest II. Puerto Rico Trench is deepest in Atlantic III. Java Trench is deepest in Indian Ocean. Which are correct?",hi:"विचार करें: I. मारियाना गर्त सबसे गहरा II. प्यूर्टो रिको गर्त अटलांटिक में सबसे गहरा III. जावा गर्त हिंद महासागर में सबसे गहरा। कौन सही?",opts_en:["Only I","I, II and III","II and III only","I and II only"],opts_hi:["केवल I","I, II और III","केवल II और III","केवल I और II"],correct:1,topic:"Oceanic Structure",level:"Hard",exam:"SSC CGL 2023",exp_en:"Mariana 11km Pacific deepest, Puerto Rico ~8.4km Atlantic deepest, Java/Sunda ~7.2km Indian deepest.",exp_hi:"मारियाना 11 किमी प्रशांत में सबसे गहरा, प्यूर्टो रिको ~8.4 किमी अटलांटिक में सबसे गहरा, जावा/सुंडा ~7.2 किमी हिंद में सबसे गहरा।"},{en:"Consider statements about salinity: I. Salinity is highest at equator II. Baltic Sea has low salinity III. Salinity increases density. Which are incorrect?",hi:"लवणता के बारे में कथन: I. भूमध्य रेखा पर लवणता सर्वाधिक II. बाल्टिक में कम लवणता III. लवणता घनत्व बढ़ाती है। कौन गलत है?",opts_en:["Only I","Only II","I, II and III","I and II"],opts_hi:["केवल I","केवल II","I, II और III","I और II"],correct:0,topic:"Oceanic Salinity",level:"Hard",exam:"SSC CPO 2022",exp_en:"Equator has low salinity due to rain, highest at tropics. Baltic low correct, salinity-density direct correct. So only I incorrect.",exp_hi:"भूमध्य रेखा पर वर्षा से कम लवणता, उष्णकटिबंध में अधिकतम। बाल्टिक कम सही, लवणता-घनत्व प्रत्यक्ष सही। इसलिए केवल I गलत।"},{en:"Match currents: A. Gulf Stream -1. Atlantic Warm B. Kuroshio -2. Pacific Warm C. Peru -3. Pacific Cold D. Benguela -4. Atlantic Cold. Correct:",hi:"धाराओं को सुमेलित करें: A. गल्फ स्ट्रीम -1. अटलांटिक गर्म B. क्यूरोशियो -2. प्रशांत गर्म C. पेरू -3. प्रशांत ठंडी D. बेंगुएला -4. अटलांटिक ठंडी। सही:",opts_en:["A-3, B-4, C-1, D-2","A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3"],opts_hi:["A-3, B-4, C-1, D-2","A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3"],correct:1,topic:"Oceanic Currents",level:"Hard",exam:"SSC CGL 2021",exp_en:"Warm: Gulf Stream, Kuroshio, Brazil, Agulhas. Cold: Labrador, Canary, Peru, Benguela, California.",exp_hi:"गर्म: गल्फ स्ट्रीम, क्यूरोशियो, ब्राजील, अगुलहास। ठंडी: लैब्राडोर, कैनरी, पेरू, बेंगुएला, कैलिफोर्निया।"},{en:"Consider: I. Sargasso Sea has no coast II. It is in North Atlantic Gyre III. It has anticyclonic circulation. Which correct?",hi:"विचार करें: I. सारगासो सागर का कोई तट नहीं II. यह उत्तरी अटलांटिक गायरे में III. इसमें प्रतिचक्रवाती परिसंचरण। कौन सही?",opts_en:["Only I","I and II only","II and III only","I, II and III"],opts_hi:["केवल I","केवल I और II","केवल II और III","I, II और III"],correct:3,topic:"Other Phenomena",level:"Hard",exam:"SSC CGL 2022",exp_en:"Sargasso bounded by Gulf Stream, North Atlantic Drift, Canary, North Equatorial currents - clockwise anticyclonic gyre.",exp_hi:"सारगासो गल्फ स्ट्रीम, उत्तरी अटलांटिक ड्रिफ्ट, कैनरी, उत्तरी भूमध्यरेखीय धाराओं से घिरा - दक्षिणावर्त प्रतिचक्रवाती गायरे।"},{en:"Which statements about ocean currents are correct? I. Warm currents make climate warmer and wetter II. Cold currents cause deserts on adjacent coasts III. Meeting of warm and cold creates fishing grounds",hi:"महासागरीय धाराओं के बारे में कौन से कथन सही हैं? I. गर्म धाराएं जलवायु गर्म नम बनाती II. ठंडी धाराएं निकटवर्ती तटों पर मरुस्थल III. गर्म ठंडी के मिलने से मत्स्य क्षेत्र",opts_en:["I and II only","II and III only","I, II and III","Only I"],opts_hi:["केवल I और II","केवल II और III","I, II और III","केवल I"],correct:2,topic:"Oceanic Currents",level:"Hard",exam:"SSC CHSL 2023",exp_en:"Warm currents increase temperature and humidity, cold reduce. Atacama due to Peru, Namib due to Benguela. Mixing gives plankton.",exp_hi:"गर्म धाराएं तापमान आर्द्रता बढ़ातीं, ठंडी घटातीं। पेरू से अटाकामा, बेंगुएला से नामीब। मिश्रण से प्लवक।"},{en:"Match: A. Thermocline -1. Temp gradient B. Halocline -2. Salinity gradient C. Pycnocline -3. Density gradient D. Isopycnal -4. Equal density line",hi:"सुमेलित करें: A. थर्मोक्लाइन -1. तापमान प्रवणता B. हैलोक्लाइन -2. लवणता प्रवणता C. पिक्नोक्लाइन -3. घनत्व प्रवणता D. आइसोपिक्नल -4. समान घनत्व रेखा",opts_en:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3","A-3, B-2, C-1, D-4"],opts_hi:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-2, B-1, C-4, D-3","A-3, B-2, C-1, D-4"],correct:0,topic:"Other Phenomena",level:"Hard",exam:"SSC CGL 2021 Tier-II",exp_en:"All clines are rapid change zones in vertical profile, important for oceanography.",exp_hi:"सभी क्लाइन ऊर्ध्वाधर प्रोफाइल में तेजी से परिवर्तन क्षेत्र, समुद्र विज्ञान में महत्वपूर्ण।"},{en:"Consider about tides: I. Moon's gravity more effective than Sun due to proximity II. Spring tide higher than neap III. Bay of Fundy has highest tidal range. Which correct?",hi:"ज्वार के बारे में विचार: I. निकटता से चंद्रमा का गुरुत्व सूर्य से अधिक प्रभावी II. स्प्रिंग ज्वार निप से ऊंचा III. फंडी की खाड़ी में सबसे अधिक ज्वारीय सीमा। कौन सही?",opts_en:["I and II only","II and III only","Only I","I, II and III"],opts_hi:["केवल I और II","केवल II और III","केवल I","I, II और III"],correct:3,topic:"Other Phenomena",level:"Hard",exam:"SSC CGL 2020 Tier-II",exp_en:"Moon 2.2 times more effective, spring 20% higher, Fundy range upto 16m due to funnel shape.",exp_hi:"चंद्रमा 2.2 गुना अधिक प्रभावी, स्प्रिंग 20% ऊंचा, फंडी में कीप आकार से 16 मीटर तक सीमा।"},{en:"Which is NOT correctly matched? A. Dead Sea - high salinity B. Baltic - low salinity C. Equator - highest salinity D. Tropics - high salinity",hi:"कौन सही सुमेलित नहीं है? A. मृत सागर - उच्च लवणता B. बाल्टिक - कम लवणता C. भूमध्य रेखा - सर्वाधिक लवणता D. उष्णकटिबंध - उच्च लवणता",opts_en:["All correct","C only","A only","B and C"],opts_hi:["सभी सही","केवल C","केवल A","B और C"],correct:1,topic:"Oceanic Salinity",level:"Hard",exam:"SSC CHSL 2020",exp_en:"Equator low salinity, tropics high. So C is wrong.",exp_hi:"भूमध्य रेखा पर कम लवणता, उष्णकटिबंध में उच्च। इसलिए C गलत।"},{en:"El Nino and La Nina: I. El Nino warming off Peru II. La Nina cooling off Peru III. El Nino weakens Indian monsoon. Which correct?",hi:"एल नीनो और ला नीना: I. पेरू के पास एल नीनो गर्म होना II. पेरू के पास ला नीना ठंडा होना III. एल नीनो भारतीय मानसून कमजोर। कौन सही?",opts_en:["I and II only","Only I","I, II and III","II and III only"],opts_hi:["केवल I और II","केवल I","I, II और III","केवल II और III"],correct:2,topic:"Other Phenomena",level:"Hard",exam:"SSC CGL 2023 Tier-II",exp_en:"El Nino is warm phase of ENSO, La Nina cold phase, teleconnection affects global weather.",exp_hi:"एल नीनो ENSO का गर्म चरण, ला नीना ठंडा चरण, टेलीकनेक्शन वैश्विक मौसम प्रभावित करता है।"},{en:"Consider about ocean deposits: I. Neritic deposits on shelf II. Pelagic deposits in deep sea III. Diatom oozes in cold water. Which correct?",hi:"महासागरीय निक्षेपों पर विचार: I. नेरिटिक शेल्फ पर II. पेलैजिक गहरे समुद्र में III. डायटम ऊज ठंडे पानी में। कौन सही?",opts_en:["Only I","II and III only","I and II only","I, II and III"],opts_hi:["केवल I","केवल II और III","केवल I और II","I, II और III"],correct:3,topic:"Oceanic Structure",level:"Hard",exam:"SSC CGL 2021",exp_en:"Neritic terrigenous, pelagic organic and inorganic oozes, diatoms cold high latitudes, globigerina warm.",exp_hi:"नेरिटिक स्थलीय, पेलैजिक कार्बनिक अकार्बनिक ऊज, डायटम ठंडे उच्च अक्षांश, ग्लोबिजेरिना गर्म।"},{en:"Arrange oceans by size descending: 1. Pacific 2. Atlantic 3. Indian 4. Arctic",hi:"महासागरों को आकार के अवरोही क्रम में व्यवस्थित करें: 1. प्रशांत 2. अटलांटिक 3. हिंद 4. आर्कटिक",opts_en:["1 > 3 > 2 > 4","1 > 2 > 3 > 4","3 > 1 > 2 > 4","2 > 1 > 3 > 4"],opts_hi:["1 > 3 > 2 > 4","1 > 2 > 3 > 4","3 > 1 > 2 > 4","2 > 1 > 3 > 4"],correct:1,topic:"Oceanic Structure",level:"Hard",exam:"SSC MTS 2022",exp_en:"Pacific 165M km2, Atlantic 82M, Indian 70M, Arctic 15M, Southern 21M.",exp_hi:"प्रशांत 165M किमी2, अटलांटिक 82M, हिंद 70M, आर्कटिक 15M, दक्षिणी 21M।"},{en:"Match trenches with oceans: A. Mariana -1. Pacific B. Puerto Rico -2. Atlantic C. Java -3. Indian D. South Sandwich -4. Southern Atlantic. Correct:",hi:"गर्तों को महासागरों से सुमेलित: A. मारियाना -1. प्रशांत B. प्यूर्टो रिको -2. अटलांटिक C. जावा -3. हिंद D. साउथ सैंडविच -4. दक्षिणी अटलांटिक। सही:",opts_en:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-3, B-2, C-1, D-4","A-2, B-1, C-4, D-3"],opts_hi:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-3, B-2, C-1, D-4","A-2, B-1, C-4, D-3"],correct:0,topic:"Oceanic Structure",level:"Hard",exam:"SSC CGL 2020",exp_en:"Trenches at subduction zones, around Pacific Ring of Fire mostly.",exp_hi:"गर्तें सबडक्शन जोन पर, अधिकांश प्रशांत रिंग ऑफ फायर के आसपास।"},{en:"Consider: I. Cold currents originate at poles II. Warm currents originate at equator III. Coriolis deflects currents. Which correct?",hi:"विचार: I. ठंडी धाराएं ध्रुवों पर उत्पन्न II. गर्म धाराएं भूमध्य रेखा पर III. कोरियोलिस धाराओं को विक्षेपित करता। कौन सही?",opts_en:["Only III","I and II only","II and III only","I, II and III"],opts_hi:["केवल III","केवल I और II","केवल II और III","I, II और III"],correct:3,topic:"Oceanic Currents",level:"Hard",exam:"SSC CPO 2021",exp_en:"Temperature difference drives thermohaline, winds drive surface currents, Coriolis shapes gyres.",exp_hi:"तापमान अंतर थर्मोहेलाइन चलाता है, पवनें सतही धाराएं, कोरियोलिस गायरे बनाता है।"},{en:"Which of following are cold currents? I. Canary II. Oyashio III. Brazil",hi:"निम्न में से कौन ठंडी धाराएं हैं? I. कैनरी II. ओयाशियो III. ब्राजील",opts_en:["II and III only","I and III only","I and II only","I, II and III"],opts_hi:["केवल II और III","केवल I और III","केवल I और II","I, II और III"],correct:2,topic:"Oceanic Currents",level:"Hard",exam:"SSC CGL 2022",exp_en:"Canary and Oyashio cold, Brazil warm current in South Atlantic.",exp_hi:"कैनरी और ओयाशियो ठंडी, ब्राजील दक्षिण अटलांटिक में गर्म धारा।"},{en:"Consider about salinity distribution: I. Northern Hemisphere oceans more saline than Southern II. High salinity in enclosed seas III. Salinity decreases with depth after halocline. Which correct?",hi:"लवणता वितरण पर विचार: I. उत्तरी गोलार्ध महासागर दक्षिणी से अधिक लवणीय II. बंद सागरों में उच्च लवणता III. हैलोक्लाइन के बाद गहराई के साथ लवणता घटती। कौन सही?",opts_en:["I, II and III","I and II only","II and III only","Only II"],opts_hi:["I, II और III","केवल I और II","केवल II और III","केवल II"],correct:0,topic:"Oceanic Salinity",level:"Hard",exam:"SSC CGL 2021 Tier-II",exp_en:"NH more land, high evaporation, enclosed seas like Red Sea high. Salinity generally decreases after halocline then uniform.",exp_hi:"NH में अधिक भूमि, उच्च वाष्पीकरण, लाल सागर जैसे बंद सागर उच्च। हैलोक्लाइन के बाद लवणता घटती फिर समान।"},{en:"Which statements about upwelling and downwelling are correct? I. Upwelling brings cold nutrient-rich water up II. Downwelling takes warm water down III. Upwelling good for fishing",hi:"उत्प्रवाह और अधोप्रवाह के बारे में कौन से कथन सही हैं? I. उत्प्रवाह ठंडा पोषक जल ऊपर लाता II. अधोप्रवाह गर्म जल नीचे ले जाता III. उत्प्रवाह मत्स्य के लिए अच्छा",opts_en:["II and III only","Only I","I, II and III","I and II only"],opts_hi:["केवल II और III","केवल I","I, II और III","केवल I और II"],correct:2,topic:"Other Phenomena",level:"Hard",exam:"SSC CHSL 2023",exp_en:"Upwelling driven by offshore winds and Ekman transport, downwelling convergence, both part of vertical circulation.",exp_hi:"उत्प्रवाह अपतटीय पवनों और एकमैन परिवहन से, अधोप्रवाह अभिसरण, दोनों ऊर्ध्वाधर परिसंचरण का हिस्सा।"},{en:"Match ocean relief: A. Seamount -1. Submerged volcanic mountain B. Guyot -2. Flat topped seamount C. Atoll -3. Ring coral reef D. Canyon -4. Deep gorge on shelf. Correct:",hi:"महासागरीय स्थलाकृति सुमेलित: A. सीमाउंट -1. जलमग्न ज्वालामुखी पर्वत B. ग्योट -2. चपटे शीर्ष सीमाउंट C. एटोल -3. वलय प्रवाल D. कैनियन -4. शेल्फ पर गहरी खाई। सही:",opts_en:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-3, B-2, C-1, D-4","A-2, B-1, C-4, D-3"],opts_hi:["A-1, B-2, C-3, D-4","A-4, B-3, C-2, D-1","A-3, B-2, C-1, D-4","A-2, B-1, C-4, D-3"],correct:0,topic:"Oceanic Structure",level:"Hard",exam:"SSC CGL 2023 Tier-I",exp_en:"All are important ocean floor features formed by volcanic and erosional processes.",exp_hi:"सभी ज्वालामुखी और अपरदन प्रक्रियाओं से बनी महत्वपूर्ण महासागर तल विशेषताएं।"},{en:"Which is NOT a warm current? I. Agulhas II. Falkland III. North Atlantic Drift",hi:"कौन गर्म धारा नहीं है? I. अगुलहास II. फॉकलैंड III. उत्तरी अटलांटिक ड्रिफ्ट",opts_en:["Only I","Only II","I and II","II and III"],opts_hi:["केवल I","केवल II","I और II","II और III"],correct:1,topic:"Oceanic Currents",level:"Hard",exam:"SSC CGL 2020",exp_en:"Falkland is cold current off SE South America, Agulhas warm off Africa, NAD warm extension of Gulf Stream.",exp_hi:"फॉकलैंड SE दक्षिण अमेरिका के पास ठंडी, अगुलहास अफ्रीका के पास गर्म, NAD गल्फ स्ट्रीम का गर्म विस्तार।"},{en:"Consider: I. Ocean temperature decreases with depth II. Thermocline is absent at equator III. Highest ocean temperature at equator. Which is/are incorrect?",hi:"विचार: I. गहराई के साथ तापमान घटता II. थर्मोक्लाइन भूमध्य रेखा पर अनुपस्थित III. सर्वाधिक तापमान भूमध्य रेखा पर। कौन गलत?",opts_en:["Only II","II and III","I and III","Only I"],opts_hi:["केवल II","II और III","I और III","केवल I"],correct:0,topic:"Other Phenomena",level:"Hard",exam:"SSC CPO 2022",exp_en:"Thermocline prominent at tropics, weak/absent at poles, temperature decreases with depth, highest at equator.",exp_hi:"थर्मोक्लाइन उष्णकटिबंध में प्रमुख, ध्रुवों पर कमजोर/अनुपस्थित, गहराई से तापमान घटता, भूमध्य रेखा पर सर्वाधिक।"},{en:"Indian Ocean currents include: I. Somali Current II. Mozambique Current III. West Australian Current. Which are part of Indian Ocean?",hi:"हिंद महासागर धाराओं में शामिल: I. सोमाली धारा II. मोजाम्बिक धारा III. पश्चिम ऑस्ट्रेलियाई धारा। कौन हिंद महासागर का हिस्स
