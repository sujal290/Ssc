 Woods conference in July 1944 with 44 Allied nations decided to create IMF and IBRD to ensure post-war monetary stability and reconstruction.",exp_hi:"ब्रेटन वुड्स सम्मेलन जुलाई 1944 में 44 देशों के साथ IMF और IBRD बनाने का निर्णय लिया गया।"},{id:2,level:"moderate",exam:"SSC CPO 2022",q_en:"Industrial Policy Resolution 1956 is based on:",q_hi:"औद्योगिक नीति प्रस्ताव 1956 आधारित है?",opts_en:["Gandhian Model","Mixed Economy / Socialist pattern","Laissez faire","Capitalist Model"],opts_hi:["गांधीवादी मॉडल","मिश्रित अर्थव्यवस्था / समाजवादी पैटर्न","अहस्तक्षेप","पूंजीवादी मॉडल"],correct:1,exp_en:"IPR 1956 is called Economic Constitution of India. It laid foundation of mixed economy and socialist pattern of society.",exp_hi:"IPR 1956 को भारत का आर्थिक संविधान कहा जाता है। मिश्रित अर्थव्यवस्था की नींव।"},{id:3,level:"moderate",exam:"SSC CGL 2022",q_en:"World Bank President is traditionally from:",q_hi:"विश्व बैंक अध्यक्ष परंपरागत रूप से किस देश से?",opts_en:["Europe","Africa","USA","Asia"],opts_hi:["यूरोप","अफ्रीका","USA","एशिया"],correct:2,exp_en:"By convention, World Bank President is nominated by USA (largest shareholder), IMF MD from Europe.",exp_hi:"परंपरा से विश्व बैंक अध्यक्ष USA द्वारा नामित होता है, IMF प्रबंध निदेशक यूरोप से।"},{id:4,level:"moderate",exam:"SSC CHSL 2023",q_en:"Industrial Policy Resolution 1948 classified industries into:",q_hi:"औद्योगिक नीति प्रस्ताव 1948 में उद्योगों को कितनी श्रेणियों में बाँटा?",opts_en:["6 categories","5 categories","4 categories","3 categories"],opts_hi:["6 श्रेणियाँ","5 श्रेणियाँ","4 श्रेणियाँ","3 श्रेणियाँ"],correct:2,exp_en:"IPR 1948, first industrial policy of independent India, classified industries into 4 categories including strategic, key, important, others.",exp_hi:"IPR 1948 स्वतंत्र भारत की पहली औद्योगिक नीति थी, 4 श्रेणियों में वर्गीकरण।"},{id:5,level:"moderate",exam:"SSC CGL 2021",q_en:"New Economic Policy 1991 is also known as:",q_hi:"नई आर्थिक नीति 1991 को और क्या कहा जाता है?",opts_en:["Rolling Plan","Garibi Hatao","Green Revolution","LPG Reforms"],opts_hi:["रोलिंग प्लान","गरीबी हटाओ","हरित क्रांति","LPG सुधार"],correct:3,exp_en:"1991 reforms are LPG - Liberalization, Privatization, Globalization under PM Narasimha Rao and FM Manmohan Singh.",exp_hi:"1991 सुधार LPG - उदारीकरण, निजीकरण, वैश्वीकरण कहे जाते हैं।"},{id:6,level:"moderate",exam:"SSC CGL 2022",q_en:"Which institution publishes World Economic Outlook?",q_hi:"वर्ल्ड इकोनॉमिक आउटलुक कौन प्रकाशित करता है?",opts_en:["WTO","UNDP","IMF","World Bank"],opts_hi:["WTO","UNDP","IMF","विश्व बैंक"],correct:2,exp_en:"IMF publishes WEO twice a year, Global Financial Stability Report and Fiscal Monitor.",exp_hi:"IMF वर्ष में दो बार WEO प्रकाशित करता है।"},{id:7,level:"moderate",exam:"SSC CHSL 2020",q_en:"Twelfth Five Year Plan period was:",q_hi:"बारहवीं पंचवर्षीय योजना की अवधि थी?",opts_en:["2012-17","2011-16","2002-07","2007-12"],opts_hi:["2012-17","2011-16","2002-07","2007-12"],correct:0,exp_en:"12th Plan 2012-17 was last Five Year Plan. Theme: Faster, More Inclusive and Sustainable Growth. NITI Aayog replaced Planning Commission in 2015.",exp_hi:"12वीं योजना 2012-17 अंतिम योजना थी। थीम: तेज, समावेशी और सतत विकास।"},{id:8,level:"moderate",exam:"SSC CGL 2019",q_en:"Which Five Year Plan was terminated one year early by Janata Government?",q_hi:"किस पंचवर्षीय योजना को जनता सरकार ने एक साल पहले समाप्त किया?",opts_en:["Seventh Plan","Sixth Plan","Fourth Plan","Fifth Plan"],opts_hi:["सातवीं योजना","छठी योजना","चतुर्थ योजना","पांचवीं योजना"],correct:3,exp_en:"Fifth Plan 1974-79 launched by D.P. Dhar, terminated in 1978 by Morarji Desai govt which introduced Rolling Plan.",exp_hi:"पांचवीं योजना 1974-79 को 1978 में मोरारजी देसाई सरकार ने समाप्त कर रोलिंग प्लान लाया।"},{id:9,level:"moderate",exam:"SSC MTS 2023",q_en:"Soft Loan Window of World Bank Group is:",q_hi:"विश्व बैंक समूह की सॉफ्ट लोन विंडो कौन सी है?",opts_en:["IBRD","MIGA","IFC","IDA"],opts_hi:["IBRD","MIGA","IFC","IDA"],correct:3,exp_en:"IDA (International Development Asso ",exp_hi:"पी.वी. नरसिम्हा राव पीएम, मनमोहन सिंह वित्त मंत्री ने 24 जुलाई 1991 को घोषणा की।"},{id:29,level:"moderate",exam:"SSC CGL 2021",q_en:"Special Drawing Rights (SDR) is:",q_hi:"SDR क्या है?",opts_en:["IMF reserve asset","World Bank loan","WTO currency","Gold coin"],opts_hi:["IMF आरक्षित संपत्ति","विश्व बैंक ऋण","WTO मुद्रा","सोने का सिक्का"],correct:0,exp_en:"SDR created 1969 as supplementary reserve asset, called Paper Gold, basket of 5 currencies.",exp_hi:"SDR 1969 में पूरक आरक्षित संपत्ति के रूप में बना, पेपर गोल्ड।"},{id:30,level:"moderate",exam:"SSC CPO 2022",q_en:"NITI Aayog replaced Planning Commission on:",q_hi:"नीति आयोग ने योजना आयोग को कब बदला?",opts_en:["1 Jan 2014","1 Jan 2015","15 Aug 2014","2 Oct 2015"],opts_hi:["1 जनवरी 2014","1 जनवरी 2015","15 अगस्त 2014","2 अक्टूबर 2015"],correct:1,exp_en:"NITI Aayog formed 1 Jan 2015, Chair PM, Vice Chair, CEO, Think tank.",exp_hi:"नीति आयोग 1 जनवरी 2015 को बना, अध्यक्ष पीएम।"},{id:31,level:"moderate",exam:"SSC CGL 2023",q_en:"Disinvestment Commission was first set up in:",q_hi:"विनिवेश आयोग पहली बार कब बना?",opts_en:["1991","1993","1996","1999"],opts_hi:["1991","1993","1996","1999"],correct:2,exp_en:"G.V. Ramakrishna Committee 1996 recommended disinvestment.",exp_hi:"जी.वी. रामकृष्ण समिति 1996।"},{id:32,level:"moderate",exam:"SSC CHSL 2021",q_en:"New Industrial Policy 1991 abolished:",q_hi:"नई औद्योगिक नीति 1991 ने क्या समाप्त किया?",opts_en:["MRTP limit","License Raj largely","Both A and B","None"],opts_hi:["MRTP सीमा","लाइसेंस राज अधिकांश","दोनों A और B","कोई नहीं"],correct:2,exp_en:"Industrial licensing almost abolished, MRTP asset limit scrapped, FERA diluted.",exp_hi:"लाइसेंस राज लगभग समाप्त, MRTP सीमा खत्म।"},{id:33,level:"moderate",exam:"SSC CGL 2022",q_en:"India's forex crisis 1991 forex reserves were left for:",q_hi:"1991 संकट में विदेशी मुद्रा कितने सप्ताह हेतु बची थी?",opts_en:["1 week","3 weeks","2 months","1 month"],opts_hi:["1 सप्ताह","3 सप्ताह","2 महीने","1 महीना"],correct:1,exp_en:"Forex down to $1.2 bn enough for 3 weeks imports, gold pledged 67 tons to Bank of England.",exp_hi:"विदेशी मुद्रा $1.2bn केवल 3 सप्ताह हेतु बची, 67 टन सोना गिरवी रखा।"},{id:34,level:"moderate",exam:"SSC MTS 2023",q_en:"World Bank's Ease of Doing Business report started in:",q_hi:"ईज ऑफ डूइंग बिजनेस रिपोर्ट कब शुरू?",opts_en:["2003","2005","2001","2010"],opts_hi:["2003","2005","2001","2010"],correct:0,exp_en:"Doing Business started 2003, discontinued 2021 due to data irregularities.",exp_hi:"2003 शुरू, 2021 में बंद।"},{id:35,level:"moderate",exam:"SSC CGL 2020",q_en:"Sixth Five Year Plan slogan was:",q_hi:"छठी पंचवर्षीय योजना का नारा?",opts_en:["Garibi Hatao","Growth with Social Justice","Inclusive Growth","Self Reliance"],opts_hi:["गरीबी हटाओ","सामाजिक न्याय के साथ विकास","समावेशी विकास","आत्मनिर्भरता"],correct:1,exp_en:"Sixth Plan 1980-85 slogan Growth with Social Justice, also IRDP, NREP started.",exp_hi:"छठी 1980-85 नारा सामाजिक न्याय के साथ विकास।"},{id:36,level:"moderate",exam:"SSC CHSL 2022",q_en:"IMF members currently:",q_hi:"IMF में वर्तमान सदस्य संख्या?",opts_en:["189","190","191","192"],opts_hi:["189","190","191","192"],correct:2,exp_en:"IMF 191 members (190+ Liechtenstein joined 2024). World Bank 189.",exp_hi:"IMF में 191 सदस्य, विश्व बैंक में 189।"},{id:37,level:"moderate",exam:"SSC CGL 2024",q_en:"IPR 1977 emphasized:",q_hi:"IPR 1977 में किस पर जोर दिया गया?",opts_en:["Large scale","Small scale and cottage industries","Heavy industries","FDI"],opts_hi:["बड़े पैमाने","लघु और कुटीर उद्योग","भारी उद्योग","FDI"],correct:1,exp_en:"IPR 1977 by Janata Govt focused on small scale, Tiny sector, District Industries Centres.",exp_hi:"IPR 1977 लघु उद्योगों पर केंद्रित, जिला उद्योग केंद्र।"},{id:38,level:"moderate",exam:"SSC CPO 2023",q_en:"Eighth Five Year Plan is called:",q_hi:"आठवीं पंचवर्षीय योजना को कहा जाता है?",opts_en:["Plan Holiday","Rolling Plan","Rao-Manmohan Plan","Gadgil Plan"],opts_hi:["योजना अवकाश","रोलिंग प्लान","राव-मनमोहन योजना","गाडगिल योजना"],correct:2,exp_en:"8th Plan 1992-97 called Rao-Manmohan Plan, first after reforms, John W Miller model, highest growth 6.8%.",exp_hi:"8वीं 1992-97 राव-मनमोहन योजना, सुधारों के बाद पहली, सर्वाधिक वृद्धि 6.8%।"},{id:39,level:"moderate",exam:"SSC CGL 2021",q_en:"Privatization means:",q_hi:"निजीकरण का अर्थ है?",opts_en:["Selling govt assets to private","Nationalization","Closing PSUs","Joint venture only"],opts_hi:["सरकारी संपत्ति निजी को बेचना","राष्ट्रीयकरण","PSU बंद करना","केवल संयुक्त उद्यम"],correct:0,exp_en:"Privatization is transfer of ownership from public to private sector to improve efficiency.",exp_hi:"निजीकरण सार्वजनिक से निजी क्षेत्र में स्वामित्व हस्तांतरण है।"},{id:40,level:"moderate",exam:"SSC MTS 2022",q_en:"Gadgil Yojana is:",q_hi:"गाडगिल योजना कौन सी है?",opts_en:["First Plan","Third Plan","Fourth Plan","Fifth Plan"],opts_hi:["पहली योजना","तीसरी योजना","चौथी योजना","पांचवीं योजना"],correct:1,exp_en:"Third Plan 1961-66 called Gadgil Yojana after D.R. Gadgil Deputy Chairman.",exp_hi:"तीसरी योजना गाडगिल योजना कहलाती है।"},{id:41,level:"hard",exam:"SSC CGL Tier-II 2023",q_en:"Match: A. First Plan - 1.Harrod Domar B.Second - 2.Mahalanobis C.Fourth - 3.Ashok Rudra D.Fifth -4.D.P. Dhar",q_hi:"मिलान: A.प्रथम-1.हैरॉड-डोमर B.द्वितीय-2.महालनोबिस C.चतुर्थ-3.अशोक रुद्र D.पंचम-4.डीपी धर",opts_en:["A1 B2 C3 D4","A2 B1 C3 D4","A1 B2 C4 D3","A3 B2 C1 D4"],opts_hi:["A1 B2 C3 D4","A2 B1 C3 D4","A1 B2 C4 D3","A3 B2 C1 D4"],correct:0,exp_en:"Correct match: First Harrod Domar, Second Mahalanobis, Fourth Ashok Rudra Manne model, Fifth D.P. Dhar model.",exp_hi:"सही मिलान: प्रथम हैरॉड-डोमर, द्वितीय महालनोबिस, चतुर्थ अशोक रुद्र मान, पंचम डीपी धर।"},{id:42,level:"hard",exam:"SSC CGL 2024",q_en:"Consider: I.1956 reserved 17 industries for public II.1991 kept 8 reserved III.Now only 2 reserved. Correct?",q_hi:"विचार करें: I.1956 में 17 सार्वजनिक हेतु II.1991 में 8 आरक्षित III.अब केवल 2। सही?",opts_en:["Only I and II","Only I","Only III","I, II and III"],opts_hi:["केवल I और II","केवल I","केवल III","I, II और III"],correct:3,exp_en:"17 in 1956, 8 in 1991, now 2 - Atomic energy and Railway (partial).",exp_hi:"1956 में 17, 1991 में 8, अब 2 - परमाणु ऊर्जा और रेलवे।"},{id:43,level:"hard",exam:"SSC CGL 2022",q_en:"Which statements about IMF? I.India founder II.Quota 2.75% III.Voting 2.63% IV.Head MD always European",q_hi:"IMF पर कौन सा कथन? I.भारत संस्थापक II.कोटा 2.75% III.वोट 2.63% IV.प्रमुख MD यूरोपीय",opts_en:["I, II, III and IV","Only I and II","Only I, II and III","Only II and IV"],opts_hi:["I, II, III और IV","केवल I और II","केवल I, II और III","केवल II और IV"],correct:0,exp_en:"All statements correct about IMF. India's SDR basket quota important.",exp_hi:"सभी कथन IMF पर सही हैं।"},{id:44,level:"hard",exam:"CDS 2021",q_en:"Globalization includes: I.Free trade II.Free capital movement III.Free labour movement IV.Free technology. Correct?",q_hi:"वैश्वीकरण में शामिल: I.मुक्त व्यापार II.पूंजी प्रवाह III.श्रम प्रवाह IV.तकनीक। सही?",opts_en:["Only I and II","I, II and IV","I, II, III and IV","Only I, III"],opts_hi:["केवल I और II","I, II और IV","I, II, III और IV","केवल I, III"],correct:2,exp_en:"Globalization is all four flows - trade, capital, labour, technology, information.",exp_hi:"वैश्वीकरण में चारों प्रवाह शामिल हैं।"},{id:45,level:"hard",exam:"SSC CGL 2023",q_en:"About LPG: I.Liberalization reduces controls II.Privatization disinvestment III.Globalization integrates economy. Correct?",q_hi:"LPG पर: I.उदारीकरण नियंत्रण कम II.निजीकरण विनिवेश III.वैश्वीकरण एकीकरण। सही?",opts_en:["Only I","I, II and III","Only II and III","Only I and II"],opts_hi:["केवल I","I, II और III","केवल II और III","केवल I और II"],correct:1,exp_en:"All three definitions correct. LPG reforms 1991 transformed India from License Raj to market economy.",exp_hi:"तीनों परिभाषाएँ सही हैं।"},{id:46,level:"hard",exam:"SSC CPO 2022",q_en:"Which is NOT part of World Bank Group?",q_hi:"कौन विश्व बैंक समूह का हिस्सा नहीं?",opts_en:["IBRD","IMF","IDA","MIGA"],opts_hi:["IBRD","IMF","IDA","MIGA"],correct:1,exp_en:"IMF is separate Bretton Woods twin but not part of WB Group. WB Group 5 orgs.",exp_hi:"IMF अलग है, WB समूह का हिस्सा नहीं।"},{id:47,level:"hard",exam:"SSC CGL 2020",q_en:"Consider IPR 1956: I.Schedule A 17 industries govt II.Schedule B 12 mixed III.Schedule C left private. Correct?",q_hi:"IPR 1956 पर विचार: I.अनुसूची A 17 सरकारी II.B 12 मिश्रित III.C निजी। सही?",opts_en:["Only I","I and II","I, II and III","Only II and III"],opts_hi:["केवल I","I और II","I, II और III","केवल II और III"],correct:2,exp_en:"IPR 1956 had 3 schedules: A 17 state monopoly, B 12 progressive state, C rest private.",exp_hi:"IPR 1956 में 3 अनुसूचियाँ: A 17 राज्य एकाधिकार, B 12 प्रगतिशील, C निजी।"},{id:48,level:"hard",exam:"SSC CHSL 2023",q_en:"Second generation reforms (2000s) include: I.Fiscal Responsibility II.FRBM III.Labour reforms IV.Banking reforms. Correct?",q_hi:"दूसरी पीढ़ी सुधार में: I.राजकोषीय II.FRBM III.श्रम IV.बैंकिंग। सही?",opts_en:["Only I and II","I, II, III and IV","Only II and III","Only III and IV"],opts_hi:["केवल I और II","I, II, III और IV","केवल II और III","केवल III और IV"],correct:1,exp_en:"Second gen reforms focus on structural - fiscal, labour, banking, legal.",exp_hi:"दूसरी पीढ़ी संरचनात्मक सुधारों पर केंद्रित।"},{id:49,level:"hard",exam:"SSC CGL Tier-II 2022",q_en:"Match Institutions: A.IMF -1.Long term B.WB-2.Short term C.WTO-3.Trade D.ADB-4.Regional Dev",q_hi:"मिलान: A.IMF-1.दीर्घ B.WB-2.अल्प C.WTO-3.व्यापार D.ADB-4.क्षेत्रीय विकास",opts_en:["A2 B1 C3 D4","A1 B2 C3 D4","A2 B1 C4 D3","A1 B2 C4 D3"],opts_hi:["A2 B1 C3 D4","A1 B2 C3 D4","A2 B1 C4 D3","A1 B2 C4 D3"],correct:0,exp_en:"IMF short term BOP, WB long term development, WTO trade rules, ADB regional development.",exp_hi:"IMF अल्पकालिक BOP, WB दीर्घ विकास, WTO व्यापार नियम।"},{id:50,level:"hard",exam:"SSC CGL 2021",q_en:"Which statements about 1991 crisis? I.Fiscal deficit 8% II.Current account 3% III.Inflation 17% IV.Forex $1.2bn",q_hi:"1991 संकट पर: I.राजकोषीय घाटा 8% II.चालू खाता 3% III.मुद्रास्फीति 17% IV.विदेशी मुद्रा $1.2bn",opts_en:["Only I and II","I, II, III and IV","Only I, II and III","Only IV"],opts_hi:["केवल I और II","I, II, III और IV","केवल I, II और III","केवल IV"],correct:1,exp_en:"All indicators severe in 1991 triggered IMF bailout.",exp_hi:"1991 में सभी संकेतक गंभीर थे।"},{id:51,level:"hard",exam:"UPSC CAPF 2022",q_en:"Liberalization measures 1991: I.Abolish licensing II.Increase MRTP limit III.Free imports IV.Devalue rupee. Correct?",q_hi:"उदारीकरण उपाय 1991: I.लाइसेंस समाप्त II.MRTP सीमा वृद्धि III.मुक्त आयात IV.अवमूल्यन। सही?",opts_en:["Only I and IV","I, III and IV","I, II, III and IV","Only I"],opts_hi:["केवल I और IV","I, III और IV","I, II, III और IV","केवल I"],correct:1,exp_en:"MRTP limit abolished not increased, other three correct.",exp_hi:"MRTP सीमा समाप्त की गई बढ़ाई नहीं, बाकी तीन सही।"},{id:52,level:"hard",exam:"SSC CGL 2023",q_en:"Consider Plans: I.First Plan agriculture II.Second heavy industry III.Third self-reliance IV.Fifth poverty removal. Correct?",q_hi:"योजनाओं पर: I.प्रथम कृषि II.द्वितीय भारी उद्योग III.तृतीय आत्मनिर्भरता IV.पंचम गरीबी उन्मूलन। सही?",opts_en:["Only I and II","I, II, III and IV","Only III and IV","Only I, II and III"],opts_hi:["केवल I और II","I, II, III और IV","केवल III और IV","केवल I, II और III"],correct:1,exp_en:"All correctly associated with plan focus.",exp_hi:"सभी सही योजना फोकस से संबंधित।"},{id:53,level:"hard",exam:"SSC CGL 2022",q_en:"Which NOT an objective of IMF?",q_hi:"कौन सा IMF का उद्देश्य नहीं?",opts_en:["Promote global monetary cooperation","Promote long term development finance","Ensure financial stability","Facilitate trade"],opts_hi:["वैश्विक मौद्रिक सहयोग","दीर्घकालिक विकास वित्त","वित्तीय स्थिरता","व्यापार सुविधा"],correct:1,exp_en:"Long term development is WB objective, IMF is short term BOP stability.",exp_hi:"दीर्घकालिक विकास WB का उद्देश्य, IMF का अल्पकालिक BOP स्थिरता।"},{id:54,level:"hard",exam:"SSC CPO 2023",q_en:"Match Five Year Plans achievements: A.First - 1.3.6% growth B.Second-2.Bhilai steel C.Fourth-3.Bank nationalization D.Sixth-4.IRDP",q_hi:"मिलान उपलब्धियाँ: A.प्रथम-1.3.6% वृद्धि B.द्वितीय-2.भिलाई स्टील C.चतुर्थ-3.बैंक राष्ट्रीयकरण D.छठी-4.IRDP",opts_en:["A1 B2 C3 D4","A2 B1 C3 D4","A1 B3 C2 D4","A4 B2 C3 D1"],opts_hi:["A1 B2 C3 D4","A2 B1 C3 D4","A1 B3 C2 D4","A4 B2 C3 D1"],correct:0,exp_en:"All matches correct chronologically.",exp_hi:"सभी मिलान कालानुक्रमिक रूप से सही।"},{id:55,level:"hard",exam:"SSC CGL Tier-II 2023",q_en:"Statements about World Bank: I.IBRD 1944 II.IDA 1960 III.IFC 1956 IV.MIGA 1988. Correct?",q_hi:"विश्व बैंक पर: I.IBRD 1944 II.IDA 1960 III.IFC 1956 IV.MIGA 1988। सही?",opts_en:["Only I and II","I, II, III and IV","Only II and III","Only I, II and III"],opts_hi:["केवल I और II","I, II, III और IV","केवल II और III","केवल I, II और III"],correct:1,exp_en:"All founding years correct: IBRD 44, IFC 56, IDA 60, MIGA 88, ICSID 66.",exp_hi:"सभी स्थापना वर्ष सही।"},{id:56,level:"hard",exam:"SSC CGL 2021",q_en:"Which pair wrong? A.Bretton Woods-1944 B.FIPB abolish-2017 C.FERA to FEMA-1999 D.MRTP to Competition-2009",q_hi:"कौन सा जोड़ा गलत? A.ब्रेटन वुड्स-1944 B.FIPB समाप्त-2017 C.FERA से FEMA-1999 D.MRTP से प्रतिस्पर्धा-2009",opts_en:["A only","D only","B and C","C only"],opts_hi:["केवल A","केवल D","B और C","केवल C"],correct:1,exp_en:"MRTP to Competition 2002 not 2009 (Act 2002, CCI 2003, enforced 2009).",exp_hi:"MRTP से प्रतिस्पर्धा 2002, लागू 2009 में।"},{id:57,level:"hard",exam:"SSC CGL 2024",q_en:"About disinvestment: I.Target 1991-92 Rs 2500cr II.Actual 3038cr III.DIPAM renamed 2016 IV.National Investment Fund 2005. Correct?",q_hi:"विनिवेश पर: I.लक्ष्य 1991-92 2500cr II.वास्तविक 3038cr III.DIPAM 2016 IV.NIF 2005। सही?",opts_en:["Only I and II","I, II, III and IV","Only III and IV","Only I, III"],opts_hi:["केवल I और II","I, II, III और IV","केवल III और IV","केवल I, III"],correct:1,exp_en:"All historically correct about disinvestment journey.",exp_hi:"विनिवेश यात्रा पर सभी ऐतिहासिक रूप से सही।"},{id:58,level:"hard",exam:"S nts of LPG which reduces direct state role, increases market role.",exp_hi:"तीनों LPG के घटक हैं जो राज्य की भूमिका घटाते हैं।"},{id:62,level:"hard",exam:"CDS 2023",q_en:"Statement I: Planning Commission advisory, NITI Aayog think tank II: NITI has Governing Council of CMs. Correct?",q_hi:"कथन I: योजना आयोग सलाहकार, नीति आयोग थिंक टैंक II: नीति में CMs की गवर्निंग काउंसिल। सही?",opts_en:["Only I","Only II","Both I and II","Neither"],opts_hi:["केवल I","केवल II","दोनों I और II","कोई नहीं"],correct:2,exp_en:"Both statements correct. NITI more federal, bottom-up, cooperative federalism.",exp_hi:"दोनों कथन सही, नीति अधिक संघीय।"},{id:63,level:"hard",exam:"SSC CGL Tier-II 2022",q_en:"Which is correct about IMF conditionality? I.Structural reforms II.Fiscal austerity III.Privatization push IV.Trade liberalization",q_hi:"IMF सशर्तता पर सही? I.संरचनात्मक सुधार II.राजकोषीय तपस्या III.निजीकरण जोर IV.व्यापार उदारीकरण",opts_en:["Only I and II","I, II, III and IV","Only I and III","Only II and IV"],opts_hi:["केवल I और II","I, II, III और IV","केवल I और III","केवल II और IV"],correct:1,exp_en:"IMF conditionality includes all - Washington Consensus.",exp_hi:"IMF सशर्तता में सभी शामिल - वाशिंगटन सहमति।"},{id:64,level:"hard",exam:"SSC CHSL 2022",q_en:"About IPR 1956: I.Mahalanobis model influence II.Public sector dominant III.Private secondary IV.Economic Constitution. Correct?",q_hi:"IPR 1956 पर: I.महालनोबिस प्रभाव II.सार्वजनिक प्रभुत्व III.निजी गौण IV.आर्थिक संविधान। सही?",opts_en:["Only I and II","I, II, III and IV","Only IV","Only II and III"],opts_hi:["केवल I और II","I, II, III और IV","केवल IV","केवल II और III"],correct:1,exp_en:"All correct about IPR 1956, base of Nehruvian socialism.",exp_hi:"IPR 1956 पर सभी सही, नेहरूवादी समाजवाद का आधार।"},{id:65,level:"hard",exam:"SSC CGL 2021",q_en:"Consider: I.World Bank 189 members II.IMF 191 III.India founder both IV.Both HQ Washington. Correct?",q_hi:"विचार: I.WB 189 सदस्य II.IMF 191 III.भारत संस्थापक दोनों IV.दोनों मुख्यालय वाशिंगटन। सही?",opts_en:["Only I and II","I, II, III and IV","Only I, III and IV","Only II and III"],opts_hi:["केवल I और II","I, II, III और IV","केवल I, III और IV","केवल II और III"],correct:1,exp_en:"All correct.",exp_hi:"सभी सही।"},{id:66,level:"hard",exam:"SSC CGL 2024",q_en:"Bretton Woods Twins are:",q_hi:"ब्रेटन वुड्स ट्विन्स हैं?",opts_en:["IMF & World Bank","World Bank & ADB","IMF & ADB","IMF & WTO"],opts_hi:["IMF और विश्व बैंक","WB और ADB","IMF और ADB","IMF और WTO"],correct:0,exp_en:"Twins = IMF & IBRD (World Bank). Created same conference.",exp_hi:"ट्विन्स = IMF और IBRD।"},{id:67,level:"hard",exam:"SSC CHSL 2022",q_en:"I.IMF short term BOP II.WB long term development III.IMF for world trade. Correct?",q_hi:"I.IMF अल्प BOP II.WB दीर्घ विकास III.IMF विश्व व्यापार हेतु। सही?",opts_en:["I, II and III","Only I","Only III","Only I and II"],opts_hi:["I, II और III","केवल I","केवल III","केवल I और II"],correct:3,exp_en:"IMF short BOP, WB long development, WTO for trade not IMF.",exp_hi:"IMF अल्प BOP, WB दीर्घ, व्यापार हेतु WTO।"},{id:68,level:"hard",exam:"SSC CGL 2020",q_en:"Correct about SDR? I.Created 1969 II.Paper Gold III.Allocation quota based IV.Used only among IMF members. Correct?",q_hi:"SDR पर सही? I.1969 सृजन II.पेपर गोल्ड III.कोटा आधारित आवंटन IV.केवल IMF सदस्यों में उपयोग। सही?",opts_en:["Only I","Only I and II","I, II, III and IV","Only III and IV"],opts_hi:["केवल I","केवल I और II","I, II, III और IV","केवल III और IV"],correct:2,exp_en:"All four statements about SDR are correct.",exp_hi:"SDR पर सभी चार कथन सही।"},{id:69,level:"hard",exam:"SSC CGL 2022",q_en:"About 1991 reforms: I.Devaluation II.Gold pledge 67 tons III.IMF loan $2.2bn IV.De-licensing. Correct?",q_hi:"1991 सुधार: I.अवमूल्यन II.67 टन सोना गिरवी III.IMF ऋण $2.2bn IV.डी-लाइसेंसिंग। सही?",opts_en:["I, II, III and IV","Only IV","Only I and IV","I and II"],opts_hi:["I, II, III और IV","केवल IV","केवल I और IV","I और II"],correct:0,exp_en:"All four happened during 1991 crisis management.",exp_hi:"1991 संकट प्रबं
