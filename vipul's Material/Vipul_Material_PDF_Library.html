<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSC CGL  Material Library</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#f5f5f7;--sidebar:#ededf2;--panel:#fff;--line:#d8d8dd;
 --text:#1d1d1f;--muted:#6e6e73;--blue:#007aff;--soft:#e6f1ff;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{height:100vh;display:flex;overflow:hidden}
.sidebar{width:235px;flex:0 0 235px;background:var(--sidebar);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column}
.brand{padding:4px 10px 20px}
.brand h2{font-size:18px;margin:0 0 4px;letter-spacing:-.3px}
.brand p{margin:0;color:var(--muted);font-size:11px}
.label{font-size:10px;color:#8a8a8f;font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:0 10px 8px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;border-radius:8px;padding:9px 10px;text-align:left;font-size:13px;color:#38383d;cursor:pointer;display:flex;gap:9px;align-items:center}
.nav button:hover{background:#e2e2e7}
.nav button.active{background:var(--soft);color:#0066cc;font-weight:650}
.count{margin-left:auto;color:#8b8b90;font-size:11px}
.bottom{margin-top:auto;padding:16px 10px 3px;color:#888;font-size:10px;line-height:1.5}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{height:70px;flex:0 0 70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
.traffic{display:flex;gap:7px;margin-right:5px}.traffic i{width:11px;height:11px;border-radius:50%;background:#d1d1d6}
.arrows button{border:0;background:transparent;color:#555;font-size:22px;width:27px;height:30px;border-radius:7px;cursor:pointer}
.arrows button:hover{background:#eeeef1}
.path{font-size:13px;white-space:nowrap}.path span{color:#999;margin:0 7px}
.searchWrap{margin-left:auto;position:relative}.searchIcon{position:absolute;left:11px;top:8px;color:#777}
#search{width:300px;height:34px;border:1px solid #d1d1d6;border-radius:9px;background:#f4f4f6;padding:7px 12px 7px 31px;outline:none;font-size:13px}
#search:focus{background:#fff;border-color:#8bbcf5;box-shadow:0 0 0 3px #007aff18}
.main{overflow:auto;padding:23px 26px 35px}
.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px;gap:20px}
h1{font-size:25px;letter-spacing:-.6px;margin:0 0 5px}
.sub{margin:0;color:var(--muted);font-size:12px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e1e1e5;border-radius:13px;padding:14px;min-height:145px;display:flex;flex-direction:column;transition:.15s;box-shadow:0 1px 2px #00000008}
.card:hover{transform:translateY(-2px);border-color:#a9cbed;box-shadow:0 8px 24px #00000010}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon{font-size:23px}.tag{font-size:9px;color:#667;text-transform:uppercase;font-weight:750;letter-spacing:.6px}
.card h3{font-size:14px;line-height:1.35;margin:12px 0 7px}
.file{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{margin-top:auto;padding-top:12px;color:var(--blue);font-size:11px;font-weight:650;text-decoration:none}
.empty{display:none;text-align:center;color:var(--muted);padding:80px}
@media(max-width:800px){.sidebar{width:190px;flex-basis:190px}#search{width:230px}}
@media(max-width:620px){.sidebar{display:none}.path{display:none}.searchWrap{width:100%}#search{width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <h2>📚 Material Library</h2>
    <p>SSC CGL</p>
  </div>
  <div class="label">Folders</div>
  <div class="nav" id="nav"></div>
  <div class="bottom">
    Local study library<br>
    <span id="total"></span> files indexed
  </div>
</aside>

<section class="content">
  <div class="toolbar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="arrows">
      <button id="back">‹</button><button id="forward">›</button>
    </div>
    <div class="path"><b>SSC Material</b><span>›</span><span id="crumb">All Files</span></div>
    <div class="searchWrap">
      <span class="searchIcon">⌕</span>
      <input id="search" placeholder="Search files or topics..." autocomplete="off">
    </div>
  </div>

  <main class="main">
    <div class="heading">
      <div>
        <h1 id="title">All Files</h1>
        <p class="sub">Open the original local study files directly from their folders.</p>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="empty" id="empty">🔎<br><br>No matching file found.</div>
  </main>
</section>
</div>

<script>
const FILES=[
  {folder:"polity",name:"EMERGENCY PROVISIONS .pdf",type:"pdf",title:"Emergency Provisions"},
  {folder:"polity",name:"Polity-Mindmap.pdf",type:"pdf",title:"Polity Mindmap"},
  {folder:"polity",name:"Path to British control of India.png",type:"png",title:"Path to British Control of India"},
  {folder:"polity",name:"Preamble.pdf",type:"pdf",title:"Preamble"},
  {folder:"polity",name:"CONSTITUENT ASSEMBLY.pdf",type:"pdf",title:"Constituent Assembly"},
  {folder:"polity",name:"Polity-1.pdf",type:"pdf",title:"Polity — Part 1"},
  {folder:"polity",name:"National_Symbols_WhatsApp_Final.pdf",type:"pdf",title:"National Symbols"},
  {folder:"polity",name:"fr fd dpsp.pdf",type:"pdf",title:"Fundamental Rights & DPSP"},
  {folder:"polity",name:"Emer_quizpolpity.pdf",type:"pdf",title:"Emergency Quiz — Polity"},
  {folder:"polity",name:"Indian Polity start.pdf",type:"pdf",title:"Indian Polity — Start"},
  {folder:"polity",name:"Citizenship of India.pdf",type:"pdf",title:"Citizenship of India"},
  {folder:"polity",name:"Fundamental Rights ( English).pdf",type:"pdf",title:"Fundamental Rights"},
  {folder:"art&culture",name:"Udaan Art and Culture.pdf",type:"pdf",title:"Udaan Art and Culture"},
  {folder:"art&culture",name:"Indian art avermi...gsg.pdf",type:"pdf",title:"Indian Art — Avermi GSG"},
  {folder:"art&culture",name:" SCHEME 2026 .pdf",type:"pdf",title:"SCHEME 2026"},
  {folder:"art&culture",name:"militry_ex.pdf",type:"pdf",title:"Military Exercises"},
  {folder:"art&culture",name:"Ramsar sites.pdf",type:"pdf",title:"Ramsar Sites"},
  {folder:"art&culture",name:"mind_gk.pdf",type:"pdf",title:"Mind GK"},
  {folder:"art&culture",name:"Military_Exercises.xlsx",type:"xlsx",title:"Military Exercises"},
  {folder:"Geo",name:"Geom.pdf",type:"pdf",title:"Geom"},
  {folder:"Geo",name:"plain2.pdf",type:"pdf",title:"Plain 2"},
  {folder:"Geo",name:"plains.pdf",type:"pdf",title:"Plains"},
  {folder:"Geo",name:"Geo_my.pdf",type:"pdf",title:"Geo My"},
  {folder:"Geo",name:"himalayas.pdf",type:"pdf",title:"Himalayas"},
  {folder:"Geo",name:"Drainage2.pdf",type:"pdf",title:"Drainage 2"},
  {folder:"Geo",name:"climatewindmcqs.pdf",type:"pdf",title:"Climate & Winds MCQs"},
  {folder:"Geo",name:"Geo_notes.pdf",type:"pdf",title:"Geography Notes"},
  {folder:"Geo",name:"Parmar-Geo.pdf",type:"pdf",title:"Parmar Geography"},
  {folder:"Geo",name:"universe.pdf",type:"pdf",title:"Universe"},
  {folder:"Geo",name:"transport.pdf",type:"pdf",title:"Transport"},
  {folder:"Geo",name:"himalayas2.pdf",type:"pdf",title:"Himalayas 2"},
  {folder:"Geo",name:"drainagesystem.pdf",type:"pdf",title:"Drainage System"},
  {folder:"Geo",name:"Atmo_PressueMCQ.pdf",type:"pdf",title:"Atmospheric Pressure MCQ"},
  {folder:"Geo",name:"Dams of India.pdf",type:"pdf",title:"Dams of India"},
  {folder:"Geo",name:"clouds_rainfall.pdf",type:"pdf",title:"Clouds & Rainfall"},
  {folder:"Geo",name:"Sambhav_Batch_SSC_CGL_Test (1).pdf",type:"pdf",title:"Sambhav Batch SSC CGL Test"},
  {folder:"Geo",name:"Sambhav_Batch_Geography_LatLon_EasyMod_MCQs.pdf",type:"pdf",title:"Sambhav Geography Lat-Lon Easy Mode MCQs"},
  {folder:"Geo",name:"istlong.pdf",type:"pdf",title:"IST Longitudes"},
  {folder:"Geo",name:"sambhav_geography_clouds_rainfall.pdf",type:"pdf",title:"Sambhav Geography — Clouds & Rainfall"},
  {folder:"Geo",name:"soilvegagric.pdf",type:"pdf",title:"Soil, Vegetation & Agriculture"},
  {folder:"others",name:"Calender (Class File) .pdf",type:"pdf",title:"Calendar — Class File"},
  {folder:"others",name:"Counting Figure.pdf",type:"pdf",title:"Counting Figure"},
  {folder:"others",name:"Calender class file.pdf",type:"pdf",title:"Calendar Class File"},
  {folder:"others",name:"Basics of English (Hand-written Notes_New-1 (1).pdf",type:"pdf",title:"Basics of English — Hand-written Notes"},
  {folder:"others",name:"100 imp. rules of grammar.pdf",type:"pdf",title:"100 Important Rules of Grammar"},
  {folder:"history",name:"vedic_period_notes.pdf",type:"pdf",title:"Vedic Period Notes"},
  {folder:"history",name:"Stone_Age_.pdf",type:"pdf",title:"Stone Age"},
  {folder:"history",name:"Vedic_Period___Later_vedic_Period.pdf",type:"pdf",title:"Vedic Period & Later Vedic Period"},
  {folder:"history",name:"Swachhand_IAS_Sambhav_Batch_50_MCQs.pdf",type:"pdf",title:"Swachhand IAS Sambhav Batch — 50 MCQs"},
  {folder:"history",name:"paraancient.pdf",type:"pdf",title:"Ancient History"},
  {folder:"history",name:"Sindhu_Saraswati_Civilization.pdf",type:"pdf",title:"Sindhu Saraswati Civilization"},
  {folder:"history",name:"saraswati_sindhu_notes.pdf",type:"pdf",title:"Saraswati Sindhu Notes"},
  {folder:"history",name:"MAURYAN EMPIRE.pdf",type:"pdf",title:"Mauryan Empire"},
  {folder:"history",name:"mind_his.pdf",type:"pdf",title:"Mind History"},
  {folder:"history",name:"HistoryNotes.pdf",type:"pdf",title:"History Notes"},
  {folder:"history",name:"VE BK.pdf",type:"pdf",title:"VE BK"}
];

const ICONS={
  ALL:"▦",polity:"🏛️","art&culture":"🎨",Geo:"🌍",history:"🏺",others:"📝"
};

const ORDER=["ALL","polity","art&culture","Geo","history","others"];
const LABELS={
 ALL:"All Files",polity:"Polity","art&culture":"Art & Culture",Geo:"Geography",
 history:"History",others:"Others"
};

let folder="ALL";
const nav=document.getElementById("nav");
const grid=document.getElementById("grid");
const search=document.getElementById("search");
const title=document.getElementById("title");
const crumb=document.getElementById("crumb");
const status=document.getElementById("status");
const empty=document.getElementById("empty");

const counts={ALL:FILES.length};
FILES.forEach(x=>counts[x.folder]=(counts[x.folder]||0)+1);
document.getElementById("total").textContent=FILES.length;

ORDER.forEach((key,i)=>{
  const b=document.createElement("button");
  b.innerHTML=`<span>${ICONS[key]}</span><span>${LABELS[key]}</span><span class="count">${counts[key]||0}</span>`;
  b.onclick=()=>{
    folder=key;
    document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    render();
  };
  nav.appendChild(b);
});
nav.firstElementChild.classList.add("active");

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function fileURL(x){
  return encodeURI(x.folder + "/" + x.name);
}

function render(){
  const q=search.value.toLowerCase().trim();
  const visible=FILES.filter(x=>
    (folder==="ALL"||x.folder===folder) &&
    (!q || `${x.title} ${x.name} ${x.folder}`.toLowerCase().includes(q))
  );

  grid.innerHTML="";
  visible.forEach(x=>{
    const card=document.createElement("article");
    card.className="card";
    const icon=x.type==="xlsx"?"📊":x.type==="png"?"🖼️":"📕";
    const label=x.type==="xlsx"?"Excel":x.type==="png"?"Image":"PDF";
    card.innerHTML=`
      <div class="top">
        <span class="icon">${icon}</span>
        <span class="tag">${LABELS[x.folder]} • ${label}</span>
      </div>
      <h3>${esc(x.title)}</h3>
      <div class="file" title="${esc(x.folder+"/"+x.name)}">${esc(x.name)}</div>
      <a class="open" href="${fileURL(x)}" target="_blank" rel="noopener">Open ${label} →</a>
    `;
    grid.appendChild(card);
  });

  title.textContent=folder==="ALL"?"All Files":LABELS[folder];
  crumb.textContent=folder==="ALL"?"All Files":LABELS[folder];
  status.textContent=`${visible.length} of ${FILES.length} files`;
  empty.style.display=visible.length?"none":"block";
}

search.addEventListener("input",render);

document.getElementById("back").onclick=()=>{
  folder="ALL";search.value="";
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  nav.firstElementChild.classList.add("active");render();
};
document.getElementById("forward").onclick=()=>search.focus();

render();
</script>
</body>
</html>
