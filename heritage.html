<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heritage Sites of India — Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E8E3D3;
    --card: #FBF8F0;
    --card-line: #D9D2BC;
    --ink: #1F2D50;
    --ink-soft: #3A4A72;
    --pen-red: #A33B2E;
    --brass: #93701F;
    --brass-light: #F1E4BE;
    --pass-green: #3F6644;
    --pass-green-bg: #E3ECDD;
    --fail-bg: #F3E0DC;
    --shadow: 0 1px 2px rgba(31,45,80,.06), 0 8px 24px rgba(31,45,80,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(31,45,80,.05) 27px 28px),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ===== Header / Admit Card strip ===== */
  .admit{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:20px 22px;
    display:flex;
    align-items:center;
    gap:18px;
    position:relative;
    overflow:hidden;
  }
  .admit::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:6px;
    background:repeating-linear-gradient(180deg, var(--brass) 0 10px, transparent 10px 20px);
  }
  .seal{
    width:64px;height:64px;border-radius:50%;
    border:2.5px solid var(--brass);
    display:grid;place-items:center;
    flex-shrink:0;
    position:relative;
    color:var(--brass);
    font-family:'Space Mono',monospace;
    font-weight:700;
  }
  .seal::before{
    content:"";
    position:absolute; inset:5px;
    border:1px dashed var(--brass);
    border-radius:50%;
  }
  .seal span{font-size:18px;}
  .admit-text{flex:1; min-width:0;}
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--brass); font-weight:700;
  }
  .title{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:22px; line-height:1.15; margin:4px 0 2px;
    letter-spacing:-.01em;
  }
  .subtitle{font-size:12.5px;color:var(--ink-soft);}
  .roll{
    font-family:'Space Mono',monospace; font-size:12px;
    background:var(--brass-light); color:var(--brass);
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }

  /* ===== Progress strip (OMR shading) ===== */
  .progress-row{display:flex; align-items:center; gap:10px; margin:16px 0 20px;}
  .progress-track{
    flex:1; height:14px; border-radius:3px;
    background:repeating-linear-gradient(90deg, var(--card) 0 3px, var(--card-line) 3px 4px);
    border:1px solid var(--card-line);
    overflow:hidden;
    display:flex;
  }
  .progress-fill{
    height:100%;
    background:repeating-linear-gradient(90deg, var(--ink) 0 3px, var(--ink-soft) 3px 4px);
    transition:width .35s ease;
  }
  .progress-label{font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-soft); white-space:nowrap;}

  /* ===== Question card ===== */
  .qcard{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:24px 22px 20px;
    position:relative;
  }
  .qmeta{
    font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--brass); font-weight:700; margin-bottom:10px;
  }
  .qtext{
    font-family:'Fraunces',serif; font-weight:600; font-size:19px; line-height:1.4;
    margin:0 0 20px; color:var(--ink);
  }
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex; align-items:center; gap:12px;
    background:#fff; border:1.5px solid var(--card-line);
    border-radius:8px; padding:11px 14px;
    cursor:pointer; font-size:14.5px; color:var(--ink);
    text-align:left; font-family:'Inter',sans-serif;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .opt:hover:not(:disabled){border-color:var(--ink-soft); background:#fdfcf8;}
  .opt:focus-visible{outline:2.5px solid var(--ink); outline-offset:2px;}
  .opt:active:not(:disabled){transform:scale(.995);}
  .bubble{
    width:26px; height:26px; border-radius:50%;
    border:2px solid var(--ink); flex-shrink:0;
    position:relative; display:grid; place-items:center;
    font-family:'Space Mono',monospace; font-size:12px; font-weight:700; color:var(--ink);
  }
  .bubble svg{position:absolute; inset:-2px; width:30px; height:30px;}
  .bubble svg path{
    fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round;
    stroke-dasharray:340; stroke-dashoffset:340;
  }
  .opt.selected .bubble svg path{animation:scribble .38s ease forwards;}
  .opt.selected .bubble span{opacity:0;}
  @keyframes scribble{ to{stroke-dashoffset:0;} }

  .opt.correct{border-color:var(--pass-green); background:var(--pass-green-bg);}
  .opt.correct .bubble, .opt.correct .bubble svg path{border-color:var(--pass-green); stroke:var(--pass-green); color:var(--pass-green);}
  .opt.incorrect{border-color:var(--pen-red); background:var(--fail-bg);}
  .opt.incorrect .bubble, .opt.incorrect .bubble svg path{border-color:var(--pen-red); stroke:var(--pen-red); color:var(--pen-red);}
  .opt:disabled{cursor:default;}
  .opt:disabled:not(.selected):not(.correct){opacity:.55;}

  .stamp{
    position:absolute; top:18px; right:20px;
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    letter-spacing:.06em; padding:5px 12px; border-radius:4px;
    border:2px solid; transform:rotate(-6deg) scale(0);
    animation:stampIn .28s cubic-bezier(.2,1.4,.5,1) forwards;
  }
  .stamp.pass{color:var(--pass-green); border-color:var(--pass-green);}
  .stamp.fail{color:var(--pen-red); border-color:var(--pen-red);}
  @keyframes stampIn{ to{transform:rotate(-6deg) scale(1);} }

  .explain{
    margin-top:16px; padding-top:14px; border-top:1px dashed var(--card-line);
    font-size:13px; color:var(--ink-soft); line-height:1.5;
  }
  .explain b{color:var(--ink);}

  .nextbar{display:flex; justify-content:flex-end; margin-top:18px;}
  .btn{
    font-family:'Space Mono',monospace; font-weight:700; font-size:13px;
    letter-spacing:.04em; text-transform:uppercase;
    background:var(--ink); color:#fff; border:none;
    padding:11px 22px; border-radius:5px; cursor:pointer;
    transition:background .15s, transform .1s;
  }
  .btn:hover{background:var(--ink-soft);}
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2.5px solid var(--brass); outline-offset:2px;}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink);}
  .btn.ghost:hover{background:var(--card-line);}

  /* ===== Result / Marksheet ===== */
  .marksheet{
    background:var(--card); border:1px solid var(--card-line); border-radius:6px;
    box-shadow:var(--shadow); padding:26px 24px; position:relative; overflow:hidden;
  }
  .marksheet::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:6px;
    background:repeating-linear-gradient(180deg, var(--brass) 0 10px, transparent 10px 20px);
  }
  .ms-head{text-align:center; margin-bottom:18px;}
  .ms-eyebrow{font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em; color:var(--brass); text-transform:uppercase; font-weight:700;}
  .ms-title{font-family:'Fraunces',serif; font-weight:700; font-size:26px; margin:6px 0 2px;}
  .score-ring-row{display:flex; justify-content:center; margin:18px 0;}
  .score-big{
    font-family:'Fraunces',serif; font-weight:700; font-size:52px; line-height:1;
    color:var(--ink);
  }
  .score-big span{font-size:22px; color:var(--ink-soft); font-family:'Space Mono',monospace; font-weight:400;}
  .grade{
    text-align:center; font-family:'Space Mono',monospace; font-weight:700;
    font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    padding:6px 16px; border-radius:20px; display:inline-block; margin:0 auto 6px;
  }
  .grade-wrap{text-align:center; margin-bottom:20px;}

  .catgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:20px 0;}
  .catbox{background:#fff; border:1px solid var(--card-line); border-radius:6px; padding:12px 14px;}
  .catbox .n{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--brass); font-weight:700;}
  .catbox .v{font-family:'Fraunces',serif; font-size:20px; font-weight:600; margin-top:2px;}

  .review{margin-top:22px;}
  .review h3{font-family:'Fraunces',serif; font-size:16px; margin:0 0 12px;}
  .review-item{
    border-left:3px solid var(--pen-red); background:#fff; border-radius:0 6px 6px 0;
    padding:10px 14px; margin-bottom:10px; font-size:13px; line-height:1.5;
  }
  .review-item .rq{font-weight:600; margin-bottom:4px;}
  .review-item .ra{color:var(--ink-soft);}
  .review-item .ra b{color:var(--pass-green);}
  .review-item .ra .wrong{color:var(--pen-red); text-decoration:line-through;}

  .actions{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;}

  footer{text-align:center; margin-top:26px; font-size:11px; color:var(--ink-soft); font-family:'Space Mono',monospace;}

  @media (max-width:480px){
    .catgrid{grid-template-columns:1fr 1fr;}
    .title{font-size:19px;}
    .qtext{font-size:17px;}
    .score-big{font-size:42px;}
  }
</style>
</head>

,"Fatehpur Sikri","Maratha Military Landscapes","Santiniketan"],"correct":2,"explain":"Maratha Military Landscapes — Maharashtra & TN, inscribed 2025","cat":"Identify"},{"q":"In which year was \"Churches and Convents of Goa\" inscribed as a UNESCO World Heritage Site?","options":["2024","2012","1986","1983"],"correct":2,"explain":"Churches and Convents of Goa (Goa) — Portuguese Manueline architecture","cat":"Year"},{"q":"\"Red Fort Complex\" is classified under which category?","options":["Cultural","Natural","Mixed"],"correct":0,"explain":"Delhi, 2007 — Shah Jahan's palace fort","cat":"Type"}];
const SET_SIZE = 200;
let questions = [];
let idx = 0;
let score = 0;
let answered = false;
let wrongLog = [];
let catStats = {};

function shuffle(a){
  const arr = [...a];
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function rollNumber(){
  const n = Math.floor(1000 + Math.random()*9000);
  return 'HRT-' + n + '-' + new Date().getFullYear();
}

function startQuiz(){
  questions = shuffle(BANK).slice(0, SET_SIZE);
  idx = 0; score = 0; answered = false; wrongLog = [];
  catStats = {};
  document.getElementById('rollNo').textContent = 'ROLL ' + rollNumber();
  document.getElementById('resultArea').innerHTML = '';
  document.getElementById('sealNum').textContent = SET_SIZE;
  renderQuestion();
}

function updateProgress(){
  const pct = (idx / questions.length) * 100;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = idx + ' / ' + questions.length;
}

function renderQuestion(){
  answered = false;
  updateProgress();
  const q = questions[idx];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="qcard" id="qcard">
      <div class="qmeta">Question ${idx+1} of ${questions.length} &nbsp;·&nbsp; ${q.cat}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="optsWrap">
        ${q.options.map((o,i)=>`
          <button class="opt" data-i="${i}">
            <span class="bubble">
              <svg viewBox="0 0 30 30"><path d="M6 15 Q 15 26, 24 6"/></svg>
              <span>${String.fromCharCode(65+i)}</span>
            </span>
            <span>${o}</span>
          </button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', () => selectOption(btn, q));
  });
}

function selectOption(btn, q){
  if(answered) return;
  answered = true;
  const chosen = parseInt(btn.dataset.i, 10);
  const isCorrect = chosen === q.correct;
  catStats[q.cat] = catStats[q.cat] || {correct:0,total:0};
  catStats[q.cat].total++;
  if(isCorrect){ score++; catStats[q.cat].correct++; }
  else { wrongLog.push({q:q.q, chosen:q.options[chosen], correct:q.options[q.correct]}); }

  document.querySelectorAll('.opt').forEach((b)=>{
    const i = parseInt(b.dataset.i,10);
    b.disabled = true;
    if(i === q.correct) b.classList.add('correct');
    if(i === chosen){
      b.classList.add('selected');
      if(!isCorrect) b.classList.add('incorrect');
    }
  });

  const qcard = document.getElementById('qcard');
  const stamp = document.createElement('div');
  stamp.className = 'stamp ' + (isCorrect ? 'pass':'fail');
  stamp.textContent = isCorrect ? '✓ CORRECT' : '✕ INCORRECT';
  qcard.appendChild(stamp);

  const explain = document.createElement('div');
  explain.className = 'explain';
  explain.innerHTML = `<b>Note:</b> ${q.explain}`;
  qcard.appendChild(explain);

  const nextbar = document.createElement('div');
  nextbar.className = 'nextbar';
  const btnNext = document.createElement('button');
  btnNext.className = 'btn';
  btnNext.textContent = (idx === questions.length-1) ? 'See Result' : 'Next Question';
  btnNext.addEventListener('click', () => {
    idx++;
    if(idx >= questions.length){ showResult(); }
    else { renderQuestion(); }
  });
  nextbar.appendChild(btnNext);
  qcard.appendChild(nextbar);
}

function gradeFor(pct){
  if(pct >= 90) return {label:'Outstanding', cls:'pass'};
  if(pct >= 70) return {label:'Very Good', cls:'pass'};
  if(pct >= 50) return {label:'Fair — Revise Key Facts', cls:'fail'};
  return {label:'Needs Revision', cls:'fail'};
}

function showResult(){
  updateProgress();
  document.getElementById('quizArea').innerHTML = '';
  const pct = Math.round((score/questions.length)*100);
  const grade = gradeFor(pct);
  const catHtml = Object.entries(catStats).map(([cat,s])=>`
    <div class="catbox">
      <div class="n">${cat}</div>
      <div class="v">${s.correct}/${s.total}</div>
    </div>`).join('');
  const reviewHtml = wrongLog.length ? `
    <div class="review">
      <h3>Review — ${wrongLog.length} to revisit</h3>
      ${wrongLog.map(w=>`
        <div class="review-item">
          <div class="rq">${w.q}</div>
          <div class="ra">Your answer: <span class="wrong">${w.chosen}</span> &nbsp;·&nbsp; Correct: <b>${w.correct}</b></div>
        </div>`).join('')}
    </div>` : `<div class="review"><h3>Perfect score — no corrections needed.</h3></div>`;

  document.getElementById('resultArea').innerHTML = `
    <div class="marksheet">
      <div class="ms-head">
        <div class="ms-eyebrow">Result · Marksheet</div>
        <div class="ms-title">Test Complete</div>
      </div>
      <div class="score-ring-row">
        <div class="score-big">${score}<span>/${questions.length}</span></div>
      </div>
      <div class="grade-wrap">
        <span class="grade" style="color:var(--${grade.cls==='pass'?'pass-green':'pen-red'}); border:1.5px solid var(--${grade.cls==='pass'?'pass-green':'pen-red'});">
          ${grade.label} · ${pct}%
        </span>
      </div>
      <div class="catgrid">${catHtml}</div>
      ${reviewHtml}
      <div class="actions">
        <button class="btn" id="retakeBtn">Retake Test (${BANK.length} Qs, reshuffled)</button>
      </div>
    </div>
  `;
  document.getElementById('retakeBtn').addEventListener('click', startQuiz);
}

startQuiz();
</script>
