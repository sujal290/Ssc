<script>
const Q=[
{n:1,q:["Find the distance between the points (7, 5) and (4, 1).","बिंदु (7, 5) और (4, 1) के बीच की दूरी ज्ञात कीजिए।"],o:["4","5","6","7"],a:1,s:["Distance = √[(7−4)² + (5−1)²] = √(9 + 16) = √25 = <b>5</b>","दूरी = √[(7−4)² + (5−1)²] = √(9 + 16) = √25 = <b>5</b>"]},
{n:2,q:["A regular hexagon is inscribed in a circle of radius 21 cm. Find the area of the hexagon.","एक वृत्त में षट्भुज (regular hexagon) बना है। वृत्त की त्रिज्या 21 cm है, तो षट्भुज का क्षेत्रफल = ?"],o:["441√3 cm²","661.5√3 cm²","882√3 cm²","220.5√3 cm²"],a:1,s:["Side of a hexagon inscribed in a circle = radius = 21 cm<br>Area = (3√3/2) × a² = (3√3/2) × 441 = <b>661.5√3 cm²</b> (≈ 1145.8 cm²)","वृत्त में बने षट्भुज की भुजा = त्रिज्या = 21 cm<br>क्षेत्रफल = (3√3/2) × a² = (3√3/2) × 441 = <b>661.5√3 cm²</b> (≈ 1145.8 cm²)"]},
{n:3,q:["The radii of two circles are 3 cm and 5 cm. The direct common tangent (DCT) is twice the length of the transverse common tangent (TCT). Find d² (d = distance between the centres).","दो वृत्तों की त्रिज्या 3 cm और 5 cm है। Direct common tangent (DCT) की लंबाई, transverse common tangent (TCT) की 2 गुना है। तो d² = ? (d = केंद्रों के बीच की दूरी)"],o:["64","72","84","100"],a:2,s:["DCT² = d² − (r₁−r₂)² = d² − 4<br>TCT² = d² − (r₁+r₂)² = d² − 64<br>DCT = 2·TCT ⇒ d² − 4 = 4(d² − 64)<br>3d² = 252 ⇒ d² = <b>84</b>","DCT² = d² − (r₁−r₂)² = d² − 4<br>TCT² = d² − (r₁+r₂)² = d² − 64<br>DCT = 2·TCT ⇒ d² − 4 = 4(d² − 64)<br>3d² = 252 ⇒ d² = <b>84</b>"]},
{n:4,q:["If x + 1/x = 3√2, find the value of x/(x² − 1).","यदि x + 1/x = 3√2 हो, तो x/(x² − 1) का मान = ?"],o:["1/√14","1/√18","√14","1/√7"],a:0,s:["x/(x²−1) = 1/(x − 1/x)<br>(x − 1/x)² = (x + 1/x)² − 4 = 18 − 4 = 14 ⇒ x − 1/x = √14<br>Value = <b>1/√14</b>","x/(x²−1) = 1/(x − 1/x)<br>(x − 1/x)² = (x + 1/x)² − 4 = 18 − 4 = 14 ⇒ x − 1/x = √14<br>अतः मान = <b>1/√14</b>"]},
{n:5,q:["If tanθ + cotθ = 2, find cot⁴θ + tan⁴θ.","यदि tanθ + cotθ = 2 हो, तो cot⁴θ + tan⁴θ = ?"],o:["1","2","4","0"],a:1,s:["tanθ + 1/tanθ = 2 ⇒ tanθ = 1 (θ = 45°)<br>cot⁴θ + tan⁴θ = 1 + 1 = <b>2</b>","tanθ + 1/tanθ = 2 ⇒ tanθ = 1 (θ = 45°)<br>cot⁴θ + tan⁴θ = 1 + 1 = <b>2</b>"]},
{n:6,q:["If sinθ + cosθ = 5/4, find tanθ + cotθ.","यदि sinθ + cosθ = 5/4 हो, तो tanθ + cotθ = ?"],o:["9/32","32/9","16/5","5/4"],a:1,s:["Squaring: 1 + 2sinθcosθ = 25/16 ⇒ sinθcosθ = 9/32<br>tanθ + cotθ = 1/(sinθ·cosθ) = <b>32/9</b>","दोनों तरफ वर्ग: 1 + 2sinθcosθ = 25/16 ⇒ sinθcosθ = 9/32<br>tanθ + cotθ = 1/(sinθ·cosθ) = <b>32/9</b>"]},
{n:7,q:["If x = 3 and y = 2, find the value of (x³ − y³)/(x² + y² + xy) + (x³ + y³)/(x² − xy + y²).","यदि x = 3, y = 2 हो, तो (x³ − y³)/(x² + y² + xy) + (x³ + y³)/(x² − xy + y²) का मान = ?"],o:["5","6","7","1"],a:1,s:["(x³−y³)/(x²+xy+y²) = x − y = 1<br>(x³+y³)/(x²−xy+y²) = x + y = 5<br>Sum = 1 + 5 = <b>6</b>","(x³−y³)/(x²+xy+y²) = x − y = 1<br>(x³+y³)/(x²−xy+y²) = x + y = 5<br>योग = 1 + 5 = <b>6</b>"]},
{n:8,q:["(x + 2)² − (x − 2)² = ?","(x + 2)² − (x − 2)² = ?"],o:["4x","8x","16x","8"],a:1,s:["a² − b² = (a+b)(a−b)<br>= (x+2+x−2)(x+2−x+2) = (2x)(4) = <b>8x</b><br>(or use (a+b)² − (a−b)² = 4ab = 4·x·2 = 8x)","a² − b² = (a+b)(a−b)<br>= (x+2+x−2)(x+2−x+2) = (2x)(4) = <b>8x</b><br>(या सूत्र: (a+b)² − (a−b)² = 4ab = 4·x·2 = 8x)"]},
{n:9,q:["In triangle ABC, D and E lie on AB and AC respectively such that DE ∥ BC. If AD = 3 cm, DB = 2 cm and DE = 4 cm, find BC.","त्रिभुज ABC में भुजा AB और AC पर क्रमशः D और E बिंदु इस प्रकार हैं कि DE ∥ BC है। यदि AD = 3 cm, DB = 2 cm और DE = 4 cm हो, तो BC = ?"],o:["6 cm","20/3 cm","7 cm","8 cm"],a:1,s:["DE ∥ BC ⇒ △ADE ~ △ABC<br>AB = AD + DB = 5<br>DE/BC = AD/AB ⇒ 4/BC = 3/5 ⇒ BC = <b>20/3 cm</b> (≈ 6.67 cm)","DE ∥ BC ⇒ △ADE ~ △ABC<br>AB = AD + DB = 5<br>DE/BC = AD/AB ⇒ 4/BC = 3/5 ⇒ BC = <b>20/3 cm</b> (≈ 6.67 cm)"]},
{n:10,q:["A tangent QT is drawn from point Q to a circle with centre O (T is the point of contact). If OT = 6 cm and OQ = 10 cm, find the area of △OQT.","एक वृत्त पर बिंदु Q से स्पर्श रेखा QT खींची जाती है (T स्पर्श बिंदु)। यदि OT = 6 cm और OQ = 10 cm हो, तो △OQT का क्षेत्रफल = ?"],o:["20 cm²","24 cm²","30 cm²","48 cm²"],a:1,s:["OT ⊥ QT (radius ⊥ tangent)<br>QT = √(OQ² − OT²) = √(100 − 36) = 8<br>Area = ½ × 6 × 8 = <b>24 cm²</b>","OT ⊥ QT (त्रिज्या ⊥ स्पर्श रेखा)<br>QT = √(OQ² − OT²) = √(100 − 36) = 8<br>क्षेत्रफल = ½ × 6 × 8 = <b>24 cm²</b>"]},
{n:11,q:["The base of a pyramid is a rectangle of 8 × 6. Its height is 1.5 times the longer side of the base. Find the volume of the pyramid.","एक पिरामिड का आधार 8 × 6 का आयत है। पिरामिड की ऊँचाई, आधार की लंबी भुजा की 1.5 गुना है। पिरामिड का आयतन = ?"],o:["96 cm³","144 cm³","192 cm³","288 cm³"],a:2,s:["Height = 1.5 × 8 = 12<br>Volume = ⅓ × (base area) × h = ⅓ × 48 × 12 = <b>192 cm³</b>","ऊँचाई = 1.5 × 8 = 12<br>आयतन = ⅓ × (आधार क्षेत्रफल) × h = ⅓ × 48 × 12 = <b>192 cm³</b>"]},
{n:12,q:["Two circles have radii 15 cm and 20 cm. The arcs subtend angles of 60° and 45° at their centres respectively. Find the ratio of the lengths of the arcs.","दो वृत्तों की त्रिज्याएँ 15 cm और 20 cm हैं। उनके चापों द्वारा केंद्र पर बने कोण क्रमशः 60° और 45° हैं। चापों की लंबाई का अनुपात = ?"],o:["1 : 1","3 : 4","4 : 3","2 : 3"],a:0,s:["Arc = (θ/360) × 2πr<br>First = (60/360) × 2π × 15 = 5π<br>Second = (45/360) × 2π × 20 = 5π<br>Ratio = <b>1 : 1</b>","चाप = (θ/360) × 2πr<br>पहला = (60/360) × 2π × 15 = 5π<br>दूसरा = (45/360) × 2π × 20 = 5π<br>अनुपात = <b>1 : 1</b>"]},
{n:13,q:["If √2 = 1.414, find the value of (4 + √2)/√2.","यदि √2 = 1.414 हो, तो (4 + √2)/√2 का मान = ?"],o:["3.414","3.828","4.414","5.656"],a:1,s:["(4 + √2)/√2 = 4/√2 + 1 = 2√2 + 1<br>= 2(1.414) + 1 = 2.828 + 1 = <b>3.828</b>","(4 + √2)/√2 = 4/√2 + 1 = 2√2 + 1<br>= 2(1.414) + 1 = 2.828 + 1 = <b>3.828</b>"]},
{n:15,q:["Two equal parallel chords lie on opposite sides of the centre of a circle, 22 cm apart. If the radius is 61 cm, find the length of each chord.","एक वृत्त में केंद्र के दोनों ओर (opposite sides) दो समान्तर और बराबर जीवाएँ हैं, जिनके बीच की दूरी 22 cm है। वृत्त की त्रिज्या 61 cm है, तो जीवा की लंबाई = ?"],o:["110 cm","120 cm","122 cm","60 cm"],a:1,s:["Chords are equal ⇒ each is 22/2 = 11 cm from the centre<br>Half chord = √(61² − 11²) = √(3721 − 121) = √3600 = 60<br>Chord = 2 × 60 = <b>120 cm</b>","जीवाएँ बराबर हैं ⇒ केंद्र से प्रत्येक की दूरी = 22/2 = 11 cm<br>आधी जीवा = √(61² − 11²) = √(3721 − 121) = √3600 = 60<br>जीवा = 2 × 60 = <b>120 cm</b>"]},
{n:16,q:["A 90-litre mixture has milk and water in the ratio 8 : 7. Some mixture is removed and replaced with an equal amount of pure water so that the ratio becomes 4 : 5. How much water was added?","90 लीटर मिश्रण में दूध : पानी = 8 : 7 है। उसमें से कुछ मिश्रण निकालकर उतना ही शुद्ध पानी मिलाया जाता है ताकि अनुपात 4 : 5 हो जाए। कितना पानी मिलाया?"],o:["12 L","15 L","18 L","20 L"],a:1,s:["Milk = 90 × 8/15 = 48 L, water = 42 L<br>Total stays 90 L, ratio 4:5 ⇒ milk = 90 × 4/9 = 40 L<br>Milk lost = 48 − 40 = 8 L, which is 8/15 of the removed mixture<br>Mixture removed = 8 × 15/8 = 15 L<br>Water added = <b>15 L</b>","दूध = 90 × 8/15 = 48 L, पानी = 42 L<br>अंत में कुल 90 L और अनुपात 4:5 ⇒ दूध = 90 × 4/9 = 40 L<br>दूध घटा = 48 − 40 = 8 L, जो मिश्रण का 8/15 भाग है<br>निकाला गया मिश्रण = 8 × 15/8 = 15 L<br>अतः मिलाया गया पानी = <b>15 L</b>"]},
{n:17,q:["Two articles are each sold for ₹990. One is sold at a 10% profit and the other at a 10% loss. Find the overall profit or loss percentage.","दो वस्तुएँ प्रत्येक ₹990 में बेची जाती हैं। एक पर 10% लाभ और दूसरी पर 10% हानि होती है। कुल लाभ/हानि % = ?"],o:[["1% loss","1% हानि"],["1% profit","1% लाभ"],["2% loss","2% हानि"],["No profit, no loss","न लाभ न हानि"]],a:0,s:["CP of first = 990 × 100/110 = 900<br>CP of second = 990 × 100/90 = 1100<br>Total CP = 2000, total SP = 1980<br>Loss = 20 ⇒ loss% = 20/2000 × 100 = <b>1% loss</b><br>(Shortcut: equal profit and loss % on the same SP ⇒ loss = (10/10)² = 1%)","पहली का CP = 990 × 100/110 = 900<br>दूसरी का CP = 990 × 100/90 = 1100<br>कुल CP = 2000, कुल SP = 1980<br>हानि = 20 ⇒ हानि% = 20/2000 × 100 = <b>1% हानि</b><br>(shortcut: समान % लाभ-हानि पर हानि = (10/10)² = 1%)"]},
{n:18,q:["The diameter of a circle is 28 cm. Find its area.","एक वृत्त का व्यास 28 cm है। उसका क्षेत्रफल = ?"],o:["308 cm²","616 cm²","1232 cm²","154 cm²"],a:1,s:["r = 28/2 = 14<br>Area = πr² = (22/7) × 14 × 14 = <b>616 cm²</b>","r = 28/2 = 14<br>क्षेत्रफल = πr² = (22/7) × 14 × 14 = <b>616 cm²</b>"]},
{n:19,q:["A and B invest ₹12000 and ₹20000 respectively for one year. A gets an extra 10% of the total profit. If the total profit is ₹9600, find A's profit.","A और B क्रमशः ₹12000 और ₹20000 एक वर्ष के लिए लगाते हैं। A को कुल लाभ का अतिरिक्त 10% मिलता है। यदि कुल लाभ ₹9600 हो, तो A का लाभ = ?"],o:["₹3240","₹4200","₹5400","₹4800"],a:1,s:["A's extra = 10% of 9600 = 960<br>Remaining profit = 9600 − 960 = 8640, shared in the ratio 12000 : 20000 = 3 : 5<br>A's share = 8640 × 3/8 = 3240<br>A's total profit = 960 + 3240 = <b>₹4200</b>","A का अतिरिक्त = 10% × 9600 = 960<br>शेष लाभ = 9600 − 960 = 8640, अनुपात 12000 : 20000 = 3 : 5<br>A का हिस्सा = 8640 × 3/8 = 3240<br>A का कुल लाभ = 960 + 3240 = <b>₹4200</b>"]},
{n:20,q:["The marked price is ₹80000. Three successive discounts of 15%, 20% and 10% are given. Find the selling price.","अंकित मूल्य ₹80000 पर 15%, 20% और 10% की तीन क्रमिक छूट दी जाती है। विक्रय मूल्य (SP) = ?"],o:["₹48960","₹49600","₹50400","₹51200"],a:0,s:["SP = 80000 × (85/100) × (80/100) × (90/100)<br>= 80000 × 0.85 × 0.8 × 0.9 = <b>₹48960</b>","SP = 80000 × (85/100) × (80/100) × (90/100)<br>= 80000 × 0.85 × 0.8 × 0.9 = <b>₹48960</b>"]},
{n:21,q:["A sum of money becomes ₹875 in 3 years and ₹950 in 4 years at simple interest. Find the principal.","कोई राशि साधारण ब्याज पर 3 वर्ष में ₹875 और 4 वर्ष में ₹950 हो जाती है। मूलधन = ?"],o:["₹600","₹650","₹700","₹725"],a:1,s:["SI for 1 year = 950 − 875 = 75<br>SI for 3 years = 225<br>Principal = 875 − 225 = <b>₹650</b>","1 वर्ष का SI = 950 − 875 = 75<br>3 वर्ष का SI = 225<br>मूलधन = 875 − 225 = <b>₹650</b>"]},
{n:22,q:["The slant height of a cone is 10 cm and its height is 8 cm. Find its volume.","एक शंकु की तिर्यक ऊँचाई 10 cm और ऊँचाई 8 cm है। शंकु का आयतन = ?"],o:["96π cm³","128π cm³","288π cm³","48π cm³"],a:0,s:["r = √(l² − h²) = √(100 − 64) = 6<br>Volume = ⅓πr²h = ⅓ × π × 36 × 8 = <b>96π cm³</b> (≈ 301.7 cm³)","r = √(l² − h²) = √(100 − 64) = 6<br>आयतन = ⅓πr²h = ⅓ × π × 36 × 8 = <b>96π cm³</b> (≈ 301.7 cm³)"]}
];
const U={
tgh:["Join Our Telegram Channel","हमारे टेलीग्राम चैनल से जुड़ें"],tgp:["Get daily SSC shift papers, compilations and updates.","रोज़ाना SSC शिफ्ट पेपर, कम्पाइलेशन और अपडेट पाएं।"],
join:["Join Telegram Channel","टेलीग्राम चैनल जॉइन करें"],skip:["Skip for now","अभी छोड़ें"],maths:["MATHS","गणित"],
hh3:["30 SEP • Maths Questions","30 SEP • गणित प्रश्न"],qs:["QUESTIONS","प्रश्न"],nt:["NO TIMER","कोई टाइमर नहीं"],sl:["SOLUTIONS","हल"],
start:["🚀 Start Quiz","🚀 क्विज़ शुरू करें"],rst:["Reset","रीसेट"],sub:["Submit Quiz","सबमिट करें"],tt:["Take your time 🙂","आराम से हल करें 🙂"]};
const L_=["L","L"];let L=0,ans=Array(Q.length).fill(-1),done=false;
const A=["A","B","C","D"],t=x=>typeof x==="string"?x:x[L];
const quiz=document.getElementById("quiz");
function txt(){document.querySelectorAll("[data-k]").forEach(e=>e.textContent=U[e.dataset.k][L]);document.getElementById("tot").textContent=Q.length;document.getElementById("lang").textContent=L?"English":"हिंदी";document.documentElement.lang=L?"hi":"en";}
function render(){
 quiz.innerHTML=Q.map((x,i)=>{
  const st=ans[i]<0?["⚪ Skipped","⚪ छोड़ा"]:ans[i]===x.a?["✅ Correct","✅ सही"]:["❌ Wrong","❌ गलत"];
  const opts=x.o.map((o,j)=>{let c="opt";if(done){if(j===x.a)c+=" ok";else if(j===ans[i])c+=" bad";}else if(j===ans[i])c+=" sel";
   return `<div class="${c}" data-i="${i}" data-j="${j}"><b>${A[j]}</b><span>${t(o)}</span></div>`}).join("");
  const sol=done?`<div class="sol${ans[i]>=0&&ans[i]!==x.a?" w":""}"><strong>${st[L]} — ${L?"सही उत्तर":"Correct Answer"}: ${A[x.a]}) ${t(x.o[x.a])}</strong>${x.s[L]}</div>`:"";
  return `<div class="q${done?" locked":""}" id="q${i}"><h3><span>Q${x.n}.</span>${x.q[L]}</h3>${opts}${sol}</div>`}).join("");
 upd();if(done)showRes();
}
function upd(){const n=ans.filter(v=>v>=0).length;document.getElementById("cnt").textContent=n+" / "+Q.length+(L?" हल किए":" attempted");document.getElementById("pb").style.width=(n/Q.length*100)+"%";}
function showRes(){
 let c=0,w=0,s=0;Q.forEach((x,i)=>{if(ans[i]<0)s++;else if(ans[i]===x.a)c++;else w++;});
 const pct=Math.round(c/Q.length*100);
 const ms=pct>=80?["🔥 Excellent!","🔥 ज़बरदस्त!"]:pct>=50?["👍 Good attempt!","👍 अच्छा प्रयास!"]:["💪 Keep practising!","💪 और अभ्यास करो!"];
 const r=document.getElementById("res");r.style.display="block";
 r.innerHTML=`<div class="msg">${ms[L]}</div><div class="ring" style="--p:${pct}"><div><b>${c}/${Q.length}</b><small>${pct}%</small></div></div><div class="st"><span>✅ ${c} ${L?"सही":"Correct"}</span><span>❌ ${w} ${L?"गलत":"Wrong"}</span><span>⚪ ${s} ${L?"छोड़े":"Skipped"}</span></div>`;
}
quiz.addEventListener("click",e=>{
 if(done)return;const o=e.target.closest(".opt");if(!o)return;
 const i=+o.dataset.i,j=+o.dataset.j;ans[i]=j;
 document.querySelectorAll("#q"+i+" .opt").forEach(el=>el.classList.toggle("sel",+el.dataset.j===j));upd();
});
document.getElementById("sub").onclick=()=>{
 if(done)return;const un=ans.filter(v=>v<0).length;
 if(un&&!confirm(L?un+" प्रश्न छूटे हैं। फिर भी सबमिट करें?":un+" question(s) unattempted. Submit anyway?"))return;
 done=true;render();window.scrollTo({top:0,behavior:"smooth"});
};
document.getElementById("rst").onclick=()=>{ans=Array(Q.length).fill(-1);done=false;document.getElementById("res").style.display="none";render();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("lang").onclick=()=>{L=1-L;txt();render();};
const go=(a,b)=>{document.getElementById(a).classList.add("hide");document.getElementById(b).classList.remove("hide");window.scrollTo(0,0);};
const closeTg=()=>{document.getElementById("tg").classList.add("hide");document.getElementById("home").classList.remove("hide");};
document.getElementById("skip").onclick=closeTg;
document.getElementById("jn").onclick=()=>setTimeout(closeTg,400);
document.getElementById("start").onclick=()=>{go("home","app");document.getElementById("btns").classList.remove("hide");};
txt();render();
</script>
