function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){
 let out="";
 sections.forEach((sec,si)=>{
   out+=`<section class="section"><h2>${sec[0]} <span class="badge">${sec[1].length} entries</span></h2><div class="table-wrap"><table><thead><tr><th>📖 Book / Work</th><th>✍️ Author</th><th>🕐 Time Period</th><th>🧠 Why / Context</th><th>🎯 SSC Fact / Trap</th></tr></thead><tbody>`;
   sec[1].forEach((r,i)=>out+=`<tr class="bookrow"><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`);
   out+=`</tbody></table></div></section>`;
 });
 out+=`<section class="section"><h2>🔥 SSC CGL — HIGH-YIELD TRAPS & MUST-MEMORISE PAIRS</h2><div class="table-wrap"><table><thead><tr><th>#</th><th>📖 Work</th><th>✍️ Author</th><th>🎯 Key hook / trap</th></tr></thead><tbody>`;
 traps.forEach((r,i)=>out+=`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`);
 out+=`</tbody></table></div></section>`;
 out+=`<section class="section"><h2>⚠️ Accuracy Notes</h2><div class="traps"><ul><li>Prithviraj Raso is traditionally attributed to Chand Bardai and is semi-legendary; it is not an uncomplicated contemporary source.</li><li>Kavirajamarga is traditionally associated with Amoghavarsha I; court-poet attribution is also discussed.</li><li>Guru Arjan compiled the Adi Granth; the later scripture tradition was completed under Guru Gobind Singh.</li><li>Padshahnama exists in versions associated with Abdul Hamid Lahori and Muhammad Amin Qazvini.</li><li><b>An Era of Darkness</b> is the standard title of Shashi Tharoor's 2016 book.</li></ul></div></section>`;
 document.getElementById("content").innerHTML=out;
}
function filterRows(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 document.querySelectorAll(".bookrow").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none");
}
function clearSearch(){document.getElementById("search").value="";filterRows()}
