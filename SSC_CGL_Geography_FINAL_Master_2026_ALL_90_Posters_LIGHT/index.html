let idx=0,scale=1,x=0,y=0;
let drag=false,sx=0,sy=0,ox=0,oy=0;
let pointerMoved=false;
let pinchStart=0,pinchScale=1,pinchX=0,pinchY=0;
let lastTap=0;

const img=document.getElementById('viewer');
const stage=document.getElementById('stage');
const main=document.getElementById('main');
const overlay=document.getElementById('overlay');
const sidebar=document.getElementById('sidebar');
const count=document.getElementById('count');

function renderSidebar(filter=''){
  sidebar.innerHTML='';
  posters.forEach((p,i)=>{
    if(filter && !((String(p.n)).includes(filter)||p.title.toLowerCase().includes(filter.toLowerCase()))) return;
    const b=document.createElement('button');
    b.className='thumb'+(i===idx?' active':'');
    b.innerHTML=`<img loading="lazy" src="${p.src}"><span><b>${String(p.n).padStart(2,'0')}</b> — ${p.title}</span>`;
    b.onclick=()=>show(i);
    sidebar.appendChild(b);
  });
}

function show(i){
  idx=(i+posters.length)%posters.length;
  img.onload=()=>requestAnimationFrame(()=>fit());
  img.src=posters[idx].src;
  renderSidebar(document.getElementById('search').value.trim());
  overlay.textContent=`Poster ${idx+1} / ${posters.length} • ${posters[idx].title}`;
  count.textContent=`${idx+1} / ${posters.length}`;
}

function setStageSize(){
  if(!img.naturalWidth || !img.naturalHeight) return;
  stage.style.width=img.naturalWidth+'px';
  stage.style.height=img.naturalHeight+'px';
}

function apply(){
  setStageSize();
  stage.style.transform=
    `translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;
}

function fit(){
  if(!img.naturalWidth || !img.naturalHeight) return;
  const r=main.getBoundingClientRect();
  const pad=24;
  const fitScale=Math.min(
    (r.width-pad)/img.naturalWidth,
    (r.height-pad)/img.naturalHeight
  );
  scale=Math.max(.02,Math.min(1,fitScale));
  x=0;y=0;
  apply();
}

function actual(){
  scale=1;x=0;y=0;
  apply();
}

function zoomAt(factor,cx,cy){
  if(!img.naturalWidth) return;

  const old=scale;
  const next=Math.max(.02,Math.min(8,old*factor));
  if(next===old) return;

  const r=main.getBoundingClientRect();
  const px=cx-r.width/2;
  const py=cy-r.height/2;

  // Keep the point under the cursor/fingers stationary.
  x=px-(px-x)*(next/old);
  y=py-(py-y)*(next/old);
  scale=next;

  apply();
}

function zoom(d){
  const r=main.getBoundingClientRect();
  zoomAt(d>0?1.2:(1/1.2),r.width/2,r.height/2);
}

function next(){show(idx+1)}
function prev(){show(idx-1)}
function fs(){document.documentElement.requestFullscreen?.()}

main.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.deltaY<0?1.12:(1/1.12),e.clientX-main.getBoundingClientRect().left,e.clientY-main.getBoundingClientRect().top);
},{passive:false});

stage.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse' && e.button!==0) return;

  pointerMoved=false;
  drag=true;
  sx=e.clientX; sy=e.clientY;
  ox=x; oy=y;
  stage.classList.add('dragging');
  stage.setPointerCapture?.(e.pointerId);
});

stage.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>3 || Math.abs(dy)>3) pointerMoved=true;
  x=ox+dx;
  y=oy+dy;
  apply();
});

stage.addEventListener('pointerup',e=>{
  drag=false;
  stage.classList.remove('dragging');

  const now=Date.now();
  if(!pointerMoved && now-lastTap<320){
    // Double tap/click: toggle between fit and a comfortable 2x zoom.
    if(scale > 1.05) fit();
    else {
      const r=main.getBoundingClientRect();
      zoomAt(2.0/Math.max(scale,.01),r.width/2,r.height/2);
    }
  }
  lastTap=now;
});

stage.addEventListener('pointercancel',()=>{
  drag=false;
  stage.classList.remove('dragging');
});

main.addEventListener('touchstart',e=>{
  if(e.touches.length!==2) return;

  const a=e.touches[0],b=e.touches[1];
  pinchStart=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  pinchScale=scale;

  const r=main.getBoundingClientRect();
  pinchX=((a.clientX+b.clientX)/2)-r.left;
  pinchY=((a.clientY+b.clientY)/2)-r.top;
},{passive:true});

main.addEventListener('touchmove',e=>{
  if(e.touches.length!==2 || !pinchStart) return;
  e.preventDefault();

  const a=e.touches[0],b=e.touches[1];
  const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  const nextScale=Math.max(.02,Math.min(8,pinchScale*(d/pinchStart)));

  const old=scale;
  const r=main.getBoundingClientRect();
  const cx=((a.clientX+b.clientX)/2)-r.left;
  const cy=((a.clientY+b.clientY)/2)-r.top;
  const px=cx-r.width/2,py=cy-r.height/2;

  x=px-(px-x)*(nextScale/old);
  y=py-(py-y)*(nextScale/old);
  scale=nextScale;
  apply();
},{passive:false});

main.addEventListener('touchend',()=>{
  pinchStart=0;
},{passive:true});

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'||e.key===' ') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key==='+') zoom(1);
  else if(e.key==='-') zoom(-1);
  else if(e.key==='0') fit();
  else if(e.key==='1') actual();
});

window.addEventListener('resize',()=>{
  requestAnimationFrame(()=>{
    if(img.naturalWidth) fit();
  });
});

document.getElementById('search').addEventListener('input',
  e=>renderSidebar(e.target.value.trim())
);

show(0);
