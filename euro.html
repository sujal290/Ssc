const QUESTIONS = [{"q_en": "The longest river in Europe is?", "q_hi": "यूरोप की सबसे लंबी नदी कौन सी है?", "opts_en": ["Rhine", "Volga", "Thames", "Danube"], "opts_hi": ["राइन", "वोल्गा", "थेम्स", "डेन्यूब"], "correct": 1, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Volga is longest in Europe (3690 km), flows into Caspian Sea. Danube second longest.", "exp_hi": "वोल्गा यूरोप की सबसे लंबी नदी (3690 किमी) है, कैस्पियन सागर में गिरती है। डेन्यूब दूसरी सबसे लंबी।", "chapter": "Europe"}, {"q_en": "Which mountain range separates Europe and Asia?", "q_hi": "कौन सी पर्वत श्रृंखला यूरोप और एशिया को अलग करती है?", "opts_en": ["Pyrenees", "Carpathians", "Ural Mountains", "Alps"], "opts_hi": ["पायरेनीज", "कार्पेथियन", "यूराल पर्वत", "आल्प्स"], "correct": 2, "exam": "SSC CGL 2022", "level": "Moderate", "exp_en": "Ural Mountains, Ural River and Caspian Sea form Europe-Asia boundary.", "exp_hi": "यूराल पर्वत, यूराल नदी और कैस्पियन सागर यूरोप-एशिया सीमा बनाते हैं।", "chapter": "Europe"}, {"q_en": "The smallest country in Europe by area is?", "q_hi": "क्षेत्रफल के हिसाब से यूरोप का सबसे छोटा देश कौन सा है?", "opts_en": ["Vatican City", "San Marino", "Monaco", "Andorra"], "opts_hi": ["वेटिकन सिटी", "सैन मैरिनो", "मोनाको", "अंडोरा"], "correct": 0, "exam": "SSC CHSL 2021", "level": "Moderate", "exp_en": "Vatican City 0.44 sq km smallest in world, in Rome. Monaco second smallest.", "exp_hi": "वेटिकन सिटी 0.44 वर्ग किमी विश्व में सबसे छोटा, रोम में स्थित।", "chapter": "Europe"}, {"q_en": "English Channel separates?", "q_hi": "इंग्लिश चैनल अलग करता है?", "opts_en": ["England and Ireland", "Italy and Greece", "Spain and France", "France and England"], "opts_hi": ["इंग्लैंड और आयरलैंड को", "इटली और ग्रीस को", "स्पेन और फ्रांस को", "फ्रांस और इंग्लैंड को"], "correct": 3, "exam": "SSC CGL 2020", "level": "Moderate", "exp_en": "English Channel between southern England and northern France, connects Atlantic to North Sea.", "exp_hi": "इंग्लिश चैनल दक्षिणी इंग्लैंड और उत्तरी फ्रांस के बीच, अटलांटिक को उत्तरी सागर से जोड़ता है।", "chapter": "Europe"}, {"q_en": "Which is the largest country in Europe by area?", "q_hi": "क्षेत्रफल के हिसाब से यूरोप का सबसे बड़ा देश कौन सा है?", "opts_en": ["France", "Germany", "Russia (European part)", "Ukraine"], "opts_hi": ["फ्रांस", "जर्मनी", "रूस (यूरोपीय भाग)", "यूक्रेन"], "correct": 2, "exam": "SSC CPO 2022", "level": "Moderate", "exp_en": "Russia is largest transcontinental, but even its European part alone is largest in Europe. Ukraine second largest wholly in Europe.", "exp_hi": "रूस सबसे बड़ा ट्रांसकॉन्टिनेंटल, इसका यूरोपीय भाग भी यूरोप में सबसे बड़ा।", "chapter": "Europe"}, {"q_en": "The Danube river flows into?", "q_hi": "डेन्यूब नदी कहाँ गिरती है?", "opts_en": ["Baltic Sea", "Black Sea", "Mediterranean Sea", "Caspian Sea"], "opts_hi": ["बाल्टिक सागर", "काला सागर", "भूमध्य सागर", "कैस्पियन सागर"], "correct": 1, "exam": "SSC CGL 2021", "level": "Moderate", "exp_en": "Danube flows through 10 countries and ends in Black Sea.", "exp_hi": "डेन्यूब 10 देशों से बहती है और काला सागर में गिरती है।", "chapter": "Europe"}, {"q_en": "Mediterranean Sea is connected to Atlantic Ocean by?", "q_hi": "भूमध्य सागर अटलांटिक महासागर से किसके द्वारा जुड़ा है?", "opts_en": ["Strait of Gibraltar", "Palk Strait", "Strait of Hormuz", "Bering Strait"], "opts_hi": ["जिब्राल्टर जलडमरूमध्य", "पाक जलडमरूमध्य", "होर्मुज जलडमरूमध्य", "बेरिंग जलडमरूमध्य"], "correct": 0, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Strait of Gibraltar between Spain and Morocco connects Mediterranean to Atlantic.", "exp_hi": "जिब्राल्टर जलडमरूमध्य स्पेन और मोरक्को के बीच भूमध्य को अटलांटिक से जोड़ता है।", "chapter": "Europe"}, {"q_en": "The Alps mountain is located in?", "q_hi": "आल्प्स पर्वत स्थित है?", "opts_en": ["Europe", "South America", "Africa", "Asia"], "opts_hi": ["यूरोप", "दक्षिण अमेरिका", "अफ्रीका", "एशिया"], "correct": 0, "exam": "SSC CHSL 2023", "level": "Moderate", "exp_en": "Alps is major mountain range in south-central Europe, ांस और स्पेन के बीच प्राकृतिक सीमा, अंडोरा वहीं स्थित।", "chapter": "Europe"}, {"q_en": "Strait of Bosporus connects?", "q_hi": "बोस्पोरस जलडमरूमध्य जोड़ता है?", "opts_en": ["Caspian and Black Sea", "Atlantic and Pacific", "Black Sea and Sea of Marmara", "Mediterranean and Red Sea"], "opts_hi": ["कैस्पियन और काला सागर को", "अटलांटिक और प्रशांत को", "काला सागर और मरमरा सागर को", "भूमध्य और लाल सागर को"], "correct": 2, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Bosporus connects Black Sea to Sea of Marmara, and separates Europe and Asia in Turkey.", "exp_hi": "बोस्पोरस काला सागर को मरमरा सागर से जोड़ता है, तुर्की में यूरोप-एशिया को अलग करता है।", "chapter": "Europe"}, {"q_en": "Which European country is called 'Land of Midnight Sun'?", "q_hi": "किस यूरोपीय देश को 'मध्यरात्रि के सूर्य की भूमि' कहा जाता है?", "opts_en": ["Sweden", "Finland", "Iceland", "Norway"], "opts_hi": ["स्वीडन", "फिनलैंड", "आइसलैंड", "नॉर्वे"], "correct": 3, "exam": "SSC CGL 2021", "level": "Moderate", "exp_en": "Norway is called Land of Midnight Sun because sun doesn't set in summer in Arctic Circle.", "exp_hi": "नॉर्वे को मध्यरात्रि के सूर्य की भूमि कहा जाता है क्योंकि आर्कटिक में गर्मियों में सूर्य अस्त नहीं होता।", "chapter": "Europe"}, {"q_en": "The largest continent by area is?", "q_hi": "क्षेत्रफल के हिसाब से सबसे बड़ा महाद्वीप कौन सा है?", "opts_en": ["Europe", "Asia", "Africa", "North America"], "opts_hi": ["यूरोप", "एशिया", "अफ्रीका", "उत्तरी अमेरिका"], "correct": 1, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Asia is largest (44.5 million sq km), covers 30% of land area.", "exp_hi": "एशिया सबसे बड़ा (44.5 मिलियन वर्ग किमी), भूमि क्षेत्र का 30%।", "chapter": "Asia"}, {"q_en": "The highest peak in Asia (and world) is?", "q_hi": "एशिया (और विश्व) की सबसे ऊँची चोटी कौन सी है?", "opts_en": ["Mount Everest", "Kangchenjunga", "Lhotse", "K2"], "opts_hi": ["माउंट एवरेस्ट", "कंचनजंगा", "ल्होत्से", "K2"], "correct": 0, "exam": "SSC CGL 2022", "level": "Moderate", "exp_en": "Mount Everest 8848.86 m in Nepal-China border, highest in world. K2 second highest.", "exp_hi": "माउंट एवरेस्ट 8848.86 मी नेपाल-चीन सीमा पर विश्व की सबसे ऊँची। K2 दूसरी सबसे ऊँची।", "chapter": "Asia"}, {"q_en": "The longest river in Asia is?", "q_hi": "एशिया की सबसे लंबी नदी कौन सी है?", "opts_en": ["Ganga", "Mekong", "Yangtze", "Indus"], "opts_hi": ["गंगा", "मेकांग", "यांग्त्ज़ी", "सिंधु"], "correct": 2, "exam": "SSC CHSL 2021", "level": "Moderate", "exp_en": "Yangtze 6300 km longest in Asia and China, third longest in world after Nile and Amazon.", "exp_hi": "यांग्त्ज़ी 6300 किमी एशिया और चीन की सबसे लंबी, विश्व की तीसरी सबसे लंबी।", "chapter": "Asia"}, {"q_en": "Which desert is the largest in Asia?", "q_hi": "एशिया का सबसे बड़ा रेगिस्तान कौन सा है?", "opts_en": ["Taklamakan", "Arabian Desert", "Thar Desert", "Gobi Desert"], "opts_hi": ["तकलामकान", "अरब रेगिस्तान", "थार रेगिस्तान", "गोबी रेगिस्तान"], "correct": 1, "exam": "SSC CGL 2020", "level": "Moderate", "exp_en": "Arabian Desert largest in Asia (2.33 million sq km), Gobi second largest.", "exp_hi": "अरब रेगिस्तान एशिया का सबसे बड़ा (2.33 मिलियन वर्ग किमी), गोबी दूसरा।", "chapter": "Asia"}, {"q_en": "Strait of Malacca connects?", "q_hi": "मलक्का जलडमरूमध्य जोड़ता है?", "opts_en": ["Mediterranean and Black Sea", "Andaman Sea and South China Sea", "Pacific and Atlantic", "Red Sea and Arabian Sea"], "opts_hi": ["भूमध्य और काला सागर को", "अंडमान सागर और दक्षिण चीन सागर को", "प्रशांत और अटलांटिक को", "लाल सागर और अरब सागर को"], "correct": 1, "exam": "SSC CPO 2022", "level": "Moderate", "exp_en": "Strait of Malacca between Malay Peninsula and Sumatra, connects Andaman Sea (Indian Ocean) to South China Sea (Pacific).", "exp_hi": "मलक्का जलडमरूमध्य मलय प्रायद्वीप और सुमात्रा के बीच, अंडमान सागर (हिंद महासागर) को दक्षिण चीन सागर (प्रशांत) से जोड़ता है।", "chapter": "Asia"}, {"q_en": "Which Asian country is called 'Land of Rising Sun'?", "q_hi": "किस एशियाई देश को 'उगते सूरज की भूमि' कहा जाता है?", "opts_en": ["Thailand", "South Korea", "China", "Japan"], "opts_hi": ["थाईलैंड", "दक्षिण कोरिया", "चीन", "जापान"], "correct": 3, "exam": "SSC CGL 2021", "level": "Moderate", "exp_en": "Japan called Land of Rising Sun (Nihon). China is Middle Kingdom.", "exp_hi": "जापान को उगते सूरज की भूमि (निहोन) कहा जाता है।", "chapter": "Asia"}, {"q_en": "The largest country in Asia by area is?", "q_hi": "क्षेत्रफल के हिसाब से एशिया का सबसे बड़ा देश कौन सा है?", "opts_en": ["Kazakhstan", "China", "India", "Russia (Asian part)"], "opts_hi": ["कजाकिस्तान", "चीन", "भारत", "रूस (एशियाई भाग)"], "correct": 3, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Russia largest transcontinental, Asian part largest in Asia. China second largest wholly in Asia.", "exp_hi": "रूस सबसे बड़ा ट्रांसकॉन्टिनेंटल, एशियाई भाग एशिया में सबसे बड़ा। चीन एशिया में पूरी तरह से दूसरा सबसे बड़ा।", "chapter": "Asia"}, {"q_en": "Mount Fuji is located in?", "q_hi": "माउंट फूजी स्थित है?", "opts_en": ["Indonesia", "China", "Japan", "South Korea"], "opts_hi": ["इंडोनेशिया", "चीन", "जापान", "दक्षिण कोरिया"], "correct": 2, "exam": "SSC CHSL 2023", "level": "Moderate", "exp_en": "Mount Fuji dormant volcano, highest in Japan (3776 m), near Tokyo.", "exp_hi": "माउंट फूजी प्रसुप्त ज्वालामुखी, जापान की सबसे ऊँची (3776 मी), टोक्यो के पास।", "chapter": "Asia"}, {"q_en": "Which sea separates Asia and Africa?", "q_hi": "कौन सा सागर एशिया और अफ्रीका को अलग करता है?", "opts_en": ["Arabian Sea", "Mediterranean Sea", "Black Sea", "Red Sea"], "opts_hi": ["अरब सागर", "भूमध्य सागर", "काला सागर", "लाल सागर"], "correct": 3, "exam": "SSC CGL 2022", "level": "Moderate", "exp_en": "Red Sea separates Asia (Arabian Peninsula) and Africa, connected to Mediterranean by Suez Canal.", "exp_hi": "लाल सागर एशिया (अरब प्रायद्वीप) और अफ्रीका को अलग करता है, स्वेज नहर से भूमध्य से जुड़ा।", "chapter": "Asia"}, {"q_en": "The Dead Sea is located between?", "q_hi": "मृत सागर स्थित है?", "opts_en": ["China and Mongolia", "Israel and Jordan", "India and Pakistan", "Turkey and Greece"], "opts_hi": ["चीन और मंगोलिया के बीच", "इजराइल और जॉर्डन के बीच", "भारत और पाकिस्तान के बीच", "तुर्की और ग्रीस के बीच"], "correct": 1, "exam": "SSC CGL 2020", "level": "Moderate", "exp_en": "Dead Sea lowest point on land (-430 m), between Israel and Jordan, highly saline.", "exp_hi": "मृत सागर भूमि पर सबसे निचला बिंदु (-430 मी), इजराइल और जॉर्डन के बीच, अत्यधिक खारा।", "chapter": "Asia"}, {"q_en": "Which Asian river is known as 'Sorrow of China'?", "q_hi": "किस एशियाई नदी को 'चीन का शोक' कहा जाता है?", "opts_en": ["Yangtze", "Mekong", "Huang He (Yellow River)", "Amur"], "opts_hi": ["यांग्त्ज़ी", "मेकांग", "हुआंग ही (पीली नदी)", "अमूर"], "correct": 2, "exam": "SSC CGL 2021", "level": "Moderate", "exp_en": "Huang He (Yellow River) floods frequently, called Sorrow of China. Yangtze is longest.", "exp_hi": "हुआंग ही (पीली नदी) में अक्सर बाढ़ आती है, चीन का शोक कहा जाता है।", "chapter": "Asia"}, {"q_en": "The Caspian Sea, largest lake in world, is bordered by how many Asian countries?", "q_hi": "कैस्पियन सागर, विश्व की सबसे बड़ी झील, कितने एशियाई देशों से घिरी है?", "opts_en": ["5 (including European part of Russia) but 4 wholly Asian", "2", "4", "3"], "opts_hi": ["5 (रूस के यूरोपीय भाग सहित) लेकिन 4 पूरी तरह एशियाई", "2", "4", "3"], "correct": 2, "exam": "SSC CPO 2023", "level": "Moderate", "exp_en": "Caspian Sea bordered by 5 countries: Russia, Kazakhstan, Turkmenistan, Iran, Azerbaijan. 4 are transcontinental or Asian.", "exp_hi": "कैस्पियन सागर 5 देशों से घिरा: रूस, कजाकिस्तान, तुर्कमेनिस्तान, ईरान, अजरबैजान।", "chapter": "Asia"}, {"q_en": "Bering Strait separates?", "q_hi": "बेरिंग जलडमरूमध्य अलग करता है?", "opts_en": ["Asia and North America", "Europe and Africa", "Asia and Europe", "North and South America"], "opts_hi": ["एशिया और उत्तरी अमेरिका को", "यूरोप और अफ्रीका को", "एशिया और यूरोप को", "उत्तरी और दक्षिणी अमेरिका को"], "correct": 0, "exam": "SSC CGL 2023", "level": "Moderate", "exp_en": "Bering Strait between Russia (Asia) and Alaska (North America), connects Arctic and Pacific.", "exp_hi": "बेरिंग जलडमरूमध्य रूस (एशिया) और अलास्का (उत्तरी अमेरिका) के बीच, आर्कटिक और प्रशांत को जोड़ता है।", "chapter": "Asia"}, {"q_en": "Which Asian country has no coastline?", "q_hi": "किस एशियाई देश की कोई समुद्र तट रेखा नहीं है?", "opts_en": ["Thailand", "Nepal", "Bangladesh", "Vietnam"], "opts_hi": ["थाईलैंड", "नेपाल", "बांग्लादेश", "वियतनाम"], "correct": 1, "exam": "SSC CHSL 2022", "level": "Moderate", "exp_en": "Nepal is landlocked between India and China. Others have coastline.", "exp_hi": "नेपाल भारत और चीन के बीच भूमि से घिरा है।", "chapter": "Asia"}, {"q_en": "The Great Wall of China was built primarily during which dynasty's major construction?", "q_hi": "चीन की महान दीवार मुख्य रूप से किस वंश के दौरान बनी?", "opts_en": ["Tang", "Song", "Han only", "Qin and Ming"], "opts_hi": ["तांग", "सोंग", "केवल हान", "किन और मिंग"], "correct": 3, "exam": "SSC CGL 2022", "level": "Moderate", "exp_en": "Major construction by Qin (first) and Ming dynasties. Visible today mostly Ming.", "exp_hi": "मुख्य निर्माण किन (पहला) और मिंग वंश द्वारा। आज दिखने वाली अधिकांश मिंग काल की।", "chapter": "Asia"}, {"q_en": "Rub' al Khali desert is located in?", "q_hi": "रब अल खाली रेगिस्तान स्थित है?", "opts_en": ["Arabian Peninsula", "Central Asia", "Thar", "Mongolia"], "opts_hi": ["अरब प्रायद्वीप में", "मध्य एशिया में", "थार में", "मंगोलिया में"], "correct": 0, "exam": "SSC CGL 2020", "level": "Moderate", "exp_en": "Rub' al Khali (Empty Quarter) largest continuous sand desert in southern Arabian Peninsula (Saudi, Oman, UAE, Yemen).", "exp_hi": "रब अल खाली (खाली क्वार्टर) दक्षिणी अरब प्रायद्वीप में सबसे बड़ा निरंतर रेत रेगिस्तान।", "chapter": "Asia"}, {"q_en": "Consider statements about Europe: I. Europe is separated from Asia by Ural Mountains II. Europe's longest river Volga flows into Caspian Sea III. Mount Elbrus is highest peak in Europe", "q_hi": "यूरोप के बारे में कथनों पर विचार: I. यूरोप एशिया से यूराल पर्वत द्वारा अलग है II. यूरोप की सबसे लंबी नदी वोल्गा कैस्पियन सागर में गिरती है III. माउंट एल्ब्रस यूरोप की सबसे ऊँची चोटी है", "opts_en": ["Only I and III", "Only II and III", "All I, II, III", "Only I and II"], "opts_hi": ["केवल I और III", "केवल II और III", "सभी I, II, III", "केवल I और II"], "correct": 2, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All three correct. Ural boundary true, Volga into Caspian true, Elbrus 5642 m in Russia is highest in Europe (Mont Blanc highest in Western Europe).", "exp_hi": "तीनों सही। यूराल सीमा सही, वोल्गा कैस्पियन में सही, एल्ब्रस 5642 मी रूस में यूरोप की सबसे ऊँची (मोंट ब्लांक पश्चिमी यूरोप में सबसे ऊँची)।", "chapter": "Europe"}, {"q_en": "Match: A. Thames B. Seine C. Danube D. Rhine with: 1. Paris 2. London 3. Rotterdam flows into North Sea 4. Black Sea", "q_hi": "मिलान: A. थेम्स B. सीन C. डेन्यूब D. राइन साथ: 1. पेरिस 2. लंदन 3. रॉटरडैम से उत्तरी सागर में 4. काला सागर", "opts_en": ["A-1 B-2 C-3 D-4", "A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-2 B-1 C-4 D-3"], "opts_hi": ["A-1 B-2 C-3 D-4", "A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-2 B-1 C-4 D-3"], "correct": 3, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "Thames-London, Seine-Paris, Danube-Black Sea, Rhine-Rotterdam into North Sea.", "exp_hi": "थेम्स-लंदन, सीन-पेरिस, डेन्यूब-काला सागर, राइन-रॉटरडैम से उत्तरी सागर।", "chapter": "Europe"}, {"q_en": "Consider: I. Mediterranean climate has dry summers II. Norway has fjords due to glacial erosion III. Iceland is in Mid-Atlantic Ridge", "q_hi": "विचार: I. भूमध्यसागरीय जलवायु में गर्मियाँ शुष्क होती हैं II. नॉर्वे में हिमनद अपरदन से फियोर्ड हैं III. आइसलैंड मध्य-अटलांटिक रिज पर है", "opts_en": ["All I, II, III", "Only I and II", "Only II and III", "Only I and III"], "opts_hi": ["सभी I, II, III", "केवल I और II", "केवल II और III", "केवल I और III"], "correct": 0, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All correct. Mediterranean dry summer, fjords glacial, Iceland on MAR has volcanoes.", "exp_hi": "सभी सही। भूमध्यसागरीय शुष्क ग्रीष्म, फियोर्ड हिमनद, आइसलैंड MAR पर ज्वालामुखी।", "chapter": "Europe"}, {"q_en": "Which statements about European rivers are NOT correct? I. Volga flows into Black Sea II. Danube flows into Caspian Sea III. Rhine flows into Mediterranean", "q_hi": "यूरोपीय नदियों के बारे में कौन से कथन सही नहीं हैं? I. वोल्गा काला सागर में गिरती है II. डेन्यूब कैस्पियन सागर में गिरती है III. राइन भूमध्य सागर में गिरती है", "opts_en": ["Only I and II", "All I, II, III are incorrect", "Only II and III", "Only I and III"], "opts_hi": ["केवल I और II", "सभी I, II, III गलत हैं", "केवल II और III", "केवल I और III"], "correct": 1, "exam": "SSC CGL 2021", "level": "Hard", "exp_en": "All incorrect: Volga->Caspian, Danube->Black Sea, Rhine->North Sea.", "exp_hi": "सभी गलत: वोल्गा->कैस्पियन, डेन्यूब->काला सागर, राइन->उत्तरी सागर।", "chapter": "Europe"}, {"q_en": "Match straits of Europe: A. Gibraltar B. Bosporus C. English Channel D. Strait of Dover narrowest part of Channel with: 1. Black Sea-Marmara 2. Atlantic-Mediterranean 3. Narrowest 33km 4. Connects Atlantic-North Sea", "q_hi": "यूरोप के जलडमरूमध्य मिलान: A. जिब्राल्टर B. बोस्पोरस C. इंग्लिश चैनल D. डोवर जलडमरूमध्य चैनल का सबसे संकरा भाग साथ: 1. काला सागर-मरमरा 2. अटलांटिक-भूमध्य 3. सबसे संकरा 33 किमी 4. अटलांटिक-उत्तरी सागर जोड़ता है", "opts_en": ["A-2 B-1 C-4 D-3", "A-4 B-3 C-2 D-1", "A-3 B-4 C-1 D-2", "A-1 B-2 C-3 D-4"], "opts_hi": ["A-2 B-1 C-4 D-3", "A-4 B-3 C-2 D-1", "A-3 B-4 C-1 D-2", "A-1 B-2 C-3 D-4"], "correct": 0, "exam": "SSC CPO 2022", "level": "Hard", "exp_en": "Gibraltar Atlantic-Mediterranean, Bosporus Black-Marmara, English Channel Atlantic-North Sea, Dover is narrowest 33km part.", "exp_hi": "जिब्राल्टर अटलांटिक-भूमध्य, बोस्पोरस काला-मरमरा, इंग्लिश चैनल अटलांटिक-उत्तरी सागर, डोवर सबसे संकरा 33 किमी।", "chapter": "Europe"}, {"q_en": "Consider about Alps: I. Highest peak Mont Blanc II. Extends across 8 countries III. Forms border between France and Spain", "q_hi": "आल्प्स के बारे में विचार: I. सबसे ऊँची चोटी मोंट ब्लांक II. 8 देशों में फैला है III. फ्रांस और स्पेन के बीच सीमा बनाता है", "opts_en": ["All", "Only I", "Only II and III", "Only I and II"], "opts_hi": ["सभी", "केवल I", "केवल II और III", "केवल I और II"], "correct": 3, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "I and II correct. Mont Blanc 4808m highest in Alps, Alps across 8 countries. III false - Pyrenees forms France-Spain border.", "exp_hi": "I और II सही। मोंट ब्लांक आल्प्स में सबसे ऊँची, 8 देशों में फैला। III गलत - पायरेनीज फ्रांस-स्पेन सीमा बनाता है।", "chapter": "Europe"}, {"q_en": "No correct statement: I. Vatican City is largest country in Europe II. Great Britain is smallest island in Europe III. Danube flows into Caspian Sea", "q_hi": "कोई कथन सही नहीं: I. वेटिकन सिटी यूरोप का सबसे बड़ा देश है II. ग्रेट ब्रिटेन यूरोप का सबसे छोटा द्वीप है III. डेन्यूब कैस्पियन सागर में गिरती है", "opts_en": ["All statements are incorrect", "Only III incorrect", "Only I and II incorrect", "Only I incorrect"], "opts_hi": ["सभी कथन गलत हैं", "केवल III गलत", "केवल I और II गलत", "केवल I गलत"], "correct": 0, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All incorrect: Vatican smallest not largest, Great Britain largest not smallest, Danube flows into Black Sea not Caspian.", "exp_hi": "सभी गलत: वेटिकन सबसे छोटा न कि बड़ा, ग्रेट ब्रिटेन सबसे बड़ा न कि छोटा, डेन्यूब काला सागर में गिरती है न कि कैस्पियन।", "chapter": "Europe"}, {"q_en": "Match European countries with capitals: A. Norway B. Finland C. Sweden D. Denmark with: 1. Stockholm 2. Oslo 3. Copenhagen 4. Helsinki", "q_hi": "यूरोपीय देशों का राजधानियों से मिलान: A. नॉर्वे B. फिनलैंड C. स्वीडन D. डेनमार्क साथ: 1. स्टॉकहोम 2. ओस्लो 3. कोपेनहेगन 4. हेलसिंकी", "opts_en": ["A-3 B-4 C-1 D-2", "A-2 B-4 C-1 D-3", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4"], "opts_hi": ["A-3 B-4 C-1 D-2", "A-2 B-4 C-1 D-3", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4"], "correct": 1, "exam": "SSC CHSL 2022", "level": "Hard", "exp_en": "Norway-Oslo, Finland-Helsinki, Sweden-Stockholm, Denmark-Copenhagen.", "exp_hi": "नॉर्वे-ओस्लो, फिनलैंड-हेलसिंकी, स्वीडन-स्टॉकहोम, डेनमार्क-कोपेनहेगन।", "chapter": "Europe"}, {"q_en": "Consider about European Union: I. Currently 27 members after Brexit II. Headquarters in Brussels III. Uses Euro in all member countries", "q_hi": "यूरोपीय संघ के बारे में विचार: I. ब्रेक्जिट के बाद वर्तमान में 27 सदस्य II. मुख्यालय ब्रुसेल्स में III. सभी सदस्य देशों में यूरो का उपयोग", "opts_en": ["Only I and II", "Only II and III", "All", "Only I"], "opts_hi": ["केवल I और II", "केवल II और III", "सभी", "केवल I"], "correct": 0, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "I and II correct, III false - not all EU members use Euro (e.g., Sweden, Poland, Denmark).", "exp_hi": "I और II सही, III गलत - सभी EU सदस्य यूरो का उपयोग नहीं करते (जैसे स्वीडन, पोलैंड)।", "chapter": "Europe"}, {"q_en": "Which is correct about Scandinavian countries? I. Includes Norway, Sweden, Denmark II. Finland sometimes included culturally III. All have fjords", "q_hi": "स्कैंडिनेवियाई देशों के बारे में सही क्या है? I. इसमें नॉर्वे, स्वीडन, डेनमार्क शामिल II. फिनलैंड कभी-कभी सांस्कृतिक रूप से शामिल III. सभी में फियोर्ड हैं", "opts_en": ["Only II and III", "All", "Only I and II", "Only I"], "opts_hi": ["केवल II और III", "सभी", "केवल I और II", "केवल I"], "correct": 2, "exam": "SSC CGL 2021", "level": "Hard", "exp_en": "I and II correct. Not all have fjords - Norway famous for fjords, but Denmark, Sweden less.", "exp_hi": "I और II सही। सभी में फियोर्ड नहीं - नॉर्वे फियोर्ड के लिए प्रसिद्ध।", "chapter": "Europe"}, {"q_en": "Consider about Asia: I. Asia is largest continent II. Yangtze is longest river in Asia III. Mount Everest lies on Nepal-China border", "q_hi": "एशिया के बारे में विचार: I. एशिया सबसे बड़ा महाद्वीप II. यांग्त्ज़ी एशिया की सबसे लंबी नदी III. माउंट एवरेस्ट नेपाल-चीन सीमा पर है", "opts_en": ["Only I and II", "Only I and III", "Only II and III", "All I, II, III"], "opts_hi": ["केवल I और II", "केवल I और III", "केवल II और III", "सभी I, II, III"], "correct": 3, "exam": "SSC CGL ly affects India", "q_hi": "एशिया में मानसून के बारे में विचार: I. भूमि और समुद्र के विभेदक तापन से होता है II. दक्षिण एशिया में वर्षा लाता है III. केवल भारत को प्रभावित करता है", "opts_en": ["All", "Only I and II", "Only II and III", "Only I"], "opts_hi": ["सभी", "केवल I और II", "केवल II और III", "केवल I"], "correct": 1, "exam": "SSC CGL 2021", "level": "Hard", "exp_en": "I and II correct, III false - monsoon affects South, Southeast, East Asia.", "exp_hi": "I और II सही, III गलत - मानसून दक्षिण, दक्षिणपूर्व, पूर्वी एशिया को प्रभावित करता है।", "chapter": "Asia"}, {"q_en": "Which is correct about Asian plateaus? I. Tibetan Plateau highest II. Deccan Plateau in India is volcanic III. Iranian Plateau between Elburz and Zagros", "q_hi": "एशियाई पठारों के बारे में सही क्या है? I. तिब्बती पठार सबसे ऊँचा II. भारत में दक्कन पठार ज्वालामुखीय III. ईरानी पठार एल्बुर्ज और जाग्रोस के बीच", "opts_en": ["All I, II, III", "Only II and III", "Only I and II", "Only I and III"], "opts_hi": ["सभी I, II, III", "के केवल II और III", "केवल I और II", "केवल I और III"], "correct": 0, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All correct: Tibetan highest (Roof of World), Deccan basaltic volcanic, Iranian between Elburz and Zagros.", "exp_hi": "सभी सही: तिब्बती सबसे ऊँचा (विश्व की छत), दक्कन बेसाल्टिक ज्वालामुखीय, ईरानी एल्बुर्ज और जाग्रोस के बीच।", "chapter": "Asia"}, {"q_en": "Match Asian mountains: A. Himalayas B. Western Ghats C. Zagros D. Ural with: 1. Europe-Asia boundary 2. India west coast 3. Iran 4. India-Nepal border and more", "q_hi": "एशियाई पर्वतों का मिलान: A. हिमालय B. पश्चिमी घाट C. जाग्रोस D. यूराल साथ: 1. यूरोप-एशिया सीमा 2. भारत पश्चिमी तट 3. ईरान 4. भारत-नेपाल सीमा और अधिक", "opts_en": ["A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4", "A-4 B-2 C-3 D-1"], "opts_hi": ["A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4", "A-4 B-2 C-3 D-1"], "correct": 3, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "Himalayas India-Nepal, Western Ghats west coast India, Zagros Iran, Ural Europe-Asia.", "exp_hi": "हिमालय भारत-नेपाल, पश्चिमी घाट भारत पश्चिमी तट, जाग्रोस ईरान, यूराल यूरोप-एशिया।", "chapter": "Asia"}, {"q_en": "Consider about Asian seas: I. South China Sea is part of Pacific II. Arabian Sea is part of Indian Ocean III. Mediterranean is between Europe and Africa", "q_hi": "एशियाई समुद्रों के बारे में विचार: I. दक्षिण चीन सागर प्रशांत का हिस्सा II. अरब सागर हिंद महासागर का हिस्सा III. भूमध्य सागर यूरोप और अफ्रीका के बीच", "opts_en": ["Only II and III", "All I, II, III", "Only I and III", "Only I and II"], "opts_hi": ["केवल II और III", "सभी I, II, III", "केवल I और III", "केवल I और II"], "correct": 1, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All correct. South China Sea Pacific, Arabian Sea Indian Ocean, Mediterranean between Europe-Africa.", "exp_hi": "सभी सही। दक्षिण चीन सागर प्रशांत, अरब सागर हिंद महासागर, भूमध्य यूरोप-अफ्रीका के बीच।", "chapter": "Asia"}, {"q_en": "Which statements are correct about Silk Route? I. Connected Europe and Asia II. Passed through Central Asia III. Used for spice and silk trade", "q_hi": "सिल्क रूट के बारे में कौन से कथन सही हैं? I. यूरोप और एशिया को जोड़ता था II. मध्य एशिया से गुजरता था III. मसाला और रेशम व्यापार के लिए उपयोग", "opts_en": ["Only I and II", "Only I and III", "All I, II, III", "Only II and III"], "opts_hi": ["केवल I और II", "केवल I और III", "सभी I, II, III", "केवल II और III"], "correct": 2, "exam": "SSC CGL 2021", "level": "Hard", "exp_en": "All correct. Silk Route Europe-Asia via Central Asia, traded silk, spices, ideas.", "exp_hi": "सभी सही। सिल्क रूट यूरोप-एशिया मध्य एशिया से, रेशम, मसाला, विचारों का व्यापार।", "chapter": "Asia"}, {"q_en": "No correct statement about Asia: I. Asia has no deserts II. Asia has no active volcanoes III. Asia has no landlocked countries", "q_hi": "एशिया के बारे में कोई कथन सही नहीं: I. एशिया में कोई रेगिस्तान नहीं II. एशिया में कोई सक्रिय ज्वालामुखी नहीं III. एशिया में कोई भूमि से घिरा देश नहीं", "opts_en": ["All statements are incorrect", "Only I and II incorrect", "Only I incorrect", "Only III incorrect"], "opts_hi": ["सभी कथन गलत हैं", "केवल I और II गलत", "केवल I गलत", "केवल III गलत"], "correct": 0, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "All incorrect: Asia has deserts (Arabian, Gobi), active volcanoes (Fuji, Krakatoa), many landlocked countries (Nepal, Kazakhstan, etc).", "exp_hi": "सभी गलत: एशिया में रेगिस्तान (अरब, गोबी), सक्रिय ज्वालामुखी (फूजी, क्राकाटोआ), कई भूमि से घिरे देश (नेपाल, कजाकिस्तान)।", "chapter": "Asia"}, {"q_en": "Match Asian countries with features: A. Japan B. Indonesia C. Philippines D. Thailand with: 1. Archipelago of 7000+ islands 2. Land of Smiles 3. 17000+ islands, Krakatoa 4. 4 main islands, Fuji", "q_hi": "एशियाई देशों का विशेषताओं से मिलान: A. जापान B. इंडोनेशिया C. फिलीपींस D. थाईलैंड साथ: 1. 7000+ द्वीपों का द्वीपसमूह 2. मुस्कान की भूमि 3. 17000+ द्वीप, क्राकाटोआ 4. 4 मुख्य द्वीप, फूजी", "opts_en": ["A-3 B-4 C-1 D-2", "A-1 B-2 C-3 D-4", "A-4 B-3 C-1 D-2", "A-4 B-3 C-2 D-1"], "opts_hi": ["A-3 B-4 C-1 D-2", "A-1 B-2 C-3 D-4", "A-4 B-3 C-1 D-2", "A-4 B-3 C-2 D-1"], "correct": 2, "exam": "SSC CHSL 2023", "level": "Hard", "exp_en": "Japan 4 main islands Fuji, Indonesia 17000+ islands Krakatoa, Philippines 7000+ islands, Thailand Land of Smiles.", "exp_hi": "जापान 4 मुख्य द्वीप फूजी, इंडोनेशिया 17000+ द्वीप क्राकाटोआ, फिलीपींस 7000+ द्वीप, थाईलैंड मुस्कान की भूमि।", "chapter": "Asia"}, {"q_en": "Consider about Asia-Europe difference: I. Europe more indented coastline II. Asia has more plateaus III. Europe has more deserts than Asia", "q_hi": "एशिया-यूरोप अंतर के बारे में विचार: I. यूरोप की तट रेखा अधिक कटी-फटी II. एशिया में अधिक पठार III. यूरोप में एशिया से अधिक रेगिस्तान", "opts_en": ["Only II and III", "All", "Only I", "Only I and II"], "opts_hi": ["केवल II और III", "सभी", "केवल I", "केवल I और II"], "correct": 3, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "I and II correct, III false - Asia has more deserts (Arabian, Gobi, Thar) than Europe.", "exp_hi": "I और II सही, III गलत - एशिया में यूरोप से अधिक रेगिस्तान (अरब, गोबी, थार)।", "chapter": "Asia"}, {"q_en": "Which is correct about transcontinental countries? I. Russia in Europe and Asia II. Turkey in Europe and Asia III. Egypt in Africa and Asia (Sinai)", "q_hi": "ट्रांसकॉन्टिनेंटल देशों के बारे में सही क्या है? I. रूस यूरोप और एशिया में II. तुर्की यूरोप और एशिया में III. मिस्र अफ्रीका और एशिया में (सिनाई)", "opts_en": ["All I, II, III", "Only I and II", "Only I and III", "Only II and III"], "opts_hi": ["सभी I, II, III", "केवल I और II", "केवल I और III", "केवल II और III"], "correct": 0, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "All correct. Russia, Turkey, Egypt (Sinai in Asia) are transcontinental.", "exp_hi": "सभी सही। रूस, तुर्की, मिस्र (सिनाई एशिया में) ट्रांसकॉन्टिनेंटल हैं।", "chapter": "Asia"}, {"q_en": "Match Asian lakes: A. Baikal B. Caspian C. Dead Sea D. Aral with: 1. Largest lake 2. Deepest lake 3. Lowest point, highly saline 4. Shrinking due to irrigation", "q_hi": "एशियाई झीलों का मिलान: A. बैकाल B. कैस्पियन C. मृत सागर D. अरल साथ: 1. सबसे बड़ी झील 2. सबसे गहरी झील 3. सबसे निचला बिंदु, अत्यधिक खारा 4. सिंचाई के कारण सिकुड़ना", "opts_en": ["A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4", "A-2 B-1 C-3 D-4"], "opts_hi": ["A-3 B-4 C-1 D-2", "A-4 B-3 C-2 D-1", "A-1 B-2 C-3 D-4", "A-2 B-1 C-3 D-4"], "correct": 3, "exam": "SSC CPO 2022", "level": "Hard", "exp_en": "Baikal deepest (1642m), Caspian largest lake, Dead Sea lowest highly saline, Aral shrinking due to irrigation.", "exp_hi": "बैकाल सबसे गहरी (1642मी), कैस्पियन सबसे बड़ी झील, मृत सागर सबसे निचला अत्यधिक खारा, अरल सिंचाई से सिकुड़ रही।", "chapter": "Asia"}, {"q_en": "Consider about Asian climate: I. Siberia has continental climate II. Southeast Asia has monsoon III. Central Asia has desert", "q_hi": "एशियाई जलवायु के बारे में विचार: I. साइबेरिया में महाद्वीपीय जलवायु II. दक्षिणपूर्व एशिया में मानसून III. मध्य एशिया में रेगिस्तान", "opts_en": ["Only I and III", "All I, II, III", "Only II and III", "Only I and II"], "opts_hi": ["केवल I और III", "सभी I, II, III", "केवल II और III", "केवल I और II"], "correct": 1, "exam": "SSC CGL 2021", "level": "Hard", "exp_en": "All correct. Siberia continental extreme, SE Asia monsoon, Central Asia desert (Karakum, Kyzylkum).", "exp_hi": "सभी सही। साइबेरिया महाद्वीपीय चरम, दक्षिणपूर्व एशिया मानसून, मध्य एशिया रेगिस्तान।", "chapter": "Asia"}, {"q_en": "Which statements about Europe-Asia trade routes are correct? I. Suez Canal connects Mediterranean and Red Sea II. Bosporus connects Black Sea and Marmara III. Malacca connects Indian and Pacific Oceans", "q_hi": "यूरोप-एशिया व्यापार मार्गों के बारे में कौन से कथन सही हैं? I. स्वेज नहर भूमध्य और लाल सागर को जोड़ती है II. बोस्पोरस काला सागर और मरमरा को जोड़ता है III. मलक्का हिंद और प्रशांत महासागरों को जोड़ता है", "opts_en": ["Only I and III", "Only I and II", "All I, II, III", "Only II and III"], "opts_hi": ["केवल I और III", "केवल I और II", "सभी I, II, III", "केवल II और III"], "correct": 2, "exam": "SSC CGL 2023", "level": "Hard", "exp_en": "All correct. Suez Mediterranean-Red Sea, Bosporus Black-Marmara, Malacca Indian-Pacific via Andaman-South China Sea.", "exp_hi": "सभी सही। स्वेज भूमध्य-लाल सागर, बोस्पोरस काला-मरमरा, मलक्का हिंद-प्रशांत।", "chapter": "Asia"}, {"q_en": "No correct about Europe: I. Europe has no active volcanoes II. Europe has no deserts III. Europe has no fjords", "q_hi": "यूरोप के बारे में कोई सही नहीं: I. यूरोप में कोई सक्रिय ज्वालामुखी नहीं II. यूरोप में कोई रेगिस्तान नहीं III. यूरोप में कोई फियोर्ड नहीं", "opts_en": ["Only I and II incorrect", "All statements are incorrect", "Only III incorrect", "Only I incorrect"], "opts_hi": ["केवल I और II गलत", "सभी कथन गलत हैं", "केवल III गलत", "केवल I गलत"], "correct": 1, "exam": "SSC CGL 2022", "level": "Hard", "exp_en": "All incorrect: Europe has active volcanoes (Etna, Stromboli), small deserts (Tabernas Spain), fjords in Norway.", "exp_hi": "सभी गलत: यूरोप में सक्रिय ज्वालामुखी (एटना           <button onclick="toggleMark()" class="px-5 py-3 rounded-xl font-bold text-[13px] ${state.marked[state.current]?'bg-amber-400 text-amber-900 shadow':'bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100'}">${state.marked[state.current]?'★ Unmark':'☆ Mark Review'}</button>
          <button onclick="nextQ()" class="ml-auto px-7 py-3 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold text-[13px] shadow-lg">Next →</button>
        </div>
      </div>
      <div class="bg-white rounded-[1.6rem] shadow-sm border border-slate-200 p-5 lg:sticky lg:top-[68px]">
        <div class="flex items-center justify-between mb-4"><h3 class="font-bold text-[14px] text-slate-800">Palette • प्रश्न पटल</h3><span class="text-[11px] px-2.5 py-1 rounded-full bg-slate-100 font-bold">${totalAns}/75</span></div>
        <div class="grid grid-cols-5 gap-2 max-h-[42vh] lg:max-h-[58vh] overflow-auto pr-1 no-scrollbar">
          ${QUESTIONS.map((_,i)=>{
            const ans=state.answers[i]!==null;
            const mark=state.marked[i];
            const cur=i===state.current;
            let cls='bg-white border-slate-200 text-slate-500 hover:bg-slate-50';
            if(cur) cls='bg-cyan-600 text-white border-cyan-600 shadow-lg scale-105';
            else if(mark && ans) cls='bg-gradient-to-br from-purple-100 to-cyan-100 border-purple-300 text-purple-700 font-bold';
            else if(mark) cls='bg-amber-100 border-amber-300 text-amber-800 font-bold';
            else if(ans) cls='bg-emerald-50 border-emerald-300 text-emerald-700 font-bold';
            else if(state.visited[i]) cls='bg-slate-50 border-slate-300 text-slate-600';
            return `<button onclick="goTo(${i})" class="w-[42px] h-[42px] rounded-xl border-[1.5px] font-bold text-[12px] transition-all ${cls}">${i+1}</button>`;
          }).join('')}
        </div>
        <button onclick="confirmSubmit()" class="mt-6 w-full py-3.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 text-white font-bold text-[13px] shadow-[0_8px_20px_rgba(8,145,178,0.3)]">Final Submit / जमा करें</button>
        <div class="mt-3 text-[10px] text-center text-slate-400">Balanced: A-19 B-19 C-19 D-18 • No Sequence</div>
      </div>
    </div>
    `;
    if(state.showConfirm){
      app.innerHTML += `
      <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"><div class="bg-white rounded-[1.8rem] p-7 max-w-md w-full shadow-2xl border">
        <div class="w-12 h-12 rounded-2xl bg-amber-100 flex items-center justify-center text-xl">⚠️</div>
        <h3 class="font-bold text-[18px] mt-4">Final Submit?</h3><p class="text-[13px] text-slate-600 mt-2 leading-relaxed">Attempted <b>${totalAns} / 75</b>. Time left <b>${formatTime(state.time)}</b>. After submit detailed explanations.</p>
        <div class="mt-6 flex gap-3"><button onclick="state.showConfirm=false;render()" class="flex-1 py-3.5 rounded-xl bg-slate-100 font-bold text-[13px]">Cancel</button><button onclick="finalSubmit()" class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold text-[13px] shadow">Yes, Submit</button></div>
      </div></div>`;
    }
    return;
  }
  let correct=0;
  QUESTIONS.forEach((q,i)=>{ if(state.answers[i]===q.correct) correct++; });
  const attempted = state.answers.filter(a=>a!==null).length;
  const wrong = attempted - correct;
  const perc = Math.round((correct/75)*100);
  app.innerHTML = `
  <div class="gradient-header text-white py-10">
    <div class="max-w-7xl mx-auto px-5 md:px-8"><h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">संभव Batch - Result • Europe & Asia</h1><p class="opacity-80 mt-2 text-[14px]">Vipulendra Tripathi Sir • Detailed Answer Key</p></div>
  </div>
  <div class="max-w-7xl mx-auto px-5 md:px-8 -mt-7 pb-16">
    <div class="grid md:grid-cols-4 gap-4">
      <div class="bg-white rounded-[1.5rem] p-6 shadow border"><div class="text-[11px] font-bold tracking-widest text-slate-400">SCORE</div><div class="text-4xl font-extrabold text-cyan-600 mt-1">${correct}<span class="text-xl text-slate-400">/75</span></div><div class="mt-2 inline-flex px-3 py-1 rounded-full bg-cyan-50 text-cyan-700 text-xs font-bold">${perc}% • ${perc>=75?'Outstanding':'Good'}</div></div>
      <div class="bg-white rounded-[1.5rem] p-6 shadow border"><div class="text-[11px] font-bold tracking-widest text-slate-400">ATTEMPTED</div><div class="text-4xl font-bold mt-1">${attempted}</div><div class="mt-2 text-xs"><span class="text-emerald-600 font-bold">${correct} Correct</span> • <span class="text-rose-600 font-bold">${wrong} Wrong</span></div></div>
      <div class="bg-white rounded-[1.5rem] p-6 shadow border"><div class="text-[11px] font-bold tracking-widest text-slate-400">ANSWER DISTRIBUTION</div><div class="mt-3 flex flex-wrap gap-2">${['A','B','C','D'].map((l,i)=>`<span class="px-3 py-1.5 rounded-full bg-slate-900 text-white text-xs font-bold">${l}: ${QUESTIONS.filter(q=>q.correct===i).length}</span>`).join('')}<span class="px-3 py-1.5 rounded-full bg-amber-100 text-amber-800 text-xs font-bold border">Balanced</span></div></div>
      <div class="bg-white rounded-[1.5rem] p-6 shadow border flex flex-col justify-center gap-2"><button onclick="window.print()" class="py-3 rounded-xl bg-slate-900 text-white font-bold text-[13px]">🖨️ Print / Save PDF</button><button onclick="location.reload()" class="py-3 rounded-xl bg-cyan-50 border border-cyan-100 text-cyan-700 font-bold text-[13px]">🔄 Retake</button></div>
    </div>
    <div class="mt-8 bg-white rounded-[1.8rem] shadow border p-5 md:p-8">
      <h2 class="text-[20px] font-extrabold">Detailed Answer Key • विस्तृत उत्तर</h2>
      <p class="text-[12px] text-slate-500 mt-1">75 Questions • Europe & Asia • Zero Error • Bilingual</p>
      <div class="mt-7 space-y-5">
        ${QUESTIONS.map((q,i)=>{
          const userAns = state.answers[i];
          const isCorrect = userAns===q.correct;
          const userLabel = userAns===null?'Not Attempted':['A','B','C','D'][userAns];
          const correctLabel = ['A','B','C','D'][q.correct];
          return `<div class="border-2 rounded-[1.4rem] p-5 ${isCorrect?'border-emerald-200 bg-emerald-50/20':'userAns===null'?'border-slate-200 bg-white':'border-rose-200 bg-rose-50/30'}">
            <div class="flex flex-wrap gap-2 mb-3">
              <span class="px-3 py-1 rounded-full text-[11px] font-extrabold bg-slate-900 text-white">Q${i+1}</span>
              <span class="px-3 py-1 rounded-full text-[11px] font-bold ${q.level==='Moderate'?'bg-emerald-100 text-emerald-700 border':'bg-rose-100 text-rose-700 border'}">${q.level} • ${q.chapter}</span>
              <span class="px-3 py-1 rounded-full text-[11px] font-bold bg-indigo-50 text-indigo-700 border">📘 ${q.exam}</span>
              <span class="ml-auto px-3 py-1 rounded-full text-[11px] font-bold ${isCorrect?'bg-emerald-500 text-white':userAns===null?'bg-slate-200':'bg-rose-500 text-white'}">${isCorrect?'✓ CORRECT':userAns===null?'○ SKIPPED':'✗ WRONG'}</span>
            </div>
            <div class="font-semibold text-[14.5px] text-slate-900">${q.q_en}</div>
            <div class="dev text-[13.5px] text-slate-600 mt-2 bg-white border rounded-xl p-3">हिंदी: ${q.q_hi}</div>
            <div class="mt-4 grid md:grid-cols-2 gap-2.5">
              ${q.opts_en.map((opt,oi)=>{
                const isC = oi===q.correct;
                return `<div class="p-3 rounded-xl border-[1.5px] text-[13px] ${isC?'bg-emerald-50 border-emerald-300 font-bold':'bg-white border-slate-200'}">
                  <span class="font-extrabold">${['A','B','C','D'][oi]}.</span> ${opt} <span class="dev text-slate-500">/ ${q.opts_hi[oi]}</span> ${isC?' <span class="ml-2 px-2 py-0.5 rounded-full bg-emerald-500 text-white text-[10px]">CORRECT</span>':''}
                </div>`;
              }).join('')}
            </div>
            <div class="mt-4 p-4 rounded-2xl bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-100 text-[13px]">
              <div class="font-extrabold text-amber-900 text-[12px]">EXPLANATION • व्याख्या:</div>
              <div class="mt-2 text-slate-700">${q.exp_en}</div>
              <div class="dev mt-2 text-slate-600">${q.exp_hi}</div>
              <div class="mt-3 flex gap-2 text-[10px]"><span class="px-2.5 py-1 rounded-full bg-white border font-bold">Correct: ${correctLabel}</span><span class="px-2.5 py-1 rounded-full bg-white border font-bold">Your: ${userLabel}</span><span class="px-2.5 py-1 rounded-full bg-slate-900 text-white font-bold">${q.exam}</span></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>
  `;
}

function startQuiz(){
  state.started=true;
  state.visited[0]=true;
  render();
  state.timer=setInterval(()=>{
    state.time--;
    if(state.time<=0){ finalSubmit(); return; }
    render();
  },1000);
}
function selectOption(i){ state.answers[state.current]=i; state.visited[state.current]=true; render(); }
function nextQ(){ if(state.current<74){ state.current++; state.visited[state.current]=true; render(); } }
function prevQ(){ if(state.current>0){ state.current--; render(); } }
function goTo(i){ state.current=i; state.visited[i]=true; render(); }
function clearAns(){ state.answers[state.current]=null; render(); }
function toggleMark(){ state.marked[state.current]=!state.marked[state.current]; render(); }
function confirmSubmit(){ state.showConfirm=true; render(); }
function finalSubmit(){ clearInterval(state.timer); state.submitted=true; state.showConfirm=false; window.scrollTo(0,0); render(); }

render();
</script>
</body>
</html>
