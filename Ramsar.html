  html, body { margin: 0; padding: 0; height: 100%; background: #0A2E2B; }

    min-height: 100vh;
    width: 100%;
    padding: 28px 16px 60px;
    box-sizing: border-box;
  }

  .rq-wrap { max-width: 1080px; margin: 0 auto; }

  .rq-header { text-align: center; margin-bottom: 22px; }
  .rq-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent-gold); font-weight: 700; margin-bottom: 10px;
  }
  .rq-title {
    font-family: 'Fraunces', serif; font-weight: 700;
    font-size: clamp(28px, 5vw, 44px); line-height: 1.05; margin: 0;
    letter-spacing: -0.01em;
  }
  .rq-title em { font-style: normal; color: var(--accent-teal); }
  .rq-subtitle {
    margin-top: 10px; color: var(--text-muted); font-size: 14.5px;
  }

  .rq-progress-track {
    position: relative; height: 6px; border-radius: 6px;
    background: rgba(244,239,225,0.10); margin: 22px 0 6px; overflow: visible;
  }
  .rq-progress-fill {
    position: absolute; top: 0; left: 0; height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent-teal), var(--accent-gold));
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .rq-progress-bird {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    transition: left 0.5s cubic-bezier(.4,0,.2,1);
    background: var(--bg-deep); border: 2px solid var(--accent-gold);
    border-radius: 50%; width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-gold);
  }
  .rq-progress-label {
    display: flex; justify-content: space-between; font-size: 12.5px;
    color: var(--text-muted); margin-bottom: 18px;
  }

  .rq-grid {
    display: grid; grid-template-columns: 1.7fr 1fr; gap: 20px; align-items: start;
  }
  @media (max-width: 840px) {
    .rq-grid { grid-template-columns: 1fr; }
  }

    background: linear-gradient(160deg, var(--bg-card), var(--bg-panel));
    border: 1px solid var(--border); border-radius: 18px;
    padding: 26px 26px 24px;
    box-shadow: 0 20px 45px -20px rgba(0,0,0,0.55);
    animation: rq-fade-in 0.4s ease;
  }
  @keyframes rq-fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

    display: inline-block; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--bg-deep); background: var(--accent-teal);
    padding: 5px 11px; border-radius: 999px; margin-bottom: 14px;
  }
  .rq-qnum { color: var(--text-muted); font-size: 12.5px; font-weight: 600; float: right; margin-top: 4px; }

    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(19px, 2.6vw, 24px); line-height: 1.35; margin: 4px 0 22px;
    clear: both;

    display: flex; align-items: center; gap: 12px; text-align: left;
    background: rgba(244,239,225,0.05); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 14px; color: var(--text-primary);

  .rq-opt:hover:not(:disabled) {

    transform: translateY(-1px);
  }
  .rq-opt:disabled { cursor: default; }
  .rq-opt-letter {

    justify-content: center; font-size: 12.5px; font-weight: 700;

  .rq-opt.correct {
    border-color: var(--accent-green); background: rgba(79,174,104,0.18);
    animation: rq-pop 0.3s ease;
  }
  .rq-opt.wrong {
    border-color: var(--accent-red); background: rgba(224,89,75,0.18);

  @keyframes rq-shake {

    40%, 60% { transform: translateX(4px); }

  .rq-feedback.correct { color: var(--accent-green); }

  .rq-next:hover { transform: translateY(-1px); filter: brightness(1.06); }

    position: sticky; top: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  .rq-score-card {
    background: linear-gradient(160deg, var(--bg-panel-2), var(--bg-panel));
    border: 1px solid var(--border); border-radius: 18px; padding: 22px;

  .rq-score-title {
    display: flex; align-items: center; gap: 8px; font-weight: 700;

    height: 8px; border-radius: 6px; background: rgba(244,239,225,0.10);
    overflow: hidden; margin: 12px 0 4px;
  }
  .rq-bar-fill {
    height: 100%; border-radius: 6px;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-teal));
    transition: width 0.4s ease;
  }
  .rq-bar-label { font-size: 12.5px; color: var(--text-muted); }

  .rq-flame { color: var(--accent-gold); }

    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; border: 1px solid var(--border); color: var(--text-primary);

    padding: 11px; border-radius: 10px; cursor: pointer; margin-top: 14px;

  .rq-restart-btn:hover { border-color: var(--accent-teal); background: rgba(79,189,180,0.08); }

    border: 1px dashed var(--border); border-radius: 14px; padding: 16px 18px;

  .rq-complete-icon { font-size: 46px; margin-bottom: 12px; }
  .rq-complete-title {
    font-family: 'Fraunces', serif; font-size: 30px; font-weight: 700; margin: 0 0 6px;

  .rq-complete-rank { color: var(--accent-gold); font-weight: 700; margin-bottom: 22px; }
  .rq-complete-score {

  .rq-complete-acc { color: var(--text-muted); margin-bottom: 26px; }
  .rq-complete-btn {

    background: var(--accent-gold); color: #2B2107; border: none;
    font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px;
    padding: 13px 26px; border-radius: 11px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .rq-card, .rq-opt.correct, .rq-opt.wrong, .rq-flame.active { animation: none !important; }
    .rq-progress-fill, .rq-progress-bird, .rq-bar-fill { transition: none !important; }

const ODD_ONE_OUT = [
  { q: 'Which of these is NOT a "Bird Sanctuary" Ramsar Site?', opts: ["Karikili Bird Sanctuary", "Nawabganj Bird Sanctuary", "Sultanpur National Park", "Vellode Bird Sanctuary"], ans: "Sultanpur National Park", exp: "Sultanpur is designated as a National Park, not a Bird Sanctuary — the other three carry \"Bird Sanctuary\" in their official name." },

  { q: 'Which of these is NOT a "National Park" Ramsar Site?', opts: ["Keoladeo National Park", "Sultanpur National Park", "Point Calimere Wildlife & Bird Sanctuary", "Marine National Park (Gulf of Kachchh)"], ans: "Point Calimere Wildlife & Bird Sanctuary", exp: "Point Calimere is designated a Wildlife & Bird Sanctuary, not a National Park — unlike the other three." },

  { q: 'Which of these is NOT a "Wetland" named Ramsar Site?', opts: ["Bhoj Wetland", "Wadhvana", "Haiderpur Wetland", "Chilika Lake"], ans: "Chilika Lake", exp: "Chilika is named as a lake, while Bhoj, Wadhvana, and Haiderpur are all officially named as wetlands." },
];

/* =========================================================================
   HELPERS
   ========================================================================= */

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(correct, pool, n) {
  const filtered = [...new Set(pool.filter((x) => x !== correct))];
  return shuffle(filtered).slice(0, n);
}

function buildPairs(items, keyFn, maxCount, filterFn) {
  const pairs = [];
  const used = new Set();
  let step = 1;
  while (pairs.length < maxCount && step < items.length) {
    for (let i = 0; i < items.length && pairs.length < maxCount; i++) {
      const j = (i + step) % items.length;
      if (i === j) continue;
      const a = items[i];
      const b = items[j];
      if (filterFn && !filterFn(a, b)) continue;
      const key = [keyFn(a), keyFn(b)].sort().join("|");
      if (used.has(key)) continue;
      used.add(key);
      pairs.push([a, b]);
    }
    step++;
  }
  return pairs;
}

function buildAllQuestions() {
  let qid = 0;
  const questions = [];

  const mk = (category, question, correct, pool, count = 3) => {
    const distractors = pickDistractors(correct, pool, count);
    const options = shuffle([correct, ...distractors]);
    questions.push({ id: qid++, category, question, options, answer: correct });
  };

  SITES.forEach(([site, state]) => {
    mk("Site → State", `Which state is the Ramsar Site "${site}" located in?`, state, ALL_STATES, 3);
  });

  const uniqueCounts = [...new Set(Object.values(STATE_COUNTS))].map(String);
  ALL_STATES.forEach((state) => {
    mk("State-wise Count", `How many Ramsar Sites does ${state} have (as of 2026)?`, String(STATE_COUNTS[state]), uniqueCounts, 3);
  });

  const allTotals = YEAR_DATA.map((y) => String(y.total));
  YEAR_DATA.forEach((y) => {
    mk("Year-wise Growth", `What was the total number of Ramsar Sites in India by the year ${y.year}?`, String(y.total), allTotals, 3);
  });

  const allYears = YEAR_DATA.map((y) => String(y.year));
  YEAR_DATA.forEach((y) => {
    mk("Year-wise Growth", `In which year did India's total Ramsar Site count first reach ${y.total}?`, String(y.year), allYears, 3);
  });

  const allAdded = YEAR_DATA.map((y) => String(y.added));
  YEAR_DATA.forEach((y) => {
    mk("Year-wise Growth", `How many NEW Ramsar Sites were added to India's list in ${y.year}?`, String(y.added), allAdded, 3);
  });

  const allYearSites = YEAR_DATA.map((y) => y.site);
  YEAR_DATA.forEach((y) => {
    mk("Year-wise Growth", `Which of these Ramsar Sites was added to the list in ${y.year}?`, y.site, allYearSites, 3);
  });

  const allDates = [...new Set(NEW_2026.map((s) => s.date)), "15 August 2025", "1 January 2027", "10 October 2026"];
  NEW_2026.forEach((s) => {
    mk("2026 Additions", `On what date in 2026 was "${s.site}" designated a Ramsar Site?`, s.date, allDates, 3);
  });
  const allSerials = NEW_2026.map((s) => String(s.no));
  NEW_2026.forEach((s) => {
    mk("2026 Additions", `What serial number was assigned to "${s.site}" among India's 100 Ramsar Sites?`, String(s.no), allSerials, 3);
  });

  ODD_ONE_OUT.forEach((item) => {
    questions.push({ id: qid++, category: "Odd One Out", question: item.q, options: shuffle(item.opts), answer: item.ans });
  });

  const statePairs = buildPairs(ALL_STATES, (x) => x, 45, (a, b) => STATE_COUNTS[a] !== STATE_COUNTS[b]);
  statePairs.forEach(([a, b]) => {
    const higher = STATE_COUNTS[a] > STATE_COUNTS[b] ? a : b;
    questions.push({
      id: qid++,
      category: "Compare States",
      question: `Which state has MORE Ramsar Sites — ${a} or ${b}?`,
      options: shuffle([a, b, "Both have an equal number", "Cannot be determined"]),
      answer: higher,
    });
  });

  const yearPairs = buildPairs(YEAR_DATA, (y) => y.year, 32, null);
  yearPairs.forEach(([y1, y2]) => {
    const higherYear = y1.total > y2.total ? y1.year : y2.year;
    questions.push({
      id: qid++,
      category: "Compare Years",
      question: `In which year was India's total Ramsar Site count higher — ${y1.year} or ${y2.year}?`,
      options: shuffle([String(y1.year), String(y2.year), "Both were equal", "Cannot be determined"]),
      answer: String(higherYear),
    });
  });

  MANUAL_QUESTIONS.forEach((item) => {
    questions.push({ id: qid++, category: "General Facts", question: item.q, options: shuffle(item.opts), answer: item.ans });
  });

  return shuffle(questions);
}

function getRank(pct) {
  if (pct >= 90) return { label: "Wetland Grandmaster", icon: "🦆" };
  if (pct >= 75) return { label: "Ramsar Ranger", icon: "🐦" };
  if (pct >= 60) return { label: "Wetland Explorer", icon: "🌿" };
  if (pct >= 40) return { label: "Getting There — Keep Revising", icon: "📓" };
  return { label: "Time To Revisit The Notes", icon: "💧" };
}

/* =========================================================================
   STATE + RENDER
   ========================================================================= */

let state = {
  questions: buildAllQuestions(),
  index: 0,
  selected: null,
  score: { correct: 0, wrong: 0 },
  streak: 0,
  bestStreak: 0,
};

const wrap = document.getElementById("rq-wrap");
const LETTERS = ["A", "B", "C", "D"];

function icon(name, size = 16, extraAttrs = "") {
  return `<i data-lucide="${name}" style="width:${size}px;height:${size}px" ${extraAttrs}></i>`;
}

function renderScoreCard() {
  const { score, streak, bestStreak } = state;
  const attempted = score.correct + score.wrong;
  const accuracy = attempted > 0 ? Math.round((score.correct / attempted) * 100) : 0;
  return `
    <div class="rq-score-card">
      <div class="rq-score-title">${icon("trophy", 15)} Scoreboard</div>
      <div class="rq-score-main">
        <span class="rq-score-num">${score.correct}</span>
        <span class="rq-score-den">/ ${attempted} attempted</span>
      </div>
      <div class="rq-bar-track"><div class="rq-bar-fill" style="width:${accuracy}%"></div></div>
      <div class="rq-bar-label">${accuracy}% accuracy</div>

      <div class="rq-stat-row">
        <span>${icon("flame", 14, `class="rq-flame ${streak >= 3 ? "active" : ""}"`)} Current streak</span>
        <span>${streak}</span>
      </div>
      <div class="rq-stat-row">
        <span>Best streak</span>
        <span>${bestStreak}</span>
      </div>
      <div class="rq-stat-row">
        <span>Wrong answers</span>
        <span>${score.wrong}</span>
      </div>

      <button class="rq-restart-btn" id="rq-restart-side">${icon("rotate-ccw", 14)} Restart Quiz</button>
    </div>
  `;
}

function render() {
  const { questions, index, selected, score } = state;
  const total = questions.length;
  const finished = index >= total;
  const attempted = score.correct + score.wrong;
  const accuracy = attempted > 0 ? Math.round((score.correct / attempted) * 100) : 0;
  const progressPct = total > 0 ? Math.min(100, (index / total) * 100) : 0;

  let html = `
    <div class="rq-header">
      <div class="rq-eyebrow">${icon("leaf", 14)} SSC CGL &middot; 100 Wetlands of International Importance</div>
      <h1 class="rq-title">Ramsar Sites <em>Quiz</em></h1>
      <p class="rq-subtitle">${total}+ questions from the 2026 Ramsar notes &middot; answer reveals instantly &middot; score tracked live</p>
    </div>
  `;

  if (!finished) {
    html += `
      <div class="rq-progress-track">
        <div class="rq-progress-fill" style="width:${progressPct}%"></div>
        <div class="rq-progress-bird" style="left:${progressPct}%">${icon("bird", 14)}</div>
      </div>
      <div class="rq-progress-label">
        <span>Question ${index + 1} of ${total}</span>
        <span>${attempted} attempted</span>
      </div>
    `;
  }

  if (finished) {
    const rank = getRank(accuracy);
    html += `
      <div class="rq-grid">
        <div class="rq-card rq-complete">
          <div class="rq-complete-icon">${rank.icon}</div>
          <h2 class="rq-complete-title">Quiz Complete!</h2>
          <div class="rq-complete-rank">${rank.label}</div>
          <div class="rq-complete-score">${score.correct} / ${total}</div>
          <div class="rq-complete-acc">${accuracy}% accuracy &middot; best streak ${state.bestStreak}</div>
          <button class="rq-complete-btn" id="rq-restart-main">${icon("rotate-ccw", 16)} Restart Quiz</button>
        </div>
        <div class="rq-sidebar">${renderScoreCard()}</div>
      </div>
    `;
  } else {
    const current = questions[index];
    let optionsHtml = "";
    current.options.forEach((opt, i) => {
      const isSelected = selected === opt;
      const isCorrectOpt = opt === current.answer;
      let cls = "rq-opt";
      let extraIcon = "";
      if (selected !== null) {
        if (isCorrectOpt) { cls += " correct"; extraIcon = `<span class="rq-opt-icon">${icon("check-circle-2", 18)}</span>`; }
        else if (isSelected) { cls += " wrong"; extraIcon = `<span class="rq-opt-icon">${icon("x-circle", 18)}</span>`; }
      }
      optionsHtml += `
        <button class="${cls}" data-opt="${i}" ${selected !== null ? "disabled" : ""}>
          <span class="rq-opt-letter">${LETTERS[i]}</span>
          <span>${opt}</span>
          ${extraIcon}
        </button>
      `;
    });

    let feedbackHtml = "";
    if (selected !== null) {
      const isCorrect = selected === current.answer;
      feedbackHtml = `
        <div class="rq-feedback ${isCorrect ? "correct" : "wrong"}">
          ${isCorrect ? icon("check-circle-2", 16) + " Correct!" : icon("x-circle", 16) + " Not quite &mdash; correct answer is highlighted above."}
        </div>
        <button class="rq-next" id="rq-next-btn">${index + 1 === total ? "See Final Score" : "Next Question"} &rarr;</button>
      `;
    }

    html += `
      <div class="rq-grid">
        <div class="rq-card">
          <span class="rq-qnum">#${index + 1}</span>
          <div class="rq-cat-pill">${current.category}</div>
          <h2 class="rq-question">${current.question}</h2>
          <div class="rq-options">${optionsHtml}</div>
          ${feedbackHtml}
        </div>
        <div class="rq-sidebar">
          ${renderScoreCard()}
          <div class="rq-note-card">
            ${icon("sparkles", 16, 'style="flex:none;margin-top:2px;width:16px;height:16px"')}
            <span>Every option is graded the moment you tap it &mdash; the correct answer is always shown before you move on.</span>
          </div>
        </div>
      </div>
    `;
  }

  wrap.innerHTML = html;
  attachHandlers(finished);
  if (window.lucide) lucide.createIcons();
}

function attachHandlers(finished) {
  if (finished) {
    const restartMain = document.getElementById("rq-restart-main");
    if (restartMain) restartMain.addEventListener("click", handleRestart);
  } else {
    document.querySelectorAll(".rq-opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        const i = Number(btn.getAttribute("data-opt"));
        const current = state.questions[state.index];
        handleSelect(current.options[i]);
      });
    });
    const nextBtn = document.getElementById("rq-next-btn");
    if (nextBtn) nextBtn.addEventListener("click", handleNext);
  }
  const restartSide = document.getElementById("rq-restart-side");
  if (restartSide) restartSide.addEventListener("click", handleRestart);
}

function handleSelect(opt) {
  if (state.selected !== null) return;
  const current = state.questions[state.index];
  const isCorrect = opt === current.answer;
  state.selected = opt;
  state.score = {
    correct: state.score.correct + (isCorrect ? 1 : 0),
    wrong: state.score.wrong + (isCorrect ? 0 : 1),
  };
  state.streak = isCorrect ? state.streak + 1 : 0;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  render();
}

function handleNext() {
  state.selected = null;
  state.index += 1;
  render();
}

function handleRestart() {
  state = {
    questions: buildAllQuestions(),
    index: 0,
    selected: null,
    score: { correct: 0, wrong: 0 },
    streak: 0,
    bestStreak: 0,
  };
  render();
}

render();
</script>
